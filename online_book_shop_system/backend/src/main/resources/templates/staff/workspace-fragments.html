<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Staff Workspace</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f6f8;
            --surface: #ffffff;
            --border: #dfe3e8;
            --sidebar: #0b1730;
            --sidebar-2: #102042;
            --text: #0b1730;
            --muted: #64748b;
            --primary: #2563eb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .workspace {
            display: flex;
            min-height: 100vh;
        }

        .workspace-sidebar {
            width: 235px;
            background: linear-gradient(180deg, var(--sidebar), #081225);
            color: #fff;
            padding: 20px 16px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .workspace-brand {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .workspace-subbrand {
            font-size: 13px;
            color: #b8c4d9;
            margin-bottom: 14px;
        }

        .workspace-divider {
            height: 1px;
            background: rgba(255,255,255,.18);
            margin: 10px 0 18px;
        }

        .workspace-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .workspace-nav a {
            color: #dbe6ff;
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 14px;
            display: block;
            transition: .2s ease;
        }

        .workspace-nav a:hover,
        .workspace-nav a.active {
            background: rgba(255,255,255,.08);
            color: #fff;
        }

        .workspace-main {
            flex: 1;
            padding: 22px 18px;
        }

        .surface {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
        }

        .page-title {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
        }

        .subtle {
            color: var(--muted);
        }

        .stat-card {
            padding: 18px;
            min-height: 94px;
        }

        .stat-card .value {
            margin-top: 6px;
            font-size: 18px;
            font-weight: 800;
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 74px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: #eef2ff;
            color: #3730a3;
        }

        .workspace-toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .workspace-toolbar form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            width: 100%;
        }

        .workspace-toolbar .form-control {
            min-width: 260px;
            max-width: 420px;
        }
    </style>
</head>

<th:block th:fragment="sidebar(active)">
    <aside class="workspace-sidebar">
        <div class="workspace-brand">Staff Workspace</div>
        <div class="workspace-subbrand" th:text="${username}">Staff Name</div>
        <div class="workspace-divider"></div>

        <nav class="workspace-nav">
            <a th:href="@{/staff/workspace/dashboard}"
               th:classappend="${active == 'dashboard'} ? ' active' : ''">
                Dashboard
            </a>

            <a th:href="@{/staff/workspace/allocate}"
               th:classappend="${active == 'allocate'} ? ' active' : ''">
                Allocate / Pick
            </a>

            <a th:href="@{/staff/workspace/packing}"
               th:classappend="${active == 'packing'} ? ' active' : ''">
                Packing
            </a>

            <a th:href="@{/staff/workspace/shipping}"
               th:classappend="${active == 'shipping'} ? ' active' : ''">
                Shipping
            </a>

            <a th:href="@{/staff/workspace/delivery-return}"
               th:classappend="${active == 'delivery-return'} ? ' active' : ''">
                Delivery
            </a>
        </nav>
    </aside>
</th:block>

<th:block th:fragment="flash">
    <div th:if="${successMessage != null}" class="alert alert-success mb-3" th:text="${successMessage}">
        Success
    </div>
    <div th:if="${errorMessage != null}" class="alert alert-danger mb-3" th:text="${errorMessage}">
        Error
    </div>
</th:block>

<th:block th:fragment="allocateToolbar">
    <section class="surface p-4 mb-4">
        <div class="workspace-toolbar">
            <div>
                <h1 class="page-title mb-1">Allocate / Pick</h1>
                <div class="subtle">Tìm đơn cần cấp phát và xử lý pick sách.</div>
            </div>

            <form th:action="@{/staff/workspace/allocate}" method="get">
                <input type="text"
                       name="q"
                       class="form-control"
                       placeholder="Tìm theo mã đơn / khách hàng"
                       th:value="${filter != null ? filter.q : ''}">
                <button type="submit" class="btn btn-primary">Tìm</button>
                <a th:href="@{/staff/workspace/allocate}" class="btn btn-outline-secondary">Xóa lọc</a>
            </form>
        </div>

        <div th:if="${dbError != null}" class="alert alert-warning mb-0 mt-3">
            Không tải được dữ liệu:
            <span th:text="${dbError}">Database error</span>
        </div>
    </section>
</th:block>

<th:block th:fragment="filterBar(title, desc, actionUrl)">
    <section class="surface p-4 mb-4">
        <div class="workspace-toolbar">
            <div>
                <h1 class="page-title mb-1" th:text="${title}">Title</h1>
                <div class="subtle" th:text="${desc}">Description</div>
            </div>

            <form th:action="${actionUrl}" method="get" class="d-flex gap-2 flex-wrap align-items-center">
                <input type="text"
                       name="q"
                       class="form-control"
                       style="min-width: 300px;"
                       placeholder="Tìm theo mã đơn / khách hàng / SĐT"
                       th:value="${q != null ? q : (filter != null ? filter.q : '')}">

                <select name="status" class="form-select" style="min-width:180px; max-width:220px;">
                    <option value="">Tất cả trạng thái</option>
                    <option th:if="${title == 'Allocate / Reserve'}" value="CONFIRMED" th:selected="${status == 'CONFIRMED'}">CONFIRMED</option>

                    <option th:if="${title == 'Packing'}" value="PICKED" th:selected="${status == 'PICKED'}">PICKED</option>
                    <option th:if="${title == 'Packing'}" value="PACKED" th:selected="${status == 'PACKED'}">PACKED</option>

                    <option th:if="${title == 'Shipping'}" value="PACKED" th:selected="${status == 'PACKED'}">PACKED</option>
                    <option th:if="${title == 'Shipping'}" value="SHIPPED" th:selected="${status == 'SHIPPED'}">SHIPPED</option>

                    <option th:if="${title == 'Delivery / Return'}" value="SHIPPED"          th:selected="${status == 'SHIPPED'}">SHIPPED — Đang giao</option>
                    <option th:if="${title == 'Delivery / Return'}" value="COMPLETED"        th:selected="${status == 'COMPLETED'}">COMPLETED — Thành công</option>
                    <option th:if="${title == 'Delivery / Return'}" value="DELIVERY_FAILED"  th:selected="${status == 'DELIVERY_FAILED'}">DELIVERY_FAILED — Giao thất bại</option>
                    <option th:if="${title == 'Delivery / Return'}" value="CANCELLED"        th:selected="${status == 'CANCELLED'}">CANCELLED — Đã hủy</option>
                </select>

                <button type="submit" class="btn btn-primary">Tìm</button>
                <a th:href="${actionUrl}" class="btn btn-outline-secondary">Xóa lọc</a>
            </form>
        </div>
    </section>
</th:block>
</body>
</html>
