<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Staff Workspace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg:#f6f8fb; --surface:#ffffff; --sidebar:#111827; --sidebar-muted:#9ca3af;
            --sidebar-active:#1f2937; --text:#0f172a; --line:#e5e7eb; --chip:#eef2ff; --chip-text:#3730a3;
        }
        body{background:var(--bg);color:var(--text)}
        .workspace{min-height:100vh;display:flex}
        .workspace-sidebar{width:264px;min-height:100vh;background:var(--sidebar);padding:24px 16px;position:sticky;top:0}
        .workspace-sidebar a{display:block;padding:12px 14px;border-radius:14px;color:var(--sidebar-muted);text-decoration:none;font-weight:600;margin-bottom:8px}
        .workspace-sidebar a.active,.workspace-sidebar a:hover{background:var(--sidebar-active);color:#fff}
        .workspace-main{flex:1;padding:24px}
        .surface{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(15,23,42,.05)}
        .stat-card{padding:20px}.stat-card .value{font-size:30px;font-weight:800}
        .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
        .chip{display:inline-flex;align-items:center;padding:5px 10px;border-radius:999px;background:var(--chip);color:var(--chip-text);font-size:12px;font-weight:700}
        .accordion-button{background:#fff;border-radius:20px!important;box-shadow:none}
        .accordion-button:not(.collapsed){color:inherit;background:#fff;box-shadow:none}
        .accordion-item{border:none;background:transparent}
        .bulk-bar{position:sticky;bottom:16px;z-index:10}
        .page-title{font-size:30px;font-weight:800;margin:0}
        .subtle{color:#64748b}
    </style>
</th:block>

<th:block th:fragment="sidebar(stage)">
    <aside class="workspace-sidebar">
        <div class="mb-4 pb-2 border-bottom border-secondary-subtle">
            <div class="text-white fw-bold fs-4">Staff Workspace</div>
            <div class="small" style="color:var(--sidebar-muted)">State-based processing</div>
        </div>
        <nav>
            <a th:href="@{/staff/workspace/dashboard}" th:classappend="${stage == 'dashboard'} ? 'active'">Dashboard</a>
            <a th:href="@{/staff/workspace/confirmed}" th:classappend="${stage == 'confirmed'} ? 'active'">Confirmed Order</a>
            <a th:href="@{/staff/workspace/allocate}" th:classappend="${stage == 'allocate'} ? 'active'">Allocate / Pick</a>
            <a th:href="@{/staff/workspace/packing}" th:classappend="${stage == 'packing'} ? 'active'">Packing</a>
            <a th:href="@{/staff/workspace/shipping}" th:classappend="${stage == 'shipping'} ? 'active'">Shipping</a>
            <a th:href="@{/staff/workspace/delivery-return}" th:classappend="${stage == 'delivery-return'} ? 'active'">Delivery / Return</a>
        </nav>
    </aside>
</th:block>

<th:block th:fragment="flash">
    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
</th:block>

<th:block th:fragment="filterBar(title, subtitle)">
    <section class="surface p-4 mb-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
                <h1 class="page-title" th:text="${title}">Workspace</h1>
                <div class="subtle" th:text="${subtitle}">Subtitle</div>
            </div>
            <form method="get" class="d-flex flex-wrap gap-2">
                <input class="form-control" style="width:240px" name="q" placeholder="mã đơn / tên / sđt" th:value="${filter.q}">
                <select class="form-select" style="width:180px" name="paymentStatus">
                    <option value="">Tất cả thanh toán</option>
                    <option value="PENDING" th:selected="${filter.paymentStatus == 'PENDING'}">PENDING</option>
                    <option value="PAID" th:selected="${filter.paymentStatus == 'PAID'}">PAID</option>
                    <option value="FAILED" th:selected="${filter.paymentStatus == 'FAILED'}">FAILED</option>
                    <option value="REFUNDED" th:selected="${filter.paymentStatus == 'REFUNDED'}">REFUNDED</option>
                </select>
                <select class="form-select" style="width:180px" name="sort">
                    <option value="placedAtDesc" th:selected="${filter.sort == null or filter.sort == '' or filter.sort == 'placedAtDesc'}">Mới nhất</option>
                    <option value="placedAtAsc" th:selected="${filter.sort == 'placedAtAsc'}">Cũ nhất</option>
                    <option value="totalDesc" th:selected="${filter.sort == 'totalDesc'}">Tổng tiền giảm dần</option>
                    <option value="totalAsc" th:selected="${filter.sort == 'totalAsc'}">Tổng tiền tăng dần</option>
                </select>
                <button class="btn btn-primary">Lọc</button>
            </form>
        </div>
    </section>
</th:block>
</body>
</html>
