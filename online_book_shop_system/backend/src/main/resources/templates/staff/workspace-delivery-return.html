<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{staff/workspace-fragments :: head('Staff Workspace - Delivery')}"></head>
<body>
<div class="workspace">
  <th:block th:replace="~{staff/workspace-fragments :: sidebar('delivery-return')}"></th:block>

  <main class="workspace-main">
    <th:block th:replace="~{staff/workspace-fragments :: flash}"></th:block>
    <th:block th:replace="~{staff/workspace-fragments :: filterBar('Delivery','Theo dõi đơn đã ship và xử lý state cuối tại đây.', '/staff/workspace/delivery-return')}"></th:block>

      <div class="accordion" id="deliveryAccordion">
        <div class="accordion-item mb-3" th:each="o : ${orders}">
          <div class="surface">
            <h2 class="accordion-header d-flex align-items-center">
              <button class="accordion-button collapsed" type="button"
                      data-bs-toggle="collapse"
                      th:data-bs-target="${'#d-' + o.id}">
                <div class="w-100 pe-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                  <div>
                    <div class="mono fw-bold" th:text="${o.orderCode}">ORD</div>
                    <div class="subtle">
                      <span th:text="${o.shipName}"></span> ·
                      <span th:text="${o.shipPhone}"></span>
                    </div>
                  </div>

                  <div class="d-flex flex-wrap gap-2">
                    <span class="chip" th:text="${o.status}">STATUS</span>

                    <!-- SHIPPED: chưa giao -->
                    <span class="chip" th:if="${o.status == 'SHIPPED'}">
                      🚚 Chưa giao
                    </span>

                    <!-- COMPLETED: Completed at + time -->
                    <span class="chip chip-success"
                          th:if="${o.status == 'COMPLETED'}"
                          th:text="${'✅ Completed ' + (o.completedAt != null ? #temporals.format(o.completedAt, 'dd/MM HH:mm') : '')}">
                    </span>

                    <!-- CANCELLED: Thất bại at + time -->
                    <span class="chip chip-danger"
                          th:if="${o.status == 'CANCELLED'}"
                          th:text="${'❌ Thất bại ' + (o.cancelledAt != null ? #temporals.format(o.cancelledAt, 'dd/MM HH:mm') : '')}">
                    </span>

                    <!-- Other statuses: show shipped/delivered times -->
                    <span class="chip"
                          th:if="${o.status != 'SHIPPED' and o.status != 'COMPLETED' and o.status != 'CANCELLED'}"
                          th:text="${o.shippedAt != null ? 'Ship ' + #temporals.format(o.shippedAt, 'dd/MM HH:mm') : 'Chưa ship'}">
                    </span>
                    <span class="chip"
                          th:if="${o.status != 'SHIPPED' and o.status != 'COMPLETED' and o.status != 'CANCELLED'}"
                          th:text="${o.deliveredAt != null ? 'Delivered ' + #temporals.format(o.deliveredAt, 'dd/MM HH:mm') : 'Chưa giao'}">
                    </span>
                  </div>
                </div>
              </button>
            </h2>

            <div class="accordion-collapse collapse"
                 th:id="${'d-' + o.id}"
                 data-bs-parent="#deliveryAccordion">
              <div class="accordion-body border-top">
                <div class="row g-3 align-items-center">
                  <div class="col-lg-8">
                    <div>
                      <b>Tổng tiền:</b>
                      <span th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'"></span>
                    </div>
                    <div>
                      <b>Ngày đặt:</b>
                      <span th:text="${o.placedAt != null ? #temporals.format(o.placedAt, 'dd/MM/yyyy HH:mm') : '-'}"></span>
                    </div>
                  </div>

                  <div class="col-lg-4 text-lg-end d-grid gap-2">
                    <a class="btn btn-outline-secondary"
                       th:href="@{/staff/orders/{id}(id=${o.id})}">
                      Chi tiết đơn
                    </a>

                    <!-- Actions for SHIPPED orders -->
                    <div th:if="${o.status == 'SHIPPED'}" class="d-grid gap-2">
                      <!-- Success: SHIPPED → COMPLETED -->
                      <form th:action="@{/staff/workspace/delivery-return/{id}/success(id=${o.id})}" method="post">
                        <button type="submit" class="btn btn-success w-100">
                          ✅ Giao thành công
                        </button>
                      </form>

                      <!-- Fail: SHIPPED → DELIVERY_FAILED -->
                      <button type="button" class="btn btn-danger"
                              data-bs-toggle="modal"
                              th:data-bs-target="${'#failModal-' + o.id}">
                        ❌ Giao thất bại
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div th:if="${orders == null or #lists.isEmpty(orders)}"
             class="surface p-5 text-center text-muted">
          Không có đơn ở trạng thái giao hàng.
        </div>
      </div>

    <th:block th:each="o : ${orders}">

      <!-- Giao thất bại modal -->
      <div class="modal fade" th:id="${'failModal-' + o.id}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content" style="border-radius:18px;">
            <div class="modal-header">
              <div>
                <h5 class="modal-title mb-1">❌ Giao hàng thất bại</h5>
                <div class="text-muted small">
                  Đơn: <span class="mono" th:text="${o.orderCode}"></span>
                </div>
              </div>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/staff/workspace/delivery-return/{id}/fail(id=${o.id})}" method="post">
              <div class="modal-body">
                <div class="mb-3">
                  <label class="form-label fw-semibold">Lý do giao thất bại</label>
                  <input class="form-control"
                         name="reason"
                         placeholder="Ví dụ: Khách không nhận, địa chỉ sai, không liên lạc được..."
                         required>
                </div>
                <div class="alert alert-danger mb-0">
                  Đơn hàng sẽ chuyển sang trạng thái <strong>CANCELLED</strong>.
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                <button type="submit" class="btn btn-danger">Xác nhận thất bại</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </th:block>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
