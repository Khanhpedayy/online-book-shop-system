<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{staff/workspace-fragments :: head('Staff Workspace - Packing')}"></head>
<body>
<div class="workspace">
    <th:block th:replace="~{staff/workspace-fragments :: sidebar('packing')}"></th:block>

    <main class="workspace-main">
        <th:block th:replace="~{staff/workspace-fragments :: flash}"></th:block>

        <section class="surface p-4 mb-4">
            <h1 class="page-title mb-2">Đơn chờ đóng gói</h1>
            <div class="subtle">Nguồn dữ liệu: phiếu xuất đã PICKED, không có ngoại lệ.</div>
        </section>

        <section class="surface p-4">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Mã đơn</th>
                        <th>Mã phiếu</th>
                        <th>Khách</th>
                        <th>Khu vực</th>
                        <th>Items</th>
                        <th>Thanh toán</th>
                        <th>Tổng tiền</th>
                        <th>COD cần thu</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${rows}">
                        <td class="mono" th:text="${r.orderCode}">ORD-001</td>
                        <td class="mono" th:text="${r.stockOutCode}">SO-001</td>
                        <td>
                            <div class="fw-semibold" th:text="${r.shipName}">Khách</div>
                            <div class="small text-muted" th:text="${r.shipPhone}">0900...</div>
                        </td>
                        <td th:text="${r.area}">Q1 / HCM</td>
                        <td th:text="${r.itemCount}">2</td>
                        <td th:text="${r.paymentStatus}">PENDING</td>
                        <td th:text="${#numbers.formatDecimal(r.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</td>
                        <td th:text="${#numbers.formatDecimal(r.paymentStatus == 'PAID' ? 0 : r.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</td>
                        <td>
                            <a class="btn btn-primary btn-sm"
                               th:href="@{/staff/packing/orders/{id}(id=${r.orderId})}">
                                Đóng gói
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${rows == null or #lists.isEmpty(rows)}">
                        <td colspan="9" class="text-center text-muted py-4">Không có đơn chờ đóng gói.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
