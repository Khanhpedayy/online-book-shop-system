<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{staff/workspace-fragments :: head('Staff Workspace - Packing')}"></head>
<body>
<div class="workspace">
    <th:block th:replace="~{staff/workspace-fragments :: sidebar('packing')}"></th:block>

    <main class="workspace-main">
        <th:block th:replace="~{staff/workspace-fragments :: flash}"></th:block>
        <th:block th:replace="~{staff/workspace-fragments :: filterBar('Packing','Đơn đã pick đủ sẽ được đóng gói ở state này. Có thể mark packed từng lô và in packing slip / invoice hàng loạt.')}"></th:block>

        <form id="bulkPackForm" method="post" th:action="@{/staff/workspace/packing/bulk-pack}">
            <div class="accordion" id="packingAccordion">
                <div class="accordion-item mb-3" th:each="o : ${orders}">
                    <div class="surface">
                        <h2 class="accordion-header d-flex align-items-center">
                            <div class="px-3">
                                <input class="form-check-input order-checkbox"
                                       type="checkbox"
                                       name="orderIds"
                                       th:value="${o.id}">
                            </div>

                            <button class="accordion-button collapsed"
                                    type="button"
                                    data-bs-toggle="collapse"
                                    th:data-bs-target="${'#p-' + o.id}">
                                <div class="w-100 pe-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                                    <div>
                                        <div class="mono fw-bold" th:text="${o.orderCode}"></div>
                                        <div class="subtle">
                                            <span th:text="${o.shipName}"></span>
                                            ·
                                            <span th:text="${o.shipPhone}"></span>
                                        </div>
                                    </div>

                                    <div class="d-flex flex-wrap gap-2">
                                        <span class="chip" th:text="${o.pickedCount + '/' + o.itemCount + ' picked'}"></span>
                                        <span class="chip" th:text="${o.paymentStatus}"></span>
                                    </div>
                                </div>
                            </button>
                        </h2>

                        <div class="accordion-collapse collapse"
                             th:id="${'p-' + o.id}"
                             data-bs-parent="#packingAccordion">
                            <div class="accordion-body border-top">
                                <div class="row g-3">
                                    <div class="col-lg-8">
                                        <div class="mb-2">
                                            <b>Tổng tiền:</b>
                                            <span th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'"></span>
                                        </div>
                                        <div class="mb-2">
                                            <b>Đặt lúc:</b>
                                            <span th:text="${o.placedAt != null ? #temporals.format(o.placedAt, 'dd/MM/yyyy HH:mm') : '-'}"></span>
                                        </div>
                                        <div class="mb-2">
                                            <b>Picked:</b>
                                            <span th:text="${o.pickedCount}"></span>
                                            /
                                            <span th:text="${o.itemCount}"></span>
                                        </div>
                                    </div>

                                    <div class="col-lg-4 text-lg-end">
                                        <a class="btn btn-outline-secondary"
                                           th:href="@{/staff/orders/{id}(id=${o.id})}">
                                            Chi tiết đơn
                                        </a>
                                    </div>
                                </div>

                                <hr>

                                <div class="row g-3">
                                    <div class="col-md-2">
                                        <label class="form-label fw-semibold">Boxes</label>
                                        <input class="form-control"
                                               type="number"
                                               min="1"
                                               value="1"
                                               th:name="${'boxCount_' + o.id}">
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Packaging info</label>
                                        <input class="form-control"
                                               type="text"
                                               th:name="${'packingNote_' + o.id}"
                                               placeholder="Bubble wrap / fragile / split into 2 boxes / gift wrap...">
                                    </div>

                                    <div class="col-md-4 d-flex align-items-end gap-2 flex-wrap">
                                        <a class="btn btn-outline-primary"
                                           target="_blank"
                                           th:href="@{/staff/orders/{orderId}/packing-slip(orderId=${o.id})}">
                                            Print slip
                                        </a>

                                        <a class="btn btn-outline-dark"
                                           target="_blank"
                                           th:href="@{/staff/workspace/invoice/{orderId}(orderId=${o.id})}">
                                            Print invoice
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${orders == null or #lists.isEmpty(orders)}"
                     class="surface p-5 text-center text-muted">
                    Không có đơn sẵn sàng pack.
                </div>
            </div>

            <div class="bulk-bar mt-3">
                <div class="surface p-3 d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
                    <div>
                        Đây là batch packing. Mỗi order có box count / packing info riêng.
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-outline-primary" onclick="bulkPrintSlip()">
                            Print selected slips
                        </button>

                        <button type="button" class="btn btn-outline-dark" onclick="bulkPrintInvoice()">
                            Print selected invoices
                        </button>

                        <button type="submit" class="btn btn-primary">
                            Mark packed selected
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function getSelectedOrderIds() {
        return Array.from(document.querySelectorAll('.order-checkbox:checked'))
            .map(cb => cb.value)
            .filter(v => v && v.trim() !== '');
    }

    function bulkPrintSlip() {
        const ids = getSelectedOrderIds();
        if (ids.length === 0) {
            alert('Bạn chưa chọn đơn nào.');
            return;
        }
        const url = '/staff/workspace/packing-slip/bulk?orderIds=' + ids.join('&orderIds=');
        window.open(url, '_blank');
    }

    function bulkPrintInvoice() {
        const ids = getSelectedOrderIds();
        if (ids.length === 0) {
            alert('Bạn chưa chọn đơn nào.');
            return;
        }
        const url = '/staff/workspace/invoice/bulk?orderIds=' + ids.join('&orderIds=');
        window.open(url, '_blank');
    }
</script>
</body>
</html>
