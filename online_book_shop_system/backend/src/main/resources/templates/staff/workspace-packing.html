<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{staff/workspace-fragments :: head('Staff Workspace - Packing')}"></head>
<body>
<div class="workspace">
    <th:block th:replace="~{staff/workspace-fragments :: sidebar('packing')}"></th:block>
    <main class="workspace-main">
        <th:block th:replace="~{staff/workspace-fragments :: flash}"></th:block>
        <th:block th:replace="~{staff/workspace-fragments :: filterBar('Packing','Đơn đã pick đủ sẽ được đóng gói hàng loạt ở state này.')}"></th:block>
        <form method="post" th:action="@{/staff/workspace/packing/bulk-pack}">
            <div class="accordion" id="packingAccordion">
                <div class="accordion-item mb-3" th:each="o : ${orders}">
                    <div class="surface">
                        <h2 class="accordion-header d-flex align-items-center">
                            <div class="px-3"><input class="form-check-input" type="checkbox" name="orderIds" th:value="${o.id}"></div>
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" th:data-bs-target="${'#p-' + o.id}">
                                <div class="w-100 pe-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                                    <div>
                                        <div class="mono fw-bold" th:text="${o.orderCode}"></div>
                                        <div class="subtle"><span th:text="${o.shipName}"></span> · <span th:text="${o.shipPhone}"></span></div>
                                    </div>
                                    <div class="d-flex flex-wrap gap-2">
                                        <span class="chip" th:text="${o.pickedCount + '/' + o.itemCount + ' picked'}"></span>
                                        <span class="chip" th:text="${o.paymentStatus}"></span>
                                    </div>
                                </div>
                            </button>
                        </h2>
                        <div class="accordion-collapse collapse" th:id="${'p-' + o.id}" data-bs-parent="#packingAccordion">
                            <div class="accordion-body border-top">
                                <div class="row g-3 align-items-center">
                                    <div class="col-lg-8">
                                        <div><b>Tổng tiền:</b> <span th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'"></span></div>
                                        <div><b>Đặt lúc:</b> <span th:text="${o.placedAt != null ? #temporals.format(o.placedAt, 'dd/MM/yyyy HH:mm') : '-'}"></span></div>
                                    </div>
                                    <div class="col-lg-4 text-lg-end">
                                        <a class="btn btn-outline-secondary" th:href="@{/staff/orders/{id}(id=${o.id})}">Chi tiết đơn</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:if="${orders == null or #lists.isEmpty(orders)}" class="surface p-5 text-center text-muted">Không có đơn sẵn sàng pack.</div>
            </div>
            <div class="bulk-bar mt-3">
                <div class="surface p-3 d-flex justify-content-between align-items-center">
                    <div>Đây là batch packing. Chỉ đơn đã pick đủ mới hiện ở đây.</div>
                    <button class="btn btn-primary">Mark packed selected</button>
                </div>
            </div>
        </form>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
