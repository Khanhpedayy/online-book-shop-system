<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Phiếu giao hàng</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .mono { font-family: Consolas, monospace; }
    .row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    .totals { margin-top: 16px; width: 320px; margin-left: auto; }
    .totals div { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .big { font-size: 20px; font-weight: bold; }
    @media print {
        .no-print { display: none; }
    }
  </style>
</head>
<body>
<div class="no-print" style="margin-bottom:16px;">
  <button onclick="window.print()">In phiếu</button>
</div>

<h1>Phiếu giao hàng</h1>

<div class="row">
  <div><b>Mã đơn:</b> <span class="mono" th:text="${view.orderCode}">ORD-001</span></div>
  <div><b>Trạng thái thanh toán:</b> <span th:text="${view.paymentStatus}">PENDING</span></div>
</div>

<div class="row">
  <div><b>Khách:</b> <span th:text="${view.shipName}">Khách A</span></div>
  <div><b>SĐT:</b> <span th:text="${view.shipPhone}">0900...</span></div>
</div>

<div class="row">
  <div><b>Địa chỉ:</b> <span th:text="${view.fullAddress()}">Địa chỉ</span></div>
</div>

<div class="row">
  <div><b>Ghi chú khách:</b> <span th:text="${view.customerNote != null ? view.customerNote : '-'}">-</span></div>
</div>

<table>
  <thead>
  <tr>
    <th>Tên sách</th>
    <th>SKU</th>
    <th>Copy code</th>
    <th>SL</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="it : ${view.items}">
    <td th:text="${it.titleSnapshot}">Tên sách</td>
    <td class="mono" th:text="${it.skuSnapshot}">SKU</td>
    <td class="mono" th:text="${it.copyCodeSnapshot}">CP-001</td>
    <td th:text="${it.quantity}">1</td>
  </tr>
  </tbody>
</table>

<div class="totals">
  <div><span>Subtotal</span><span th:text="${#numbers.formatDecimal(view.subtotalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'">0</span></div>
  <div><span>Shipping</span><span th:text="${#numbers.formatDecimal(view.shippingFee, 0, 'COMMA', 0, 'POINT')} + ' VND'">0</span></div>
  <div><span>Discount</span><span th:text="${#numbers.formatDecimal(view.discountAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'">0</span></div>
  <div class="big"><span>Total</span><span th:text="${#numbers.formatDecimal(view.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'">0</span></div>
  <div class="big" style="color:#c62828;"><span>COD cần thu</span><span th:text="${#numbers.formatDecimal(view.codDue(), 0, 'COMMA', 0, 'POINT')} + ' VND'">0</span></div>
</div>
</body>
</html>
