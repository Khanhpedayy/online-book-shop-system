<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Lookup | Staff</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;}</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-semibold" th:href="@{/staff/dashboard}">Staff Panel</a>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" th:href="@{/staff/orders}">Orders</a>
      <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Logout</a>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h1 class="h4 mb-1">Customer Lookup</h1>
      <div class="text-muted">Tìm theo tên / email / phone</div>
    </div>
  </div>

  <div class="card border-0 shadow-sm mb-3">
    <div class="card-body">
      <form class="row g-2" method="get" th:action="@{/staff/customers}">
        <div class="col-12 col-md-8">
          <label class="form-label small text-muted">Search</label>
          <input class="form-control form-control-sm" name="q" th:value="${q}" placeholder="Nguyễn / email / 09xx..." />
        </div>
        <div class="col-12 col-md-4 d-flex gap-2 align-items-end">
          <button class="btn btn-sm btn-primary" type="submit">Search</button>
          <a class="btn btn-sm btn-outline-secondary" th:href="@{/staff/customers}">Reset</a>
        </div>
      </form>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body table-responsive">
      <table class="table align-middle">
        <thead>
        <tr class="text-muted small">
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${rows}">
          <td class="mono" th:text="${u.id}">1</td>
          <td th:text="${u.fullName}">Name</td>
          <td class="mono" th:text="${u.email}">mail</td>
          <td class="mono" th:text="${u.phone}">phone</td>
          <td><span class="badge text-bg-light border mono" th:text="${u.status}">ACTIVE</span></td>
        </tr>
        <tr th:if="${rows == null or #lists.isEmpty(rows)}">
          <td colspan="5" class="text-center text-muted py-4">No users.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
