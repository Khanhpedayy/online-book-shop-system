<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{staff/workspace-fragments :: head('Staff Workspace - Allocate')}"></head>
<body>
<div class="workspace">
    <th:block th:replace="~{staff/workspace-fragments :: sidebar('allocate')}"></th:block>

    <main class="workspace-main">
        <th:block th:replace="~{staff/workspace-fragments :: flash}"></th:block>
        <th:block th:replace="~{staff/workspace-fragments :: filterBar('Allocate / Reserve','Đơn CONFIRMED sẽ được reserve copy ở màn này. Sau đó vào chi tiết đơn để tạo phiếu xuất.', '/staff/workspace/allocate')}"></th:block>

        <div class="accordion" id="allocateAccordion">
            <div class="accordion-item mb-3" th:each="o : ${orders}">
                <div class="surface">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button"
                                data-bs-toggle="collapse"
                                th:data-bs-target="${'#a-' + o.id}">
                            <div class="w-100 pe-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                                <div>
                                    <div class="mono fw-bold" th:text="${o.orderCode}">ORD</div>
                                    <div class="subtle">
                                        <span th:text="${o.shipName}"></span> ·
                                        <span th:text="${o.shipPhone}"></span>
                                    </div>
                                </div>
                                <div class="d-flex flex-wrap gap-2">
                                    <span class="chip" th:text="${o.allocatedCount + '/' + o.itemCount + ' allocated'}"></span>
                                    <span class="chip" th:text="${o.pickedCount + '/' + o.itemCount + ' picked'}"></span>
                                    <span class="chip" th:text="${o.paymentStatus}"></span>
                                </div>
                            </div>
                        </button>
                    </h2>

                    <div class="accordion-collapse collapse" th:id="${'a-' + o.id}" data-bs-parent="#allocateAccordion">
                        <div class="accordion-body border-top">
                            <div class="row g-3 align-items-center">
                                <div class="col-lg-8">
                                    <div><b>Tổng tiền:</b>
                                        <span th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'"></span>
                                    </div>
                                    <div><b>Đặt lúc:</b>
                                        <span th:text="${o.placedAt != null ? #temporals.format(o.placedAt, 'dd/MM/yyyy HH:mm') : '-'}"></span>
                                    </div>
                                    <div><b>Tiến độ:</b>
                                        allocated <span th:text="${o.allocatedCount}"></span>
                                        / picked <span th:text="${o.pickedCount}"></span>
                                        / total <span th:text="${o.itemCount}"></span>
                                    </div>

                                    <div class="alert alert-success mt-3 mb-0"
                                         th:if="${o.allocatedCount != null and o.itemCount != null and o.allocatedCount >= o.itemCount}">
                                        Đơn đã allocate đủ. Vào chi tiết đơn để tạo phiếu xuất kho.
                                    </div>

<!--                                    <div class="alert alert-warning mt-3 mb-0"-->
<!--                                         th:if="${o.allocatedCount == null or o.itemCount == null or o.allocatedCount < o.itemCount}">-->
<!--                                        Bấm Auto allocate để reserve copy theo FIFO.-->
<!--                                    </div>-->
                                </div>

                                <div class="col-lg-4">
                                    <div class="d-grid gap-2">
<!--                                        <form method="post" th:action="@{/staff/orders/{id}/allocate-auto(id=${o.id})}">-->
<!--                                            <bQtton class="btn btn-primary w-100"-->
<!--                                                    type="submit"-->
<!--                                                    th:disabled="${o.allocatedCount != null and o.itemCount != null and o.allocatedCount >= o.itemCount}">-->
<!--                                                Auto allocate-->
<!--                                            </bQtton>-->
<!--                                        </form>-->

                                        <a class="btn btn-outline-secondary"
                                           th:href="@{/staff/orders/{id}(id=${o.id})}">
                                             Allocate
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${orders == null or #lists.isEmpty(orders)}" class="surface p-5 text-center text-muted">
                Không có đơn cần allocate.
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
