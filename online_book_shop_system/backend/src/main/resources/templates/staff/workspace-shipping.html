<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{staff/workspace-fragments :: head('Staff Workspace - Shipping')}"></head>
<body>
<div class="workspace">
    <th:block th:replace="~{staff/workspace-fragments :: sidebar('shipping')}"></th:block>
    <main class="workspace-main">
        <th:block th:replace="~{staff/workspace-fragments :: flash}"></th:block>
        <th:block th:replace="~{staff/workspace-fragments :: filterBar('Shipping','Đơn PACKED sẽ được chuyển sang SHIPPED theo lô ở màn này.')}"></th:block>
        <form method="post" th:action="@{/staff/workspace/shipping/bulk-ship}">
            <div class="surface p-3 mb-3 d-flex flex-wrap gap-2 align-items-center justify-content-between">
                <div class="subtle">Carrier áp dụng cho cả lô ship.</div>
                <div class="d-flex gap-2">
                    <input class="form-control" style="width:220px" name="carrier" placeholder="VD: GHTK / GHN / J&T">
                    <button class="btn btn-primary">Ship selected</button>
                </div>
            </div>
            <div class="accordion" id="shippingAccordion">
                <div class="accordion-item mb-3" th:each="o : ${orders}">
                    <div class="surface">
                        <h2 class="accordion-header d-flex align-items-center">
                            <div class="px-3"><input class="form-check-input" type="checkbox" name="orderIds" th:value="${o.id}"></div>
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" th:data-bs-target="${'#s-' + o.id}">
                                <div class="w-100 pe-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                                    <div>
                                        <div class="mono fw-bold" th:text="${o.orderCode}"></div>
                                        <div class="subtle"><span th:text="${o.shipName}"></span> · <span th:text="${o.shipPhone}"></span></div>
                                    </div>
                                    <div class="d-flex flex-wrap gap-2">
                                        <span class="chip" th:text="${o.status}"></span>
                                        <span class="chip" th:text="${o.itemCount + ' items'}"></span>
                                    </div>
                                </div>
                            </button>
                        </h2>
                        <div class="accordion-collapse collapse" th:id="${'s-' + o.id}" data-bs-parent="#shippingAccordion">
                            <div class="accordion-body border-top">
                                <div class="row g-3 align-items-center">
                                    <div class="col-lg-8">
                                        <div><b>Tổng tiền:</b> <span th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'"></span></div>
                                        <div><b>Đặt lúc:</b> <span th:text="${o.placedAt != null ? #temporals.format(o.placedAt, 'dd/MM/yyyy HH:mm') : '-'}"></span></div>
                                    </div>
                                    <div class="col-lg-4 text-lg-end">
                                        <a class="btn btn-outline-secondary" th:href="@{/staff/orders/{id}(id=${o.id})}">Chi tiết đơn</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:if="${orders == null or #lists.isEmpty(orders)}" class="surface p-5 text-center text-muted">Không có đơn chờ ship.</div>
            </div>
        </form>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
