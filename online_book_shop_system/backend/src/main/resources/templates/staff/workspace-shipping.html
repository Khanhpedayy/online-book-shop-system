<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{staff/workspace-fragments :: head('Staff Workspace - Shipping')}"></head>
<body>
<div class="workspace">
    <th:block th:replace="~{staff/workspace-fragments :: sidebar('shipping')}"></th:block>

    <main class="workspace-main">
        <th:block th:replace="~{staff/workspace-fragments :: flash}"></th:block>

        <!-- HEADER -->
        <section class="surface p-4 mb-4">
            <h1 class="page-title mb-2">Đơn chờ giao</h1>
            <div class="subtle">
                Hiển thị các đơn PACKED hoặc SHIPPED. Nếu khách đã trả tiền thì COD cần thu = 0đ.
            </div>
        </section>

        <!-- TABLE -->
        <section class="surface p-4">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Mã đơn</th>
                        <th>Khách</th>
                        <th>Địa chỉ</th>
                        <th>Thanh toán</th>
                        <th>Tổng tiền</th>
                        <th>COD cần thu</th>
                        <th>Trạng thái</th>
                        <th>Packed at</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="r : ${rows}">
                        <td class="mono" th:text="${r.orderCode}">ORD-001</td>

                        <td>
                            <div class="fw-semibold" th:text="${r.shipName}">Khách</div>
                            <div class="small text-muted" th:text="${r.shipPhone}">0900</div>
                        </td>

                        <td th:text="${r.address}">Địa chỉ</td>

                        <td th:text="${r.paymentStatus}">PENDING</td>

                        <td th:text="${#numbers.formatDecimal(r.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'">
                            0
                        </td>

                        <td class="text-danger fw-semibold"
                            th:text="${#numbers.formatDecimal(r.paymentStatus == 'PAID' ? 0 : r.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'">
                            0
                        </td>

                        <td>
                            <span class="chip" th:text="${r.orderStatus}">PACKED</span>
                        </td>

                        <td th:text="${r.packedAt != null ? #temporals.format(r.packedAt, 'dd/MM/yyyy HH:mm') : '-'}">
                            -
                        </td>

                        <!-- ACTION -->
                        <td>
                            <!-- CHƯA SHIPPED -->
                            <div th:if="${r.orderStatus != 'SHIPPED'}">
                                <form th:action="@{/staff/orders/{id}/ship/confirm(id=${r.orderId})}"
                                      method="post"
                                      class="d-flex gap-2">

                                    <input type="text"
                                           name="carrier"
                                           class="form-control form-control-sm"
                                           th:value="${r.carrier}"
                                           placeholder="Nhập carrier"
                                           required />

                                    <button type="submit" class="btn btn-success btn-sm">
                                        Giao đơn
                                    </button>
                                </form>
                            </div>

                            <!-- ĐÃ SHIPPED -->
                            <div th:if="${r.orderStatus == 'SHIPPED'}">
                                <div class="text-success small fw-semibold">
                                    Shipped by: <span th:text="${#strings.isEmpty(r.carrier) ? 'N/A' : r.carrier}"></span>
                                </div>
                            </div>

                            <!-- CHI TIẾT -->
                            <a class="btn btn-outline-secondary btn-sm mt-1"
                               th:href="@{/staff/orders/{id}(id=${r.orderId})}">
                                Chi tiết
                            </a>
                        </td>
                    </tr>

                    <!-- EMPTY -->
                    <tr th:if="${rows == null or #lists.isEmpty(rows)}">
                        <td colspan="9" class="text-center text-muted py-4">
                            Không có đơn chờ giao.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
