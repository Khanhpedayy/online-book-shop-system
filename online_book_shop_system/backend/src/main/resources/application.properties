spring.application.name=OnlineBookShop
# Optional local secrets (gitignored): copy application-local.properties.example → application-local.properties
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bookstore;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Use 'none' - schema must be created by SQL script (avoids conflicts with identity/computed columns)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# JWT Configuration
jwt.secret=OnlineBookShopSecretKeyForJWTAuthenticationMustBe256BitsLong!!
jwt.expiration=86400000
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true

# PayOS (https://payos.vn) — keys from https://my.payos.vn → Kênh thanh toán
#
# Wrong: payos.client-id=${paste-uuid-here:}  → Spring looks for a property literally named "paste-uuid-here" → empty.
# Set credentials using ONE of:
#   1) Env: PAYOS_CLIENT_ID, PAYOS_API_KEY, PAYOS_CHECKSUM_KEY (PowerShell: $env:PAYOS_CLIENT_ID="...")
#   2) File: copy application-local.properties.example to application-local.properties and fill values (gitignored)
# Use payos.enabled=false to test COD only without keys
payos.enabled=true
# client-id / api-key / checksum-key: set in application-local.properties or env PAYOS_CLIENT_ID, PAYOS_API_KEY, PAYOS_CHECKSUM_KEY
payos.base-url=https://api-merchant.payos.vn
# Use {orderId}; PayOS appends code, status, cancel, orderCode, id, ...
payos.return-url-template=http://localhost:8080/payment-result.html?orderId={orderId}
payos.cancel-url-template=http://localhost:8080/payment-result.html?orderId={orderId}&payosCancel=1
