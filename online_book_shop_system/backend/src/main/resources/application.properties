spring.application.name=OnlineBookShop

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=online_book_shop;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=OnlineBookShopSecretKeyForJWTAuthenticationMustBe256BitsLong!!
jwt.expiration=86400000

spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true

logging.level.org.springframework.security=DEBUG