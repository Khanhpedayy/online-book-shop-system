<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login – Online Book Shop</title>
    <style>
        :root {
            --header-bg: #1a1a2e;
            --header-text: #eee;
            --accent: #c9a227;
            --accent-hover: #b8921f;
            --card-bg: #fff;
            --body-bg: #f8f6f1;
            --text: #333;
            --border: #e0ddd8;
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            margin: 0;
            background: var(--body-bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header-top {
            background: var(--header-bg);
            color: var(--header-text);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo { font-size: 1.35rem; font-weight: 700; }
        .logo a { color: inherit; text-decoration: none; }
        .nav { display: flex; gap: 24px; align-items: center; }
        .nav a { color: var(--header-text); text-decoration: none; font-size: 0.95rem; }
        .nav a:hover { color: var(--accent); }
        .header-cart { color: var(--header-text); text-decoration: none; font-weight: 500; }
        .header-cart:hover { color: var(--accent); }
        .cart-count { color: var(--accent); }

        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .login-card {
            background: var(--card-bg);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 380px;
        }
        .login-card h1 { margin: 0 0 24px; font-size: 1.5rem; }
        .login-card label { display: block; margin-top: 14px; font-weight: 500; font-size: 0.9rem; }
        .login-card input {
            width: 100%;
            padding: 10px 12px;
            margin-top: 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
        }
        .btn {
            background: var(--accent);
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        .btn:hover { background: var(--accent-hover); }
        .login-msg { margin-top: 16px; font-size: 0.9rem; color: #666; }

        footer {
            background: var(--header-bg);
            color: var(--header-text);
            padding: 20px 24px;
            text-align: center;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

<header class="header-top">
    <div class="logo"><a href="index.html">📚 Online Book Shop</a></div>
    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="cart.html">Cart</a>
    </nav>
    <a href="cart.html" class="header-cart">Cart <span class="cart-count" id="headerCartCount">$ 0.00 (0)</span></a>
</header>

<main>
    <div class="login-card">
        <h1>Login</h1>
        <form id="loginForm">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" required>
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
            <button type="submit" class="btn">Sign in</button>
        </form>
        <p class="login-msg">Demo: no backend auth yet. Use any email/password.</p>
    </div>
</main>

<footer>© Online Book Shop</footer>

<script src="app.js"></script>
<script>
  (function() {
    var form = document.getElementById('loginForm');
    if (form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var email = document.getElementById('loginEmail').value;
        alert('Login (demo): Hello ' + (email || 'guest') + '. Backend auth not implemented yet.');
      });
    }
  })();
</script>
</body>
</html>
