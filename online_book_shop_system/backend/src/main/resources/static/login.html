<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book Shop — Đăng nhập</title>
    <meta name="description" content="Đăng nhập vào hệ thống Online Book Shop">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: rgba(30, 30, 55, 0.85);
            --accent: #6c63ff;
            --accent-hover: #7b73ff;
            --accent-glow: rgba(108, 99, 255, 0.3);
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0b8;
            --text-muted: #6b6b80;
            --error: #ff4757;
            --success: #2ed573;
            --border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-focus: rgba(108, 99, 255, 0.15);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            padding: 40px 0;
        }

        /* Animated background */
        .bg-gradient {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 600px 600px at 20% 20%, rgba(108, 99, 255, 0.12) 0%, transparent 70%),
                radial-gradient(ellipse 500px 500px at 80% 80%, rgba(99, 179, 255, 0.08) 0%, transparent 70%),
                radial-gradient(ellipse 400px 400px at 60% 30%, rgba(255, 99, 165, 0.06) 0%, transparent 70%);
            animation: bgShift 15s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% {
                transform: scale(1) translate(0, 0);
            }

            100% {
                transform: scale(1.1) translate(-20px, -10px);
            }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(108, 99, 255, 0.3);
            border-radius: 50%;
            animation: float var(--duration) ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            50% {
                transform: translateY(calc(var(--dy))) translateX(calc(var(--dx)));
            }
        }

        /* Card */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.3),
                0 0 80px var(--accent-glow);
            animation: cardAppear 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes cardAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent), #63b3ff);
            border-radius: 16px;
            margin-bottom: 16px;
            font-size: 24px;
        }

        .logo h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            margin-bottom: 28px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 12px var(--accent-glow);
        }

        .tab:hover:not(.active) {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Forms */
        .form-section {
            display: none;
            animation: formIn 0.35s ease;
        }

        .form-section.active {
            display: block;
        }

        @keyframes formIn {
            from {
                opacity: 0;
                transform: translateX(12px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-group input:focus {
            border-color: var(--accent);
            background: var(--input-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-group input:focus+.icon,
        .form-group input:focus~.icon {
            color: var(--accent);
        }

        /* Password toggle */
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 2px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--text-primary);
        }

        /* Button */
        .btn-primary {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #7b73ff);
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px var(--accent-glow);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading spinner */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-primary.loading .btn-text {
            display: none;
        }

        .btn-primary.loading .spinner {
            display: inline-block;
        }

        /* Message */
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
            animation: msgIn 0.3s ease;
        }

        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.error {
            background: rgba(255, 71, 87, 0.12);
            border: 1px solid rgba(255, 71, 87, 0.25);
            color: var(--error);
            display: flex;
        }

        .message.success {
            background: rgba(46, 213, 115, 0.12);
            border: 1px solid rgba(46, 213, 115, 0.25);
            color: var(--success);
            display: flex;
        }

        /* Seed info */
        .seed-info {
            margin-top: 24px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .seed-info strong {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .seed-info code {
            background: rgba(108, 99, 255, 0.15);
            padding: 1px 6px;
            border-radius: 4px;
            font-family: 'Fira Code', 'SF Mono', monospace;
            font-size: 11px;
            color: var(--accent);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 36px 24px;
            }

            .login-container {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="bg-gradient"></div>

    <div class="particles" id="particles"></div>

    <div class="login-container">
        <div class="card">
            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon">📚</div>
                <h1>Online Book Shop</h1>
                <p id="subtitle">Đăng nhập để tiếp tục</p>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" id="tabLogin" onclick="switchTab('login')">Đăng nhập</button>
                <button class="tab" id="tabRegister" onclick="switchTab('register')">Đăng ký</button>
            </div>

            <!-- Messages -->
            <div class="message" id="message">
                <span id="msgIcon"></span>
                <span id="msgText"></span>
            </div>

            <!-- Login Form -->
            <div class="form-section active" id="loginForm">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <div class="input-wrapper">
                            <input type="email" id="loginEmail" placeholder="you@example.com" required
                                autocomplete="email">
                            <span class="icon">✉</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Mật khẩu</label>
                        <div class="input-wrapper">
                            <input type="password" id="loginPassword" placeholder="••••••••" required
                                autocomplete="current-password">
                            <span class="icon">🔒</span>
                            <button type="button" class="toggle-password"
                                onclick="togglePassword('loginPassword', this)">👁</button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" id="loginBtn">
                        <span class="btn-text">Đăng nhập</span>
                        <div class="spinner"></div>
                    </button>
                </form>
            </div>

            <!-- Register Form -->
            <div class="form-section" id="registerForm">
                <form id="step1Form" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="regName">Họ và tên</label>
                        <div class="input-wrapper">
                            <input type="text" id="regName" placeholder="Nguyễn Văn A" required>
                            <span class="icon">👤</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email *</label>
                        <div class="input-wrapper">
                            <input type="email" id="regEmail" placeholder="you@example.com" required
                                autocomplete="email">
                            <span class="icon">✉</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="regPhone">Số điện thoại</label>
                        <div class="input-wrapper">
                            <input type="tel" id="regPhone" placeholder="0901234567">
                            <span class="icon">📱</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Mật khẩu * (≥ 8 ký tự, hoa, thường, số, đặc biệt)</label>
                        <div class="input-wrapper">
                            <input type="password" id="regPassword" placeholder="••••••••" required minlength="8"
                                autocomplete="new-password" oninput="validatePasswordUI()">
                            <span class="icon">🔒</span>
                            <button type="button" class="toggle-password"
                                onclick="togglePassword('regPassword', this)">👁</button>
                        </div>
                        <div id="passwordStrength"
                            style="display: none; color: var(--error); font-size: 13px; margin-top: 8px; line-height: 1.5;">
                            Mật khẩu yếu. Yêu cầu:<br>
                            • Tối thiểu 8 ký tự<br>
                            • Gồm chữ in HOA, in thường<br>
                            • Gồm số và ký tự đặc biệt
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" id="registerBtn">
                        <span class="btn-text">Tạo tài khoản</span>
                        <div class="spinner"></div>
                    </button>
                </form>

                <form id="step2Form" onsubmit="handleVerifyOtp(event)" style="display: none;">
                    <br />
                    <div class="form-group">
                        <label for="regOtp">Mã xác thực (OTP) đã gửi về email</label>
                        <div class="input-wrapper">
                            <input type="text" id="regOtp" placeholder="123456" required maxlength="6"
                                style="letter-spacing: 4px; font-weight: bold; text-align: center;">
                            <span class="icon">🔑</span>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" id="verifyOtpBtn">
                        <span class="btn-text">Xác nhận</span>
                        <div class="spinner"></div>
                    </button>
                    <button type="button" onclick="backToStep1()"
                        style="margin-top: 12px; width: 100%; padding: 10px; background: transparent; color: var(--text-muted); border: none; cursor: pointer;">←
                        Quay lại sửa thông tin</button>
                </form>
            </div>

            <!-- Seed info -->
            <div class="seed-info">
                <strong>Tài khoản mẫu:</strong><br>
                Customer: <code>customer@example.com</code> / <code>123456</code><br>
                Admin: <code>admin@bookshop.com</code> / <code>admin123</code>
            </div>
        </div>
    </div>

    <script>
        // === Particles ===
        (function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.setProperty('--duration', (8 + Math.random() * 12) + 's');
                p.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
                p.style.setProperty('--dy', (Math.random() * -200 - 50) + 'px');
                p.style.animationDelay = (Math.random() * 8) + 's';
                p.style.width = (2 + Math.random() * 3) + 'px';
                p.style.height = p.style.width;
                container.appendChild(p);
            }
        })();

        const API_BASE = '';  // Same origin

        // === Tab switching ===
        function switchTab(tab) {
            hideMessage();
            document.getElementById('loginForm').classList.toggle('active', tab === 'login');
            document.getElementById('registerForm').classList.toggle('active', tab === 'register');
            document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
            document.getElementById('subtitle').textContent =
                tab === 'login' ? 'Đăng nhập để tiếp tục' : 'Tạo tài khoản mới';
        }

        // === Message helpers ===
        function showMessage(type, text) {
            const msg = document.getElementById('message');
            const icon = document.getElementById('msgIcon');
            const txt = document.getElementById('msgText');
            msg.className = 'message ' + type;
            icon.textContent = type === 'error' ? '⚠' : '✓';
            txt.textContent = text;
        }
        function hideMessage() {
            document.getElementById('message').className = 'message';
        }

        // === Toggle password visibility ===
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁';
            }
        }

        // === Set loading state ===
        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            btn.disabled = loading;
            btn.classList.toggle('loading', loading);
        }

        // === Login ===
        async function handleLogin(e) {
            e.preventDefault();
            hideMessage();
            setLoading('loginBtn', true);

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(API_BASE + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    showMessage('error', data.error || 'Đăng nhập thất bại');
                    return;
                }

                // Save token and user info
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify({
                    email: data.email,
                    fullName: data.fullName,
                    role: data.role
                }));

                showMessage('success', `Xin chào, ${data.fullName}! Đang chuyển hướng...`);

                // Redirect based on role
                setTimeout(() => {
                    if (data.role === 'ADMIN') {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/index.html';
                    }
                }, 1000);

            } catch (err) {
                showMessage('error', 'Không thể kết nối đến server. Vui lòng thử lại.');
            } finally {
                setLoading('loginBtn', false);
            }
        }

        // === Register ===
        let tempRegData = null;

        function validatePasswordUI() {
            const pw = document.getElementById('regPassword').value;
            const pwBox = document.getElementById('passwordStrength');
            if (pw.length === 0) {
                pwBox.style.display = 'none';
                document.getElementById('regPassword').style.borderColor = 'var(--border)';
                return;
            }
            const strongRegex = new RegExp("^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^a-zA-Z\\d]).{8,}$");
            if (!strongRegex.test(pw)) {
                pwBox.style.display = 'block';
                document.getElementById('regPassword').style.borderColor = 'var(--error)';
            } else {
                pwBox.style.display = 'none';
                document.getElementById('regPassword').style.borderColor = 'var(--success)';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            hideMessage();
            setLoading('registerBtn', true);

            // Resets borders
            document.getElementById('regEmail').style.borderColor = 'var(--border)';
            document.getElementById('regPhone').style.borderColor = 'var(--border)';
            if (document.getElementById('passwordStrength').style.display === 'none') {
                // Keep password border green if it's currently valid, else reset
            } else {
                document.getElementById('regPassword').style.borderColor = 'var(--border)';
            }

            const fullName = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;

            try {
                const res = await fetch(API_BASE + '/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, fullName, phone })
                });

                const data = await res.json();

                if (!res.ok) {
                    showMessage('error', data.error || 'Đăng ký thất bại');
                    if (data.field) {
                        const fieldMap = { 'email': 'regEmail', 'phone': 'regPhone', 'password': 'regPassword' };
                        if (fieldMap[data.field]) {
                            document.getElementById(fieldMap[data.field]).style.borderColor = 'var(--error)';
                        }
                    }
                    return;
                }

                if (data.requireOtp) {
                    tempRegData = { email, password, fullName, phone };
                    showMessage('success', data.message);
                    document.getElementById('step1Form').style.display = 'none';
                    document.getElementById('step2Form').style.display = 'block';
                }

            } catch (err) {
                showMessage('error', 'Không thể kết nối đến server. Vui lòng thử lại.');
            } finally {
                setLoading('registerBtn', false);
            }
        }

        async function handleVerifyOtp(e) {
            e.preventDefault();
            hideMessage();
            setLoading('verifyOtpBtn', true);
            const otp = document.getElementById('regOtp').value.trim();
            document.getElementById('regOtp').style.borderColor = 'var(--border)';

            try {
                const reqData = { ...tempRegData, otp };
                const res = await fetch(API_BASE + '/api/auth/verify-register-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(reqData)
                });
                const data = await res.json();

                if (!res.ok) {
                    showMessage('error', data.error || 'Xác thực thất bại');
                    if (data.field === 'otp') {
                        document.getElementById('regOtp').style.borderColor = 'var(--error)';
                    }
                    return;
                }

                showMessage('success', `Tạo tài khoản thành công! Trở về đăng nhập...`);

                // Move back to login tab after success
                setTimeout(() => {
                    switchTab('login');
                    document.getElementById('loginEmail').value = tempRegData.email;
                    document.getElementById('loginPassword').value = ''; // require manual pass entry for security
                    backToStep1();
                }, 1500);
            } catch (err) {
                showMessage('error', 'Không thể kết nối đến server.');
            } finally {
                setLoading('verifyOtpBtn', false);
            }
        }

        function backToStep1() {
            document.getElementById('step2Form').style.display = 'none';
            document.getElementById('step1Form').style.display = 'block';
            document.getElementById('regOtp').value = '';
        }

        // === Check if already logged in ===
        (function checkAuth() {
            const token = localStorage.getItem('token');
            if (token) {
                // Verify token is still valid by trying an authenticated endpoint
                fetch(API_BASE + '/api/books', {
                    headers: { 'Authorization': 'Bearer ' + token }
                }).then(res => {
                    if (res.ok) {
                        // Token is valid, redirect
                        // window.location.href = '/index.html';
                    }
                }).catch(() => {
                    // Token invalid, stay on login page
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                });
            }
        })();
    </script>

</body>
