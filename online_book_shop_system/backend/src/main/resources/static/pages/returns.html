<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quyết định Trả hàng — Quản trị BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
    <div id="app-layout">
        <div id="sidebar-slot"></div>
        <div class="main-area">
            <div id="header-slot"></div>
            <main class="content-area p-4">
                <div class="d-flex justify-content-between align-items-start mb-4">
                    <div>
                        <h2 class="fw-bold mb-1"><i class="bi bi-arrow-counterclockwise"></i>Quyết định Trả hàng</h2>
                        <p class="text-muted mb-0">Xử lý bản sao bị trả: nhập lại kho, định giá lại, đánh dấu hỏng, trả
                            nhà cung cấp</p>
                    </div>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="stats-card">
                            <div class="stats-icon" style="background:#eff6ff;color:#3b82f6"><i
                                    class="bi bi-arrow-counterclockwise"></i></div>
                            <div class="stats-label">Tổng trả hàng</div>
                            <div class="stats-value" id="kpi_total">0</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stats-card">
                            <div class="stats-icon" style="background:#fef3c7;color:#f59e0b"><i
                                    class="bi bi-hourglass-split"></i></div>
                            <div class="stats-label">Đang chờ</div>
                            <div class="stats-value" style="color:#f59e0b" id="kpi_pending">0</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stats-card">
                            <div class="stats-icon" style="background:#ecfdf5;color:#059669"><i
                                    class="bi bi-credit-card"></i></div>
                            <div class="stats-label">Tổng đã hoàn</div>
                            <div class="stats-value" id="kpi_refunded">0₫</div>
                        </div>
                    </div>
                </div>
                <div class="accordion" id="returnsAccordion">
                    <div class="text-center py-5 text-muted" id="loadingMsg">Đang tải…</div>
                </div>
            </main>
        </div>
    </div>

    <!-- Process Modal -->
    <div class="modal fade" id="processModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Xử lý mục trả hàng</h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3"><label class="form-label">Hành động <span
                                class="text-danger">*</span></label><select class="form-select" id="p_action" required>
                            <option value="RESTOCK">Nhập lại kho (cùng tình trạng)</option>
                            <option value="RESTOCK_REPRICE">Nhập lại kho & Định giá lại</option>
                            <option value="DAMAGED">Đánh dấu hỏng</option>
                            <option value="SUPPLIER_RETURN">Trả cho Nhà cung cấp</option>
                        </select></div>
                    <div class="mb-3"><label class="form-label">Tình trạng mới (để định giá lại)</label><select
                            class="form-select" id="p_conditionGrade">
                            <option value="">Không áp dụng</option>
                            <option value="NEW">Mới</option>
                            <option value="LIKE_NEW">Như mới</option>
                            <option value="GOOD">Tốt</option>
                            <option value="FAIR">Khá</option>
                        </select></div>
                    <div class="mb-3"><label class="form-label">Giá mới (để định giá lại)</label><input type="number"
                            class="form-control" id="p_newSellPrice" min="0"></div>
                    <div class="mb-3"><label class="form-label">Ghi chú</label><textarea class="form-control"
                            id="p_note" rows="2"></textarea></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">Hủy</button><button type="button" class="btn btn-primary"
                        onclick="processItem()">Xử lý</button></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        const statusColor = { PENDING: 'warning', APPROVED: 'primary', COMPLETED: 'success', REJECTED: 'danger' };
        const actionColor = { RESTOCK: 'success', RESTOCK_REPRICE: 'info', DAMAGED: 'danger', SUPPLIER_RETURN: 'warning' };
        const actionMap = { RESTOCK: 'Nhập lại', RESTOCK_REPRICE: 'Nhập & Định giá lại', DAMAGED: 'Đã hỏng', SUPPLIER_RETURN: 'Trả NCC' };

        let returns = [];
        let processItemId = null;

        async function init() {
            try { returns = await api.get('/inventory/returns'); } catch { returns = []; }
            renderKPI(); render();
        }

        function renderKPI() {
            const pending = returns.filter(r => r.status === 'PENDING' || r.status === 'APPROVED').length;
            const refund = returns.reduce((s, r) => s + (r.refundAmount || 0), 0);
            document.getElementById('kpi_total').textContent = returns.length;
            document.getElementById('kpi_pending').textContent = pending;
            document.getElementById('kpi_refunded').textContent = refund.toLocaleString() + '₫';
        }

        function render() {
            document.getElementById('loadingMsg')?.remove();
            const acc = document.getElementById('returnsAccordion');
            if (!returns.length) { acc.innerHTML = '<div class="text-center py-5 text-muted">Không có lượt trả hàng nào</div>'; return; }
            acc.innerHTML = returns.map((ret, idx) => {
                const itemsHtml = (ret.items || []).map(item => `<tr>
            <td>${item.titleSnapshot || '—'}</td>
            <td><span class="badge bg-light text-dark border">${item.skuSnapshot || '—'}</span></td>
            <td>${item.copyCode || '—'}</td>
            <td>${item.quantity || 1}</td>
            <td>${item.receivedConditionGrade ? `<span class="badge bg-info">${item.receivedConditionGrade}</span>` : '—'}</td>
            <td>${item.action ? `<span class="badge bg-${actionColor[item.action] || 'secondary'}">${actionMap[item.action] || item.action}</span>` : '<span class="badge bg-warning text-dark">PENDING</span>'}</td>
            <td>${!item.action ? `<button class="btn btn-sm btn-primary" onclick="openProcess(${item.id})">Xử lý</button>` : ''}</td>
        </tr>`).join('');

                return `<div class="accordion-item">
            <h2 class="accordion-header"><button class="accordion-button ${idx > 0 ? 'collapsed' : ''}" type="button" data-bs-toggle="collapse" data-bs-target="#ret${ret.returnId}">
                <span class="badge bg-${statusColor[ret.status] || 'secondary'} me-2">${ret.status}</span>
                <span class="fw-bold me-3">${ret.returnCode}</span>
                <span class="text-muted me-3">Đơn hàng: ${ret.orderCode}</span>
                <span class="text-muted ms-auto me-3 small">${ret.createdAt ? ret.createdAt.replace('T', ' ') : ''}</span>
            </button></h2>
            <div id="ret${ret.returnId}" class="accordion-collapse collapse ${idx === 0 ? 'show' : ''}" data-bs-parent="#returnsAccordion">
                <div class="accordion-body">
                    <table class="table table-sm mb-3"><tr><th>Lý do</th><td>${ret.reason || '—'}</td></tr><tr><th>Người yêu cầu</th><td>${ret.requestedBy || '—'}</td></tr><tr><th>Hoàn tiền</th><td>${(ret.refundAmount || 0).toLocaleString()}₫</td></tr></table>
                    <table class="table table-sm table-hover"><thead><tr><th>Tiêu đề</th><th>SKU</th><th>Bản sao</th><th style="width:50px">SL</th><th>Tình trạng</th><th>Hành động</th><th style="width:80px"></th></tr></thead><tbody>${itemsHtml || '<tr><td colspan="7" class="text-muted text-center">Không có mục nào</td></tr>'}</tbody></table>
                </div>
            </div>
        </div>`;
            }).join('');
        }

        function openProcess(itemId) {
            processItemId = itemId;
            document.getElementById('p_action').value = 'RESTOCK';
            document.getElementById('p_conditionGrade').value = '';
            document.getElementById('p_newSellPrice').value = '';
            document.getElementById('p_note').value = '';
            new bootstrap.Modal(document.getElementById('processModal')).show();
        }

        async function processItem() {
            if (!processItemId) return;
            const data = {
                action: document.getElementById('p_action').value,
                conditionGrade: document.getElementById('p_conditionGrade').value || undefined,
                newSellPrice: document.getElementById('p_newSellPrice').value ? +document.getElementById('p_newSellPrice').value : undefined,
                note: document.getElementById('p_note').value.trim() || undefined,
            };
            try {
                await api.post(`/inventory/returns/items/${processItemId}/process`, data);
                showToast('Đã xử lý mục trả hàng', 'success');
                bootstrap.Modal.getInstance(document.getElementById('processModal')).hide();
                returns = await api.get('/inventory/returns'); renderKPI(); render();
            } catch (e) { showToast('Thất bại', 'danger'); }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
