<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Kiểm kê (Stocktaking) — Quản trị BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
    <div id="app-layout">
        <div id="sidebar-slot"></div>
        <div class="main-area">
            <div id="header-slot"></div>
            <main class="content-area p-4">
                <div class="d-flex justify-content-between align-items-start mb-4">
                    <div>
                        <h2 class="fw-bold mb-1"><i class="bi bi-clipboard-check"></i> Kiểm kê (Stocktaking)</h2>
                        <p class="text-muted mb-0">Tạo phiên kiểm kê, ghi nhận số lượng thực tế, áp dụng điều chỉnh tồn kho</p>
                    </div>
                    <button class="btn btn-primary d-flex align-items-center gap-2" onclick="openCreate()"><i class="bi bi-plus-lg"></i> Tạo Phiên Mới</button>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="stats-card border bg-white p-3 rounded">
                            <div class="stats-icon mb-2" style="color:#3b82f6; font-size:1.5rem"><i class="bi bi-calculator"></i></div>
                            <div class="stats-label text-muted small">Tổng số Phiên</div>
                            <div class="stats-value fw-bold fs-3" id="kpi_total">0</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stats-card border bg-white p-3 rounded">
                            <div class="stats-icon mb-2" style="color:#1d4ed8; font-size:1.5rem"><i class="bi bi-hourglass-split"></i></div>
                            <div class="stats-label text-muted small">Đang mở (Thực hiện)</div>
                            <div class="stats-value fw-bold fs-3" style="color:#1d4ed8" id="kpi_open">0</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stats-card border bg-white p-3 rounded">
                            <div class="stats-icon mb-2" style="color:#059669; font-size:1.5rem"><i class="bi bi-check-circle"></i></div>
                            <div class="stats-label text-muted small">Đã hoàn thành</div>
                            <div class="stats-value fw-bold fs-3" style="color:#059669" id="kpi_completed">0</div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Mã Phiên (Session Code)</th>
                                        <th style="width:140px">Trạng thái</th>
                                        <th>Phạm vi (Scope)</th>
                                        <th style="width:90px">Số mặt hàng</th>
                                        <th style="width:160px">Ngày tạo</th>
                                        <th style="width:100px">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <tr>
                                        <td colspan="6" class="text-center py-5 text-muted">Đang tải…</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Create Modal -->
    <div class="modal fade" id="createModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Tạo Phiên Kiểm Kê Mới</h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form class="needs-validation" id="createForm" novalidate onsubmit="event.preventDefault(); createSession();">
                        <div class="mb-3">
                            <label class="form-label">Phạm vi (Scope)</label>
                            <input type="text" class="form-control" id="f_scope" placeholder="VD: ALL, VARIANT:1, LOT:5">
                            <div class="form-text">Bỏ trống để kiểm kê Toàn bộ (ALL)</div>
                        </div>
                        <div class="mb-3"><label class="form-label">Ghi chú</label><textarea class="form-control" id="f_note"
                                rows="2" placeholder="Nhập ghi chú hoặc lý do..."></textarea></div>
                    </form>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="createSession()">Tạo phiên</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Drawer -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="detailDrawer" style="width:800px">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title fw-bold" id="detailTitle"></h5>
            <div id="detailActions" class="d-flex gap-2"></div>
            <button type="button" class="btn-close ms-2" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body" id="detailBody"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        let sessions = [];
        const statusLang = { 'OPEN': 'ĐANG MỞ', 'COMPLETED': 'HOÀN THÀNH' };
        const statusColor = { 'OPEN': 'primary', 'COMPLETED': 'success' };

        async function init() {
            try { sessions = await api.get('/inventory/stocktaking'); } catch { sessions = []; }
            renderKPI(); render();
        }

        function renderKPI() {
            document.getElementById('kpi_total').textContent = sessions.length;
            document.getElementById('kpi_open').textContent = sessions.filter(s => s.status === 'OPEN').length;
            document.getElementById('kpi_completed').textContent = sessions.filter(s => s.status === 'COMPLETED').length;
        }

        function render() {
            const tbody = document.getElementById('tableBody');
            if (!sessions.length) { tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">Không có phiên kiểm kê nào</td></tr>'; return; }
            tbody.innerHTML = sessions.map(s => `<tr>
        <td><a href="javascript:void(0)" onclick="openDetail('${s.sessionCode}')" class="fw-semibold text-primary font-monospace">${s.sessionCode}</a></td>
        <td><span class="badge bg-${statusColor[s.status] || 'secondary'}">${statusLang[s.status] || s.status}</span></td>
        <td><span class="badge bg-light text-dark border">${s.scope || 'ALL'}</span></td>
        <td>${s.entries?.length || 0}</td>
        <td class="small text-muted">${s.createdAt ? new Date(s.createdAt).toLocaleString('vi-VN') : '—'}</td>
        <td><button class="btn btn-sm btn-outline-primary" onclick="openDetail('${s.sessionCode}')">Mở chi tiết</button></td>
    </tr>`).join('');
        }

        function openCreate() {
            document.getElementById('createForm').reset();
            document.getElementById('createForm').classList.remove('was-validated');
            new bootstrap.Modal(document.getElementById('createModal')).show();
        }

        async function createSession() {
            const form = document.getElementById('createForm');
            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }
            try {
                const result = await api.post('/inventory/stocktaking', {
                    scope: document.getElementById('f_scope').value.trim() || undefined,
                    note: document.getElementById('f_note').value.trim() || undefined,
                });
                showToast('Đã tạo phiên kiểm kê: ' + (result.sessionCode || ''), 'success');
                bootstrap.Modal.getInstance(document.getElementById('createModal')).hide();
                init();
            } catch (e) { showToast('Khởi tạo thất bại', 'danger'); }
        }

        async function openDetail(code) {
            try {
                const detail = await api.get(`/inventory/stocktaking/${code}`);
                document.getElementById('detailTitle').innerHTML = `<i class="bi bi-card-checklist me-1"></i> Phiên: ${detail.sessionCode}`;
                
                // Nút thao tác hoàn thành
                document.getElementById('detailActions').innerHTML = detail.status === 'OPEN' 
                    ? `<button class="btn btn-success btn-sm d-flex align-items-center gap-1" onclick="applyAdj('${code}')"><i class="bi bi-check-circle"></i> Xác nhận & Hoàn tất</button>
                       <button class="btn btn-outline-secondary btn-sm" onclick="init(); openDetail('${code}');"><i class="bi bi-arrow-clockwise"></i> Load lại</button>` 
                    : '';
                
                const entriesHtml = (detail.entries || []).map(e => {
                    const diff = e.diff;
                    const diffClass = diff > 0 ? 'text-success fw-bold' : diff < 0 ? 'text-danger fw-bold' : '';
                    const diffText = diff != null ? (diff > 0 ? '+' + diff : diff) : '—';
                    
                    const lotCodeText = e.lotCode || '<span class="text-muted fst-italic">Không có lô</span>';
                    
                    return `<tr>
                <td class="small"><span class="badge bg-light text-dark border">${e.sku || '—'}</span></td>
                <td class="text-truncate" style="max-width:180px" title="${e.title || '—'}">${e.title || '—'}</td>
                <td class="small font-monospace">${lotCodeText}</td>
                <td class="text-end fw-medium">${e.expectedQty ?? '—'}</td>
                <td>${detail.status === 'OPEN' ?
                            `<input type="number" class="form-control form-control-sm text-end" style="width:80px; margin:auto;" min="0" value="${e.countedQty ?? ''}" 
                                onchange="recordCount('${code}','${e.variantId}','${e.lotId || ''}',this.value)">` :
                            `<div class="text-end fw-bold text-primary">${e.countedQty ?? '—'}</div>`}</td>
                <td class="text-end ${diffClass}">${diffText}</td>
            </tr>`;
                }).join('');

                const cTime = detail.createdAt ? new Date(detail.createdAt).toLocaleString('vi-VN') : '—';
                const fTime = detail.completedAt ? new Date(detail.completedAt).toLocaleString('vi-VN') : '—';

                document.getElementById('detailBody').innerHTML = `
            <table class="table table-bordered table-sm mb-4">
                <tr><th>Trạng thái</th><td><span class="badge bg-${statusColor[detail.status] || 'secondary'}">${statusLang[detail.status] || detail.status}</span></td></tr>
                <tr><th>Phạm vi (Scope)</th><td><span class="badge bg-light text-dark border">${detail.scope || 'ALL'}</span></td></tr>
                <tr><th>Ngày tạo</th><td>${cTime}</td></tr>
                <tr><th>Ngày hoàn thành</th><td>${fTime}</td></tr>
                ${detail.note ? `<tr><th>Ghi chú</th><td class="text-muted smaller">${detail.note}</td></tr>` : ''}
            </table>
            <h6 class="fw-bold mb-3">Danh sách mặt hàng kiểm kê (${detail.entries?.length || 0})</h6>
            <div class="table-responsive">
                <table class="table table-sm table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Mã SKU</th>
                            <th>Tên sách</th>
                            <th>Lô (Lot)</th>
                            <th class="text-end" style="width:80px" title="Số lượng trên hệ thống">Sổ sách</th>
                            <th class="text-center" style="width:110px" title="Số lượng đếm tay thực tế">Thực đếm</th>
                            <th class="text-end" style="width:80px">Lệch</th>
                        </tr>
                    </thead>
                    <tbody>${entriesHtml || '<tr><td colspan="6" class="text-muted text-center py-4">Không có mục kiểm kê nào (Phiên trống)</td></tr>'}</tbody>
                </table>
            </div>`;
                new bootstrap.Offcanvas(document.getElementById('detailDrawer')).show();
            } catch (e) { showToast('Không thể tải chi tiết phiên kiểm kê', 'danger'); }
        }

        async function recordCount(code, variantId, lotId, value) {
            const qty = parseInt(value);
            if (isNaN(qty) || qty < 0) {
                showToast('Giá trị nhập không hợp lệ', 'warning');
                return;
            }
            try { 
                await api.post(`/inventory/stocktaking/${code}/count`, { 
                    variantId: parseInt(variantId), 
                    lotId: lotId ? parseInt(lotId) : null, 
                    countedQty: qty 
                }); 
                openDetail(code);
            }
            catch (e) { 
                console.error(e);
                showToast('Lưu số lượng bị lỗi: ' + (e.message || ''), 'danger'); 
            }
        }

        async function applyAdj(code) {
            if (!confirm('Áp dụng các số lượng kiểm kê này? Thao tác này sẽ cập nhật thẳng vào dữ liệu Tồn kho của hệ thống và không thể hoàn tác.')) return;
            try { 
                await api.post(`/inventory/stocktaking/${code}/apply`, { note: 'Áp dụng sau kiểm kê' }); 
                showToast('Đã áp dụng điều chỉnh kho thành công', 'success'); 
                openDetail(code); 
                init(); 
            }
            catch (e) { showToast('Vui lòng ghi nhận thực đếm cho toàn bộ mặt hàng trước khi áp dụng!', 'warning'); }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
