<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Stocktaking — BookStore Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
    <div id="app-layout">
        <div id="sidebar-slot"></div>
        <div class="main-area">
            <div id="header-slot"></div>
            <main class="content-area p-4">
                <div class="d-flex justify-content-between align-items-start mb-4">
                    <div>
                        <h2 class="fw-bold mb-1"><i class="bi bi-clipboard-check"></i>Cycle Count / Stocktaking</h2>
                        <p class="text-muted mb-0">Create sessions, record counts, apply adjustments</p>
                    </div>
                    <button class="btn btn-primary btn-lg d-flex align-items-center gap-1" onclick="openCreate()"><i class="bi bi-plus-lg"></i> New Session</button>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="stats-card">
                            <div class="stats-icon" style="background:#eff6ff;color:#3b82f6"><i class="bi bi-calculator"></i></div>
                            <div class="stats-label">Total Sessions</div>
                            <div class="stats-value" id="kpi_total">0</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stats-card">
                            <div class="stats-icon" style="background:#dbeafe;color:#1d4ed8"><i class="bi bi-hourglass-split"></i></div>
                            <div class="stats-label">Open</div>
                            <div class="stats-value" style="color:#1d4ed8" id="kpi_open">0</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stats-card">
                            <div class="stats-icon" style="background:#ecfdf5;color:#059669"><i class="bi bi-check-circle"></i></div>
                            <div class="stats-label">Completed</div>
                            <div class="stats-value" style="color:#059669" id="kpi_completed">0</div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Session Code</th>
                                        <th style="width:100px">Status</th>
                                        <th>Scope</th>
                                        <th style="width:80px">Items</th>
                                        <th style="width:160px">Created</th>
                                        <th style="width:100px"></th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <tr>
                                        <td colspan="6" class="text-center py-5 text-muted">Loading…</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Create Modal -->
    <div class="modal fade" id="createModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">New Stocktaking Session</h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3"><label class="form-label">Scope</label><input type="text" class="form-control"
                            id="f_scope" placeholder="ALL, VARIANT:1, LOT:5"></div>
                    <div class="mb-3"><label class="form-label">Note</label><textarea class="form-control" id="f_note"
                            rows="2"></textarea></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-primary"
                        onclick="createSession()">Create</button></div>
            </div>
        </div>
    </div>

    <!-- Detail Drawer -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="detailDrawer" style="width:800px">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title fw-bold" id="detailTitle"></h5>
            <div id="detailActions"></div>
            <button type="button" class="btn-close ms-2" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body" id="detailBody"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        let sessions = [];

        async function init() {
            try { sessions = await api.get('/inventory/stocktaking'); } catch { sessions = []; }
            renderKPI(); render();
        }

        function renderKPI() {
            document.getElementById('kpi_total').textContent = sessions.length;
            document.getElementById('kpi_open').textContent = sessions.filter(s => s.status === 'OPEN').length;
            document.getElementById('kpi_completed').textContent = sessions.filter(s => s.status === 'COMPLETED').length;
        }

        function render() {
            const tbody = document.getElementById('tableBody');
            if (!sessions.length) { tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">No sessions</td></tr>'; return; }
            tbody.innerHTML = sessions.map(s => `<tr>
        <td><a href="javascript:void(0)" onclick="openDetail('${s.sessionCode}')" class="fw-semibold text-primary">${s.sessionCode}</a></td>
        <td><span class="badge bg-${s.status === 'COMPLETED' ? 'success' : 'primary'}">${s.status}</span></td>
        <td>${s.scope || 'ALL'}</td>
        <td>${s.entries?.length || 0}</td>
        <td class="small text-muted">${s.createdAt ? s.createdAt.replace('T', ' ') : '—'}</td>
        <td><button class="btn btn-sm btn-outline-primary" onclick="openDetail('${s.sessionCode}')">Open</button></td>
    </tr>`).join('');
        }

        function openCreate() {
            document.getElementById('f_scope').value = '';
            document.getElementById('f_note').value = '';
            new bootstrap.Modal(document.getElementById('createModal')).show();
        }

        async function createSession() {
            try {
                const result = await api.post('/inventory/stocktaking', {
                    scope: document.getElementById('f_scope').value.trim() || undefined,
                    note: document.getElementById('f_note').value.trim() || undefined,
                });
                showToast('Session created: ' + (result.sessionCode || ''), 'success');
                bootstrap.Modal.getInstance(document.getElementById('createModal')).hide();
                sessions = await api.get('/inventory/stocktaking'); renderKPI(); render();
            } catch (e) { showToast('Failed', 'danger'); }
        }

        async function openDetail(code) {
            try {
                const detail = await api.get(`/inventory/stocktaking/${code}`);
                document.getElementById('detailTitle').textContent = `Session: ${detail.sessionCode}`;
                document.getElementById('detailActions').innerHTML = detail.status === 'OPEN' ? `<button class="btn btn-success btn-sm d-flex align-items-center gap-1" onclick="applyAdj('${code}')"><i class="bi bi-check-circle"></i>Apply Adjustments</button>` : '';
                const entriesHtml = (detail.entries || []).map(e => {
                    const diff = e.diff;
                    const diffClass = diff > 0 ? 'text-success' : diff < 0 ? 'text-danger' : '';
                    return `<tr>
                <td>${e.sku || '—'}</td>
                <td class="text-truncate" style="max-width:180px">${e.title || '—'}</td>
                <td>${e.lotCode || '—'}</td>
                <td>${e.expectedQty ?? '—'}</td>
                <td>${detail.status === 'OPEN' ?
                            `<input type="number" class="form-control form-control-sm" style="width:80px" min="0" value="${e.countedQty ?? ''}" onblur="recordCount('${code}',${e.variantId},${e.lotId || 'null'},this.value)">` :
                            (e.countedQty ?? '—')}</td>
                <td class="${diffClass}">${diff != null ? (diff > 0 ? '+' : '') + diff : '—'}</td>
            </tr>`;
                }).join('');
                document.getElementById('detailBody').innerHTML = `
            <table class="table table-bordered table-sm mb-4">
                <tr><th>Status</th><td><span class="badge bg-${detail.status === 'COMPLETED' ? 'success' : 'primary'}">${detail.status}</span></td></tr>
                <tr><th>Scope</th><td>${detail.scope || 'ALL'}</td></tr>
                <tr><th>Created</th><td>${detail.createdAt || '—'}</td></tr>
                <tr><th>Completed</th><td>${detail.completedAt || '—'}</td></tr>
            </table>
            <table class="table table-sm table-hover"><thead><tr><th>SKU</th><th>Title</th><th>Lot</th><th style="width:80px">Expected</th><th style="width:120px">Counted</th><th style="width:80px">Diff</th></tr></thead><tbody>${entriesHtml || '<tr><td colspan="6" class="text-muted text-center">No entries</td></tr>'}</tbody></table>`;
                new bootstrap.Offcanvas(document.getElementById('detailDrawer')).show();
            } catch (e) { showToast('Failed to load detail', 'danger'); }
        }

        async function recordCount(code, variantId, lotId, value) {
            try { await api.post(`/inventory/stocktaking/${code}/record`, { variantId, lotId, countedQty: parseInt(value) || 0 }); showToast('Count recorded', 'success'); }
            catch (e) { showToast('Failed', 'danger'); }
        }

        async function applyAdj(code) {
            if (!confirm('Apply all adjustments? This will update inventory.')) return;
            try { await api.post(`/inventory/stocktaking/${code}/apply`); showToast('Adjustments applied', 'success'); openDetail(code); sessions = await api.get('/inventory/stocktaking'); renderKPI(); render(); }
            catch (e) { showToast('Failed', 'danger'); }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
