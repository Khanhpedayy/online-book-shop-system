<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quản lý Đơn hàng — Quản trị BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
    <div id="app-layout">
        <div id="sidebar-slot"></div>
        <div class="main-area">
            <div id="header-slot"></div>
            <main class="content-area p-4">
                <!-- Header + Filters -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="fw-bold mb-0 d-flex align-items-center gap-2">
                                <i class="bi bi-list-ul"></i> Quản lý Đơn hàng
                            </h2>
                            <div class="d-flex gap-2 align-items-center">
                                <select class="form-select form-select-sm" style="width:150px" id="sortBy"
                                    onchange="loadOrders()">
                                    <option value="created_at">Ngày tạo</option>
                                    <option value="placed_at">Ngày đặt</option>
                                    <option value="priority">Độ ưu tiên</option>
                                </select>
                                <select class="form-select form-select-sm" style="width:100px" id="sortDir"
                                    onchange="loadOrders()">
                                    <option value="DESC">Mới nhất</option>
                                    <option value="ASC">Cũ nhất</option>
                                </select>
                            </div>
                        </div>
                        <div class="d-flex flex-wrap gap-3">
                            <input type="text" class="form-control form-control-sm" style="width:280px"
                                placeholder="Tìm kiếm đơn hàng/khách hàng…" id="searchInput" onchange="loadOrders()">
                            <select class="form-select form-select-sm" style="width:160px" id="paymentFilter"
                                onchange="loadOrders()">
                                <option value="">Tất cả Thanh toán</option>
                                <option value="PENDING">CHỜ THANH TOÁN</option>
                                <option value="PAID">ĐÃ THANH TOÁN</option>
                                <option value="FAILED">THẤT BẠI</option>
                                <option value="REFUNDED">ĐÃ HOÀN TIỀN</option>
                            </select>
                            <select class="form-select form-select-sm" style="width:160px" id="deliveryFilter"
                                onchange="loadOrders()">
                                <option value="">Tất cả Giao hàng</option>
                                <option value="NOT_SHIPPED">CHƯA GIAO</option>
                                <option value="IN_TRANSIT">ĐANG GIAO</option>
                                <option value="DELIVERED">ĐÃ GIAO</option>
                                <option value="RETURNED">TRẢ HÀNG</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Status Tabs + Table -->
                <div class="card">
                    <div class="card-header p-0">
                        <ul class="nav nav-tabs" id="statusTabs">
                            <li class="nav-item"><a class="nav-link active" href="#" data-status="ALL"
                                    onclick="setTab(event,'ALL')">Tất cả</a></li>
                            <li class="nav-item"><a class="nav-link" href="#" data-status="NEW"
                                    onclick="setTab(event,'NEW')">MỚI <span class="badge bg-primary ms-1"
                                        id="cnt_NEW">0</span></a></li>
                            <li class="nav-item"><a class="nav-link" href="#" data-status="CONFIRMED"
                                    onclick="setTab(event,'CONFIRMED')">ĐÃ XÁC NHẬN <span class="badge bg-info ms-1"
                                        id="cnt_CONFIRMED">0</span></a></li>
                            <li class="nav-item"><a class="nav-link" href="#" data-status="PACKED"
                                    onclick="setTab(event,'PACKED')">ĐÃ ĐÓNG GÓI <span class="badge bg-secondary ms-1"
                                        id="cnt_PACKED">0</span></a></li>
                            <li class="nav-item"><a class="nav-link" href="#" data-status="SHIPPED"
                                    onclick="setTab(event,'SHIPPED')">ĐÃ GIAO <span
                                        class="badge bg-warning text-dark ms-1" id="cnt_SHIPPED">0</span></a></li>
                            <li class="nav-item"><a class="nav-link" href="#" data-status="COMPLETED"
                                    onclick="setTab(event,'COMPLETED')">HOÀN THÀNH <span class="badge bg-success ms-1"
                                        id="cnt_COMPLETED">0</span></a></li>
                            <li class="nav-item"><a class="nav-link" href="#" data-status="CANCELLED"
                                    onclick="setTab(event,'CANCELLED')">ĐÃ HỦY <span class="badge bg-dark ms-1"
                                        id="cnt_CANCELLED">0</span></a></li>
                        </ul>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th style="width:130px">Đơn hàng</th>
                                        <th style="width:160px">Khách hàng</th>
                                        <th style="width:110px">Trạng thái</th>
                                        <th style="width:100px">Thanh toán</th>
                                        <th style="width:110px">Giao hàng</th>
                                        <th style="width:120px" class="text-end">Tổng tiền</th>
                                        <th style="width:60px" class="text-center">SL</th>
                                        <th style="width:80px" class="text-center">Ưu tiên</th>
                                        <th style="width:140px">Ngày đặt</th>
                                    </tr>
                                </thead>
                                <tbody id="orderBody">
                                    <tr>
                                        <td colspan="9" class="text-center py-5 text-muted">Đang tải…</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-between align-items-center px-3 py-2 border-top"
                            id="pagArea"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        let allOrders = [];
        let statusFilter = 'ALL';
        let currentPage = 1;
        const pageSize = 15;

        const stColor = { NEW: 'primary', CONFIRMED: 'info', PACKED: 'secondary', SHIPPED: 'warning', COMPLETED: 'success', CANCELLED: 'dark' };
        const stLang = { NEW: 'MỚI', CONFIRMED: 'ĐÃ XÁC NHẬN', PACKED: 'ĐÃ ĐÓNG GÓI', SHIPPED: 'ĐÃ GIAO', COMPLETED: 'HOÀN THÀNH', CANCELLED: 'ĐÃ HỦY' };
        
        const payColor = { PENDING: 'warning', PAID: 'success', FAILED: 'danger', REFUNDED: 'secondary' };
        const payLang = { PENDING: 'CHỜ THANH TOÁN', PAID: 'ĐÃ THANH TOÁN', FAILED: 'THẤT BẠI', REFUNDED: 'HOÀN TIỀN' };
        
        const delColor = { NOT_SHIPPED: 'secondary', IN_TRANSIT: 'primary', DELIVERED: 'success', RETURNED: 'danger' };
        const delLang = { NOT_SHIPPED: 'CHƯA GIAO', IN_TRANSIT: 'ĐANG GIAO', DELIVERED: 'ĐÃ GIAO', RETURNED: 'TRẢ HÀNG' };

        async function loadOrders() {
            const params = new URLSearchParams();
            params.set('sortBy', document.getElementById('sortBy').value);
            params.set('sortDir', document.getElementById('sortDir').value);
            if (statusFilter && statusFilter !== 'ALL') params.set('status', statusFilter);
            const pf = document.getElementById('paymentFilter').value;
            if (pf) params.set('paymentStatus', pf);
            const df = document.getElementById('deliveryFilter').value;
            if (df) params.set('deliveryStatus', df);
            const s = document.getElementById('searchInput').value.trim();
            if (s) params.set('search', s);

            try { allOrders = await api.get('/staff/orders?' + params.toString()); } catch { allOrders = []; }
            updateCounts();
            renderOrders();
        }

        function updateCounts() {
            ['NEW', 'CONFIRMED', 'PACKED', 'SHIPPED', 'COMPLETED', 'CANCELLED'].forEach(s => {
                const el = document.getElementById('cnt_' + s);
                if (el) el.textContent = allOrders.filter(o => o.status === s).length;
            });
        }

        function setTab(e, status) {
            e.preventDefault();
            statusFilter = status;
            document.querySelectorAll('#statusTabs .nav-link').forEach(n => n.classList.remove('active'));
            e.target.closest('.nav-link').classList.add('active');
            currentPage = 1;
            loadOrders();
        }

        function renderOrders() {
            const tbody = document.getElementById('orderBody');
            if (!allOrders.length) { tbody.innerHTML = '<tr><td colspan="9" class="text-center py-5 text-muted">Không tìm thấy đơn hàng</td></tr>'; document.getElementById('pagArea').innerHTML = ''; return; }
            const totalPages = Math.ceil(allOrders.length / pageSize);
            const start = (currentPage - 1) * pageSize;
            const page = allOrders.slice(start, start + pageSize);

            tbody.innerHTML = page.map(o => {
                const pLabel = o.priority >= 3 ? '<span class="badge bg-danger">CAO</span>' : o.priority >= 1 ? '<span class="badge bg-warning text-dark">TRUNG</span>' : '<span class="badge bg-secondary">THẤP</span>';
                return `<tr class="cursor-pointer" onclick="location.href='staff-order-detail.html?id=${o.id}'">
            <td class="font-monospace small fw-bold text-primary">${o.orderCode || '—'}</td>
            <td class="text-truncate" style="max-width:160px">${o.customerName || '—'}</td>
            <td><span class="badge bg-${stColor[o.status] || 'secondary'}">${stLang[o.status] || o.status}</span></td>
            <td><span class="badge bg-${payColor[o.paymentStatus] || 'secondary'}">${payLang[o.paymentStatus] || o.paymentStatus || '—'}</span></td>
            <td><span class="badge bg-${delColor[o.deliveryStatus] || 'secondary'}">${delLang[o.deliveryStatus] || (o.deliveryStatus || '—').replace(/_/g, ' ')}</span></td>
            <td class="text-end fw-semibold">${(o.totalAmount || 0).toLocaleString()} ${o.currency || 'VND'}</td>
            <td class="text-center">${o.itemCount || 0}</td>
            <td class="text-center">${pLabel}</td>
            <td class="small text-muted">${o.placedAt ? new Date(o.placedAt).toLocaleString('vi-VN') : '—'}</td>
        </tr>`;
            }).join('');

            document.getElementById('pagArea').innerHTML = `
        <span class="text-muted small">${allOrders.length} đơn hàng</span>
        <nav><ul class="pagination pagination-sm mb-0">
            <li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="#" onclick="event.preventDefault();currentPage--;renderOrders()">‹</a></li>
            ${Array.from({ length: totalPages }, (_, i) => `<li class="page-item ${currentPage === i + 1 ? 'active' : ''}"><a class="page-link" href="#" onclick="event.preventDefault();currentPage=${i + 1};renderOrders()">${i + 1}</a></li>`).join('')}
            <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" onclick="event.preventDefault();currentPage++;renderOrders()">›</a></li>
        </ul></nav>`;
        }

        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>

</html>
