<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Incident Reports — BookStore Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
    <div id="app-layout">
        <div id="sidebar-slot"></div>
        <div class="main-area">
            <div id="header-slot"></div>
            <main class="content-area p-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold mb-0 d-flex align-items-center gap-2"><i class="bi bi-exclamation-triangle"></i>Incident Reports</h5>
                        <button class="btn btn-danger d-flex align-items-center gap-1" onclick="openReport()"><i class="bi bi-plus-lg"></i> Report
                            Incident</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th style="width:130px">Type</th>
                                        <th style="width:130px">Order</th>
                                        <th style="width:120px">Copy</th>
                                        <th>Description</th>
                                        <th style="width:130px">Reporter</th>
                                        <th style="width:100px">Status</th>
                                        <th style="width:140px">Date</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <tr>
                                        <td colspan="7" class="text-center py-5 text-muted">Loading…</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="reportModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Report Incident</h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3"><label class="form-label">Type</label><select class="form-select" id="f_type">
                            <option value="MISSING"><i class="bi bi-search me-1"></i> Missing Item</option>
                            <option value="DAMAGED"><i class="bi bi-lightning me-1"></i> Damaged</option>
                            <option value="PICKING_ERROR"> Picking Error</option>
                            <option value="OTHER"><i class="bi bi-clipboard me-1"></i> Other</option>
                        </select></div>
                    <div class="mb-3"><label class="form-label">Order ID (optional)</label><input type="number"
                            class="form-control" id="f_orderId"></div>
                    <div class="mb-3"><label class="form-label">Copy ID (optional)</label><input type="number"
                            class="form-control" id="f_copyId"></div>
                    <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control"
                            id="f_description" rows="3" placeholder="Describe the incident…"></textarea></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-danger"
                        onclick="submitReport()">Submit</button></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        const typeColor = { MISSING: 'danger', DAMAGED: 'warning', PICKING_ERROR: 'secondary', OTHER: 'light' };
        const statusColor = { OPEN: 'danger', RESOLVED: 'success', CLOSED: 'secondary' };
        let incidents = [];

        async function init() {
            try { incidents = await api.get('/staff/incidents'); } catch { incidents = []; }
            render();
        }

        function render() {
            const tbody = document.getElementById('tableBody');
            if (!incidents.length) { tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">No incidents</td></tr>'; return; }
            tbody.innerHTML = incidents.map(i => `<tr>
        <td><span class="badge bg-${typeColor[i.type] || 'secondary'}">${(i.type || '').replace(/_/g, ' ')}</span></td>
        <td>${i.orderCode ? `<span class="font-monospace small">${i.orderCode}</span>` : '—'}</td>
        <td>${i.copyCode ? `<span class="badge bg-light text-dark border">${i.copyCode}</span>` : '—'}</td>
        <td class="text-truncate" style="max-width:250px">${i.description || '—'}</td>
        <td>${i.reportedByName || '—'}</td>
        <td><span class="badge bg-${statusColor[i.status] || 'secondary'}">${i.status}</span></td>
        <td class="small text-muted">${i.createdAt ? new Date(i.createdAt).toLocaleString('vi-VN') : '—'}</td>
    </tr>`).join('');
        }

        function openReport() {
            document.getElementById('f_orderId').value = '';
            document.getElementById('f_copyId').value = '';
            document.getElementById('f_description').value = '';
            new bootstrap.Modal(document.getElementById('reportModal')).show();
        }

        async function submitReport() {
            const data = {
                type: document.getElementById('f_type').value,
                orderId: document.getElementById('f_orderId').value ? +document.getElementById('f_orderId').value : undefined,
                copyId: document.getElementById('f_copyId').value ? +document.getElementById('f_copyId').value : undefined,
                reportedBy: 1,
                description: document.getElementById('f_description').value.trim(),
            };
            try {
                await api.post('/staff/incidents', data);
                showToast('Incident reported', 'success');
                bootstrap.Modal.getInstance(document.getElementById('reportModal')).hide();
                incidents = await api.get('/staff/incidents'); render();
            } catch (e) { showToast('Failed', 'danger'); }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
