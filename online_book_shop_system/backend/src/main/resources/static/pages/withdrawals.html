<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Yêu cầu rút tiền — Quản trị BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
    <style>
        .status-badge {
            padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 600;
        }
        .status-PENDING  { background: #fef9c3; color: #854d0e; }
        .status-APPROVED { background: #dcfce7; color: #166534; }
        .status-REJECTED { background: #fee2e2; color: #991b1b; }
        .action-btn { padding: 5px 14px; font-size: 13px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
        .btn-approve { background: #16a34a; color: #fff; }
        .btn-approve:hover { background: #15803d; }
        .btn-reject  { background: #dc2626; color: #fff; margin-left: 6px; }
        .btn-reject:hover  { background: #b91c1c; }
        .wd-card {
            background: #fff; border-radius: 12px; padding: 18px 22px;
            box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 14px;
        }
        .wd-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .wd-amount { font-size: 1.4rem; font-weight: 700; color: #4f46e5; }
        .wd-meta   { font-size: 0.85rem; color: #64748b; margin-top: 2px; }
        .bank-info { background: #f8fafc; border-radius: 8px; padding: 10px 14px; margin-top: 10px; font-size: 0.88rem; }
    </style>
</head>

<body>
    <div id="app-layout">
        <div id="sidebar-slot"></div>
        <div class="main-area">
            <div id="header-slot"></div>
            <main class="content-area p-4">
                <div class="mb-4">
                    <h2 class="fw-bold mb-1"><i class="bi bi-cash-coin me-2"></i>Yêu cầu rút tiền</h2>
                    <p class="text-muted mb-0">Danh sách yêu cầu rút tiền từ ví ảo của khách hàng</p>
                </div>

                <!-- Filter tabs -->
                <div class="d-flex gap-2 mb-4">
                    <button class="btn btn-sm btn-primary" id="tabPending" onclick="loadTab('pending')">
                        <i class="bi bi-hourglass-split me-1"></i>Đang chờ <span id="pendingCount" class="badge bg-white text-primary ms-1"></span>
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" id="tabAll" onclick="loadTab('all')">
                        <i class="bi bi-list-ul me-1"></i>Tất cả
                    </button>
                </div>

                <div id="wdList">
                    <div class="text-center py-5 text-muted">Đang tải…</div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal từ chối -->
    <div class="modal fade" id="rejectModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Từ chối yêu cầu rút tiền</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-3">Số tiền sẽ được hoàn lại vào ví ảo của khách sau khi từ chối.</p>
                    <label class="form-label fw-semibold">Lý do từ chối <span class="text-danger">*</span></label>
                    <textarea id="rejectReason" class="form-control" rows="3"
                              placeholder="VD: Thông tin tài khoản không hợp lệ, số tài khoản không tồn tại…"></textarea>
                    <div id="rejectMsg" class="mt-2 small text-danger"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmReject">Xác nhận từ chối</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        let currentTab = 'pending';
        let rejectingId = null;
        let rejectModal;

        function formatVnd(v) {
            return new Intl.NumberFormat('vi-VN').format(Math.round(Number(v) || 0)) + '₫';
        }

        function fmtDate(d) {
            if (!d) return '—';
            return new Date(d).toLocaleString('vi-VN');
        }

        function escHtml(s) {
            if (!s) return '';
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        async function loadTab(tab) {
            currentTab = tab;
            document.getElementById('tabPending').className = 'btn btn-sm ' + (tab === 'pending' ? 'btn-primary' : 'btn-outline-secondary');
            document.getElementById('tabAll').className    = 'btn btn-sm ' + (tab === 'all'     ? 'btn-primary' : 'btn-outline-secondary');

            document.getElementById('wdList').innerHTML = '<div class="text-center py-4 text-muted">Đang tải…</div>';

            try {
                const url = tab === 'pending' ? '/management/withdrawals' : '/management/withdrawals/all';
                const items = await api.get(url);
                renderList(items);
                if (tab === 'pending') {
                    document.getElementById('pendingCount').textContent = items.length || '';
                }
            } catch (e) {
                document.getElementById('wdList').innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
            }
        }

        function renderList(items) {
            const el = document.getElementById('wdList');
            if (!items || !items.length) {
                el.innerHTML = `
                    <div class="text-center py-5">
                        <i class="bi bi-check-circle-fill text-success fs-1 d-block mb-2"></i>
                        <span class="text-muted">Không có yêu cầu nào cần xử lý.</span>
                    </div>`;
                return;
            }
            el.innerHTML = items.map(w => `
                <div class="wd-card" id="wd-${w.id}">
                    <div class="wd-card-header">
                        <div>
                            <div class="fw-semibold">${escHtml(w.requestCode)}</div>
                            <div class="wd-meta">
                                <i class="bi bi-person me-1"></i>${escHtml(w.userName || '')}
                                <span class="text-muted ms-1">(${escHtml(w.userEmail || '')})</span>
                            </div>
                            <div class="wd-meta"><i class="bi bi-clock me-1"></i>${fmtDate(w.createdAt)}</div>
                        </div>
                        <div class="text-end">
                            <div class="wd-amount">${formatVnd(w.amount)}</div>
                            <span class="status-badge status-${w.status}">${statusLabel(w.status)}</span>
                        </div>
                    </div>
                    <div class="bank-info">
                        <i class="bi bi-bank me-1"></i><strong>${escHtml(w.bankName)}</strong>
                        &nbsp;·&nbsp;STK: <code>${escHtml(w.bankAccountNumber)}</code>
                        &nbsp;·&nbsp;Tên TK: <strong>${escHtml(w.bankAccountName)}</strong>
                    </div>
                    ${w.adminNote ? `<div class="mt-2 small text-muted"><i class="bi bi-chat-left-text me-1"></i>${escHtml(w.adminNote)}</div>` : ''}
                    ${w.status === 'PENDING' ? `
                    <div class="mt-3 d-flex gap-2">
                        <button class="action-btn btn-approve" onclick="approveWd(${w.id})">
                            <i class="bi bi-check-lg me-1"></i>Duyệt & đã chuyển khoản
                        </button>
                        <button class="action-btn btn-reject" onclick="openReject(${w.id})">
                            <i class="bi bi-x-lg me-1"></i>Từ chối
                        </button>
                    </div>` : ''}
                </div>
            `).join('');
        }

        function statusLabel(s) {
            return { PENDING: '⏳ Đang chờ', APPROVED: '✅ Đã duyệt', REJECTED: '❌ Đã từ chối' }[s] || s;
        }

        async function approveWd(id) {
            if (!confirm('Xác nhận đã chuyển khoản thành công và duyệt yêu cầu này?')) return;
            try {
                await api.post(`/management/withdrawals/${id}/approve`, {});
                showToast('Đã duyệt yêu cầu rút tiền.', 'success');
                await loadTab(currentTab);
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        function openReject(id) {
            rejectingId = id;
            document.getElementById('rejectReason').value = '';
            document.getElementById('rejectMsg').textContent = '';
            rejectModal.show();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            rejectModal = new bootstrap.Modal(document.getElementById('rejectModal'));

            document.getElementById('btnConfirmReject').addEventListener('click', async () => {
                const reason = document.getElementById('rejectReason').value.trim();
                if (!reason) {
                    document.getElementById('rejectMsg').textContent = 'Vui lòng nhập lý do từ chối.';
                    return;
                }
                try {
                    await api.post(`/management/withdrawals/${rejectingId}/reject`, { reason });
                    rejectModal.hide();
                    showToast('Đã từ chối và hoàn tiền về ví khách.', 'success');
                    await loadTab(currentTab);
                } catch (e) {
                    document.getElementById('rejectMsg').textContent = e.message;
                }
            });

            await loadTab('pending');
        });

        function showToast(msg, type = 'info') {
            // Simple toast — có thể thay bằng toast component của layout.js nếu có
            const el = document.createElement('div');
            el.style.cssText = `position:fixed;bottom:20px;right:20px;z-index:9999;padding:12px 20px;border-radius:10px;font-weight:600;font-size:14px;
                background:${type === 'success' ? '#16a34a' : type === 'error' ? '#dc2626' : '#4f46e5'};color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15);`;
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3500);
        }
    </script>
</body>

</html>
