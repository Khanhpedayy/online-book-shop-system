<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Tổng quan Kho hàng — Quản trị BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
    <div id="app-layout">
        <div id="sidebar-slot"></div>
        <div class="main-area">
            <div id="header-slot"></div>
            <main class="content-area p-4">
                <div class="mb-4">
                    <h2 class="fw-bold mb-1"><i class="bi bi-box-seam"></i>Tổng quan Kho hàng</h2>
                    <p class="text-muted mb-0">Ma trận kho hàng thời gian thực, cảnh báo sắp hết hàng, cảnh báo vượt mức
                        tồn kho, trạng thái.</p>
                </div>
                <!-- KPI Row -->
                <div class="row g-3 mb-4" id="kpiCards"></div>

                <!-- Tabs -->
                <ul class="nav nav-tabs mb-4">
                    <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#tab-matrix">Ma trận Kho
                            hàng</a></li>
                    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-low">Cảnh báo Sắp hết
                            hàng</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-over">Cảnh báo Vượt mức
                            tồn</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-cond">Theo Tình trạng</a>
                    </li>
                </ul>
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="tab-matrix">
                        <div class="card">
                            <div class="card-body p-0" id="matrixTable"></div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="tab-low">
                        <div class="card">
                            <div class="card-body p-0" id="lowTable"></div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="tab-over">
                        <div class="card">
                            <div class="card-body p-0" id="overTable"></div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="tab-cond">
                        <div class="card">
                            <div class="card-body p-0" id="condTable"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        let matrix = [], lowStock = [], overstock = [], condition = [], stats = {};
        const condColors = { NEW: 'success', LIKE_NEW: 'info', GOOD: 'primary', FAIR: 'warning' };

        async function init() {
            try {
                [matrix, lowStock, overstock, condition, stats] = await Promise.all([
                    api.get('/inventory/overview/variants').catch(() => []),
                    api.get('/inventory/overview/alerts/low-stock').catch(() => []),
                    api.get('/inventory/overview/alerts/overstock').catch(() => []),
                    api.get('/inventory/overview/conditions').catch(() => []),
                    api.get('/reports/summary').catch(() => ({})),
                ]);
            } catch (e) { }
            renderKPI(); renderAll();
        }

        function renderKPI() {
            const s = stats || {};
            const kpis = [
                { l: 'Tổng SKU', v: s.totalSkus || matrix.length, icon: 'bi-tags', bg: '#eff6ff', cl: '#3b82f6' },
                { l: 'Tổng Có sẵn', v: s.totalAvailable || 0, icon: 'bi-box-seam', bg: '#ecfdf5', cl: '#059669' },
                { l: 'Sắp hết hàng', v: lowStock.length, icon: 'bi-exclamation-triangle', bg: '#fef3c7', cl: '#f59e0b' },
                { l: 'Vượt mức tồn', v: overstock.length, icon: 'bi-exclamation-diamond', bg: '#fef2f2', cl: '#ef4444' },
            ];
            document.getElementById('kpiCards').innerHTML = kpis.map(k => `<div class="col-md-3"><div class="stats-card"><div class="stats-icon" style="background:${k.bg};color:${k.cl}"><i class="bi ${k.icon}"></i></div><div class="stats-label">${k.l}</div><div class="stats-value">${k.v}</div></div></div>`).join('');
        }

        function renderAll() {
            // Matrix
            document.getElementById('matrixTable').innerHTML = `<div class="table-responsive"><table class="table table-hover table-sm align-middle mb-0"><thead><tr><th>SKU</th><th>Tiêu đề</th><th>Định dạng</th><th>Có sẵn</th><th>Đã đặt</th><th>Đã bán</th><th>Hư hỏng</th><th>Tổng cộng</th></tr></thead><tbody>${matrix.map(m => `<tr>
        <td><span class="badge bg-light text-dark border font-monospace">${m.sku || '—'}</span></td>
        <td class="text-truncate" style="max-width:220px">${m.title || '—'}</td>
        <td>${m.format ? `<span class="badge bg-info">${m.format}</span>` : '—'}</td>
        <td class="fw-bold text-success">${m.totalAvailable || 0}</td>
        <td>${m.totalReserved || 0}</td>
        <td>${m.totalSold || 0}</td>
        <td class="${(m.totalDamaged || 0) > 0 ? 'text-danger fw-bold' : ''}">${m.totalDamaged || 0}</td>
        <td class="fw-bold">${m.totalCopies || 0}</td>
    </tr>`).join('') || '<tr><td colspan="8" class="text-center text-muted py-5">Không có dữ liệu</td></tr>'}</tbody></table></div>`;

            // Low Stock
            document.getElementById('lowTable').innerHTML = `<div class="table-responsive"><table class="table table-hover table-sm align-middle mb-0"><thead><tr><th>SKU</th><th>Tiêu đề</th><th>Có sẵn</th><th>Ngưỡng báo</th><th>Thiếu hụt</th><th>Nhà cung cấp</th></tr></thead><tbody>${lowStock.map(l => `<tr>
        <td><span class="badge bg-light text-dark border">${l.sku || '—'}</span></td>
        <td class="text-truncate" style="max-width:220px">${l.title || '—'}</td>
        <td class="fw-bold text-danger">${l.currentAvailable || 0}</td>
        <td>${l.reorderThreshold || 0}</td>
        <td><span class="badge bg-danger">${l.deficit || 0}</span></td>
        <td>${l.supplierName || '—'}</td>
    </tr>`).join('') || '<tr><td colspan="6" class="text-center text-muted py-5">Không có mặt hàng nào sắp hết</td></tr>'}</tbody></table></div>`;

            // Overstock
            document.getElementById('overTable').innerHTML = `<div class="table-responsive"><table class="table table-hover table-sm align-middle mb-0"><thead><tr><th>SKU</th><th>Tiêu đề</th><th>Có sẵn</th><th>SL tối đa</th><th>Dư thừa</th><th>Đã bán (30n)</th></tr></thead><tbody>${overstock.map(o => {
                const excess = (o.currentAvailable || 0) - (o.maxQty || 0);
                return `<tr>
        <td><span class="badge bg-light text-dark border">${o.sku || '—'}</span></td>
        <td class="text-truncate" style="max-width:220px">${o.title || '—'}</td>
        <td class="fw-bold">${o.currentAvailable || 0}</td>
        <td>${o.maxQty || 0}</td>
        <td>${excess > 0 ? `<span class="badge bg-warning text-dark">+${excess}</span>` : excess}</td>
        <td>${o.qtySoldLast30Days || 0}</td>
    </tr>`;
            }).join('') || '<tr><td colspan="6" class="text-center text-muted py-5">Không có mặt hàng nào vượt định mức</td></tr>'}</tbody></table></div>`;

            // Condition
            document.getElementById('condTable').innerHTML = `<div class="table-responsive"><table class="table table-hover table-sm align-middle mb-0"><thead><tr><th>SKU</th><th>Tiêu đề</th><th>Tình trạng</th><th>Có sẵn</th><th>Giá bán</th></tr></thead><tbody>${condition.map(c => `<tr>
        <td><span class="badge bg-light text-dark border">${c.sku || '—'}</span></td>
        <td class="text-truncate" style="max-width:220px">${c.title || '—'}</td>
        <td><span class="badge bg-${condColors[c.conditionGrade] || 'secondary'}">${c.conditionGrade || '—'}</span></td>
        <td class="fw-bold">${c.qtyAvailable || 0}</td>
        <td>${(c.sellPrice || 0).toLocaleString()}₫</td>
    </tr>`).join('') || '<tr><td colspan="5" class="text-center text-muted py-5">Không có dữ liệu</td></tr>'}</tbody></table></div>`;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
