<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Xác nhận đơn — BookStore</title>

    <!-- GIỮ NGUYÊN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
<div id="app-layout">
    <div id="sidebar-slot"></div>

    <div class="main-area">
        <div id="header-slot"></div>

        <main class="content-area p-4">

            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-start mb-4">
                <div>
                    <h2 class="fw-bold mb-1">
                        <i class="bi bi-check2-square me-2"></i>
                        Xác nhận đơn hàng
                    </h2>
                    <p class="text-muted mb-0">Xử lý nhiều đơn cùng lúc</p>
                </div>
            </div>

            <!-- WORKSPACE -->
            <div class="row g-3">

                <!-- LEFT -->
                <div class="col-md-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <h6 class="fw-bold mb-3">Đơn NEW</h6>
                            <div id="orderList"></div>
                        </div>
                    </div>
                </div>

                <!-- RIGHT -->
                <div class="col-md-8">
                    <div class="card h-100">
                        <div class="card-body">
                            <h6 class="fw-bold mb-3">Chi tiết</h6>
                            <div id="orderDetail" class="text-muted">
                                Chọn đơn để xem
                            </div>

                            <button class="btn btn-primary mt-3" onclick="confirmOrder()">
                                Confirm
                            </button>
                        </div>
                    </div>
                </div>

            </div>

        </main>
    </div>
</div>

<!-- SCRIPT GIỐNG FILE CHUẨN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/layout.js"></script>

<script>
    let currentId = null;

    async function init() {
        loadOrders();
    }

    async function loadOrders() {
        const data = await api.get('/manager/orders');

        const list = document.getElementById('orderList');
        list.innerHTML = data.map(o => `
            <div class="p-2 border-bottom" style="cursor:pointer"
                 onclick="loadDetail(${o.id})">
                <div class="fw-semibold">${o.order_code}</div>
                <small class="text-muted">${o.ship_name}</small>
            </div>
        `).join('');
    }

    async function loadDetail(id) {
        currentId = id;

        const data = await api.get(`/manager/orders/${id}`);

        document.getElementById('orderDetail').innerHTML = `
            <p><b>Mã:</b> ${data.order.order_code}</p>
            <p><b>Khách:</b> ${data.order.ship_name}</p>
            <p><b>SĐT:</b> ${data.order.ship_phone}</p>
            <p><b>Địa chỉ:</b> ${data.order.ship_line1}</p>
            <p><b>Tổng:</b> ${data.order.total_amount}</p>

            <hr>

            ${data.items.map(i => `
                <div>${i.title_snapshot} x ${i.quantity}</div>
            `).join('')}
        `;
    }

    async function confirmOrder() {
        if (!currentId) return;

        await api.put(`/manager/orders/${currentId}/confirm`);

        showToast('Đã confirm', 'success');

        loadOrders();
        document.getElementById('orderDetail').innerHTML = 'Chọn đơn...';
    }

    document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
