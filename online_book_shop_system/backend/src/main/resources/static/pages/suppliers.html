<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Supplier Management — BookStore Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
    <div id="app-layout">
        <div id="sidebar-slot"></div>
        <div class="main-area">
            <div id="header-slot"></div>
            <main class="content-area p-4">
                <div class="d-flex justify-content-between align-items-start mb-4">
                    <div>
                        <h2 class="fw-bold mb-1"><i class="bi bi-truck"></i>Supplier Management</h2>
                        <p class="text-muted mb-0">Manage suppliers, contacts, and purchase history</p>
                    </div>
                    <button class="btn btn-primary d-flex align-items-center gap-2" onclick="openForm()">
                        <i class="bi bi-plus-lg"></i> Add Supplier
                    </button>
                </div>

                <!-- KPI Cards -->
                <div class="row g-3 mb-4" id="kpiCards"></div>

                <!-- Filters + Table -->
                <div class="card">
                    <div class="card-body">
                        <div class="mb-3"><input type="text" class="form-control" style="max-width:350px"
                                placeholder="Search by name, code, or email…" id="searchInput" oninput="render()"></div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Supplier</th>
                                        <th>Contact</th>
                                        <th>Email</th>
                                        <th style="width:80px">Lots</th>
                                        <th style="width:120px">Qty Received</th>
                                        <th style="width:90px">Status</th>
                                        <th style="width:150px">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <tr>
                                        <td colspan="7" class="text-center py-5 text-muted">Loading…</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div class="modal fade" id="formModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="formTitle">➕ Thêm nhà cung cấp</h5><button type="button"
                        class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="supplierForm" novalidate>
                        <h6 class="text-muted small fw-bold mb-3">Thông tin cơ bản </h6>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Tên nhà cung cấp <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="f_name" required
                                    placeholder="e.g. Alpha Books">
                                <div class="invalid-feedback">Tên là bắt buộc</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Mã nhà cung cấp <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="f_code" required placeholder="e.g. SUP-001">
                                <div class="invalid-feedback">Mã là bắt buộc</div>
                            </div>
                        </div>
                        <h6 class="text-muted small fw-bold mb-3">Thông tin liên hệ</h6>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Người liên hệ</label>
                                <input type="text" class="form-control" id="f_contactPerson" placeholder="Full name">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Số điện thoại</label>
                                <input type="tel" class="form-control" id="f_phone" placeholder="0901 234 567">
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="f_email" placeholder="email@supplier.com">
                                <div class="invalid-feedback">Email không hợp lệ</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Mã số thuế</label>
                                <input type="text" class="form-control" id="f_taxId"
                                    placeholder="Tax identification number">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Địa chỉ</label>
                            <textarea class="form-control" id="f_address" rows="2"
                                placeholder="Full address"></textarea>
                        </div>
                        <h6 class="text-muted small fw-bold mb-3">Cài đặt thêm</h6>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Điều khoản thanh toán</label>
                                <select class="form-select" id="f_paymentTerms">
                                    <option value="">Chọn điều khoản</option>
                                    <option value="NET_30">Thanh toán 30 ngày</option>
                                    <option value="NET_60">Thanh toán 60 ngày</option>
                                    <option value="NET_90">Thanh toán 90 ngày</option>
                                    <option value="COD">Thanh toán khi nhận hàng</option>
                                    <option value="PREPAID">Trả trước</option>
                                </select>
                            </div>
                            <div class="col-md-6" id="activeToggleGroup" style="display:none">
                                <label class="form-label">Trạng thái hoạt động</label>
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input" type="checkbox" id="f_isActive" checked>
                                    <label class="form-check-label" for="f_isActive">Hoạt động</label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="saveSupplier()" id="btnSave">Tạo</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Offcanvas -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="detailDrawer" style="width:500px">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title fw-bold" id="detailTitle"></h5><button type="button" class="btn-close"
                data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body" id="detailBody"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        let suppliers = [];
        let editingId = null;

        async function init() {
            try { suppliers = await api.get('/management/suppliers'); } catch { suppliers = []; }
            renderKPI();
            render();
        }

        function renderKPI() {
            const total = suppliers.length;
            const active = suppliers.filter(s => s.isActive).length;
            const totalLots = suppliers.reduce((s, r) => s + (r.totalLots || 0), 0);
            const totalQty = suppliers.reduce((s, r) => s + (r.totalQtyReceived || 0), 0);
            document.getElementById('kpiCards').innerHTML = `
        <div class="col-md-3"><div class="stats-card"><div class="stats-icon" style="background:#eef2ff;color:#4f46e5"><i class="bi bi-shop-window"></i></div><div class="stats-label">Total Suppliers</div><div class="stats-value">${total}</div></div></div>
        <div class="col-md-3"><div class="stats-card"><div class="stats-icon" style="background:#ecfdf5;color:#059669"><i class="bi bi-check-circle"></i></div><div class="stats-label">Active</div><div class="stats-value">${active}</div></div></div>
        <div class="col-md-3"><div class="stats-card"><div class="stats-icon" style="background:#faf5ff;color:#7c3aed"><i class="bi bi-box-seam"></i></div><div class="stats-label">Total Lots</div><div class="stats-value">${totalLots}</div></div></div>
        <div class="col-md-3"><div class="stats-card"><div class="stats-icon" style="background:#eff6ff;color:#3b82f6"><i class="bi bi-box"></i></div><div class="stats-label">Total Qty Received</div><div class="stats-value">${totalQty.toLocaleString()}</div></div></div>`;
        }

        function render() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = suppliers.filter(s => !q || s.name.toLowerCase().includes(q) || s.code.toLowerCase().includes(q) || (s.email || '').toLowerCase().includes(q));
            const tbody = document.getElementById('tableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">No suppliers found</td></tr>';
                return;
            }
            tbody.innerHTML = filtered.map(r => `<tr>
        <td>
            <div class="d-flex align-items-center gap-3">
                <div style="width:36px;height:36px;border-radius:50%;background:${r.isActive ? '#dbeafe' : '#f1f5f9'};display:flex;align-items:center;justify-content:center">
                    <i class="bi bi-shop-window"></i>
                </div>
                <div><div class="fw-semibold">${r.name}</div><div class="text-muted small">${r.code}</div></div>
            </div>
        </td>
        <td><div class="small">${r.contactPerson || '—'}</div><div class="text-muted" style="font-size:11px">${r.phone || '—'}</div></td>
        <td>${r.email ? `<a href="mailto:${r.email}" class="text-primary small">${r.email}</a>` : '—'}</td>
        <td>${r.totalLots || 0}</td>
        <td class="fw-semibold">${(r.totalQtyReceived || 0).toLocaleString()}</td>
        <td><span class="badge bg-${r.isActive ? 'success' : 'secondary'}">${r.isActive ? 'Active' : 'Inactive'}</span></td>
        <td>
            <button class="btn btn-sm btn-light" title="View" onclick="showDetail(${r.id})"><i class="bi bi-eye"></i></button>
            <button class="btn btn-sm btn-light" title="Edit" onclick="openForm(${r.id})"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-outline-danger" title="Delete" onclick="deleteSupplier(${r.id})"><i class="bi bi-trash"></i></button>
        </td>
    </tr>`).join('');
        }

        function openForm(id) {
            const form = document.getElementById('supplierForm');
            form.reset();
            form.classList.remove('was-validated');
            if (id) {
                const s = suppliers.find(x => x.id === id);
                if (!s) return;
                editingId = id;
                document.getElementById('formTitle').textContent = '<i class="bi bi-pencil me-1"></i>️ Edit Supplier';
                document.getElementById('btnSave').textContent = 'Update';
                document.getElementById('f_name').value = s.name || '';
                document.getElementById('f_code').value = s.code || '';
                document.getElementById('f_contactPerson').value = s.contactPerson || '';
                document.getElementById('f_phone').value = s.phone || '';
                document.getElementById('f_email').value = s.email || '';
                document.getElementById('f_taxId').value = s.taxId || '';
                document.getElementById('f_address').value = s.address || '';
                document.getElementById('f_paymentTerms').value = s.paymentTerms || '';
                document.getElementById('f_isActive').checked = s.isActive !== false;
                document.getElementById('activeToggleGroup').style.display = 'block';
            } else {
                editingId = null;
                document.getElementById('formTitle').textContent = '➕ Add New Supplier';
                document.getElementById('btnSave').textContent = 'Create';
                document.getElementById('activeToggleGroup').style.display = 'none';
            }
            new bootstrap.Modal(document.getElementById('formModal')).show();
        }

        async function saveSupplier() {
            const form = document.getElementById('supplierForm');
            if (!form.checkValidity()) { form.classList.add('was-validated'); showToast('Please fill required fields', 'warning'); return; }

            const payload = {
                name: document.getElementById('f_name').value.trim(),
                code: document.getElementById('f_code').value.trim(),
                contactPerson: document.getElementById('f_contactPerson').value.trim() || null,
                phone: document.getElementById('f_phone').value.trim() || null,
                email: document.getElementById('f_email').value.trim() || null,
                taxId: document.getElementById('f_taxId').value.trim() || null,
                address: document.getElementById('f_address').value.trim() || null,
                paymentTerms: document.getElementById('f_paymentTerms').value || null,
                isActive: document.getElementById('f_isActive').checked,
            };

            try {
                if (editingId) {
                    await api.put(`/management/suppliers/${editingId}`, payload);
                    showToast('Supplier updated', 'success');
                } else {
                    await api.post('/management/suppliers', payload);
                    showToast('Supplier created', 'success');
                }
                bootstrap.Modal.getInstance(document.getElementById('formModal')).hide();
                suppliers = await api.get('/management/suppliers');
                renderKPI(); render();
            } catch (e) { showToast('Error: ' + (e.message || 'Failed'), 'danger'); }
        }

        async function deleteSupplier(id) {
            if (!confirm('Delete this supplier?')) return;
            try { await api.delete(`/management/suppliers/${id}`); showToast('Deleted', 'success'); suppliers = await api.get('/management/suppliers'); renderKPI(); render(); }
            catch (e) { showToast('Failed', 'danger'); }
        }

        function showDetail(id) {
            const s = suppliers.find(x => x.id === id);
            if (!s) return;
            document.getElementById('detailTitle').textContent = s.name;
            document.getElementById('detailBody').innerHTML = `
        <div class="d-flex align-items-center gap-3 mb-4">
            <div style="width:64px;height:64px;border-radius:50%;background:${s.isActive ? '#dbeafe' : '#f1f5f9'};display:flex;align-items:center;justify-content:center">
                <i class="bi bi-shop-window"></i>
            </div>
            <div>
                <h5 class="fw-bold mb-1">${s.name}</h5>
                <span class="badge bg-primary me-1">${s.code}</span>
                <span class="badge bg-${s.isActive ? 'success' : 'secondary'}">${s.isActive ? 'Active' : 'Inactive'}</span>
            </div>
        </div>
        <table class="table table-bordered table-sm mb-4">
            <tr><th>Contact</th><td>${s.contactPerson || '—'}</td></tr>
            <tr><th>Phone</th><td>${s.phone || '—'}</td></tr>
            <tr><th>Email</th><td>${s.email ? `<a href="mailto:${s.email}">${s.email}</a>` : '—'}</td></tr>
            <tr><th>Address</th><td>${s.address || '—'}</td></tr>
            <tr><th>Tax ID</th><td>${s.taxId || '—'}</td></tr>
            <tr><th>Payment Terms</th><td>${s.paymentTerms || '—'}</td></tr>
        </table>
        <div class="row g-3 mb-4">
            <div class="col-6"><div class="stats-card"><div class="stats-label">Total Lots</div><div class="stats-value">${s.totalLots || 0}</div></div></div>
            <div class="col-6"><div class="stats-card"><div class="stats-label">Qty Received</div><div class="stats-value">${(s.totalQtyReceived || 0).toLocaleString()}</div></div></div>
        </div>
        <div class="text-muted small">Created: ${s.createdAt ? new Date(s.createdAt).toLocaleString() : '—'}<br>Updated: ${s.updatedAt ? new Date(s.updatedAt).toLocaleString() : '—'}</div>
        <div class="mt-3"><button class="btn btn-outline-secondary btn-sm" onclick="bootstrap.Offcanvas.getInstance(document.getElementById('detailDrawer')).hide(); openForm(${s.id})"><i class="bi bi-pencil"></i>Edit</button></div>`;
            new bootstrap.Offcanvas(document.getElementById('detailDrawer')).show();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
