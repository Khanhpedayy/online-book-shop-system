<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Báo cáo — Quản trị BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
    <div id="app-layout">
        <div id="sidebar-slot"></div>
        <div class="main-area">
            <div id="header-slot"></div>
            <main class="content-area p-4">
                <div class="mb-4">
                    <h2 class="fw-bold mb-1"><i class="bi bi-bar-chart"></i>Báo cáo</h2>
                    <p class="text-muted mb-0">Doanh số, hàng bán chậm, tuổi lô hàng, giá trị tồn kho, hao hụt</p>
                </div>

                <!-- Tabs -->
                <ul class="nav nav-tabs mb-4" id="reportTabs">
                    <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#tab-overview">Tổng
                            quan</a></li>
                    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-sales">Doanh số</a></li>
                    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-slow">Hàng bán chậm</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-aging">Tuổi lô hàng</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-value">Giá trị tồn kho</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-shrinkage">Hao hụt</a>
                    </li>
                </ul>
                <div class="tab-content">
                    <!-- Overview -->
                    <div class="tab-pane fade show active" id="tab-overview">
                        <div class="row g-3 mb-4" id="summaryKpis"></div>
                        <div class="row g-4">
                            <div class="col-lg-8">
                                <div class="card">
                                    <div class="card-header">
                                        <h6 class="fw-bold mb-0">Doanh số hằng ngày (30 ngày qua)</h6>
                                    </div>
                                    <div class="card-body" id="dailyChart" style="height:320px"></div>
                                </div>
                            </div>
                            <div class="col-lg-4">
                                <div class="card">
                                    <div class="card-header">
                                        <h6 class="fw-bold mb-0">Phân bổ tuổi lô hàng</h6>
                                    </div>
                                    <div class="card-body" id="agingPie" style="height:320px"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Sales -->
                    <div class="tab-pane fade" id="tab-sales">
                        <div class="card mb-4">
                            <div class="card-header">
                                <h6 class="fw-bold mb-0">Doanh số hằng tháng</h6>
                            </div>
                            <div class="card-body" id="monthlyChart" style="height:320px"></div>
                        </div>
                        <div class="card">
                            <div class="card-header">
                                <h6 class="fw-bold mb-0">Sách bán chạy nhất</h6>
                            </div>
                            <div class="card-body p-0" id="topSellingTable"></div>
                        </div>
                    </div>
                    <!-- Slow Movers -->
                    <div class="tab-pane fade" id="tab-slow">
                        <div class="card">
                            <div class="card-body p-0" id="slowTable"></div>
                        </div>
                    </div>
                    <!-- Lot Aging -->
                    <div class="tab-pane fade" id="tab-aging">
                        <div class="card">
                            <div class="card-body p-0" id="agingTable"></div>
                        </div>
                    </div>
                    <!-- Inventory Value -->
                    <div class="tab-pane fade" id="tab-value">
                        <div class="card">
                            <div class="card-body p-0" id="valueTable"></div>
                        </div>
                    </div>
                    <!-- Shrinkage -->
                    <div class="tab-pane fade" id="tab-shrinkage">
                        <div class="row g-3 mb-4" id="shrinkageKpis"></div>
                        <div class="card">
                            <div class="card-body p-0" id="shrinkageTable"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        let summary = {}, daily = [], monthly = [], topSelling = [], slowMovers = [], lotAging = [], invValue = [], shrinkage = [];

        async function init() {
            try {
                [summary, daily, monthly, topSelling, slowMovers, lotAging, invValue, shrinkage] = await Promise.all([
                    api.get('/reports/summary').catch(() => ({})),
                    api.get('/reports/sales/daily').catch(() => []),
                    api.get('/reports/sales/monthly').catch(() => []),
                    api.get('/reports/top-selling').catch(() => []),
                    api.get('/reports/slow-movers').catch(() => []),
                    api.get('/reports/lot-aging').catch(() => []),
                    api.get('/reports/inventory-value').catch(() => []),
                    api.get('/reports/shrinkage').catch(() => []),
                ]);
            } catch (e) { }
            renderAll();
        }

        function renderAll() {
            // Summary KPIs
            const s = summary || {};
            const kpis = [
                { l: 'Tổng số sách', v: s.totalBooks || 0, icon: 'bi-journal-bookmark', bg: '#eff6ff', cl: '#3b82f6' },
                { l: 'Biến thể', v: s.totalVariants || 0, icon: 'bi-tags', bg: '#f0fdf4', cl: '#22c55e' },
                { l: 'Bản sao có sẵn', v: s.totalCopiesAvailable || 0, icon: 'bi-box-seam', bg: '#fef3c7', cl: '#f59e0b' },
                { l: 'Giá trị tồn kho', v: (s.totalInventoryValue || 0).toLocaleString() + '₫', icon: 'bi-credit-card', bg: '#fce7f3', cl: '#ec4899' },
                { l: 'Tổng đơn hàng', v: s.totalOrders || 0, icon: 'bi-cart', bg: '#e0f2fe', cl: '#0ea5e9' },
                { l: 'Doanh thu', v: (s.totalRevenue || 0).toLocaleString() + '₫', icon: 'bi-graph-up-arrow', bg: '#ecfdf5', cl: '#059669' },
            ];
            document.getElementById('summaryKpis').innerHTML = kpis.map(k => `<div class="col-md-4 col-lg-2"><div class="stats-card"><div class="stats-icon" style="background:${k.bg};color:${k.cl}"><i class="bi ${k.icon}"></i></div><div class="stats-label">${k.l}</div><div class="stats-value">${k.v}</div></div></div>`).join('');

            // Daily chart (simple bar-based)
            const dr = [...daily].reverse().slice(-30);
            if (dr.length) {
                const maxR = Math.max(...dr.map(d => d.totalRevenue || 0), 1);
                document.getElementById('dailyChart').innerHTML = `<div class="d-flex align-items-end gap-1" style="height:260px;overflow-x:auto">${dr.map(d => {
                    const h = Math.round(((d.totalRevenue || 0) / maxR) * 240);
                    return `<div class="d-flex flex-column align-items-center" style="flex:1;min-width:22px"><div class="rounded-top" style="width:16px;height:${h}px;background:#3b82f6" title="${d.period}: ${(d.totalRevenue || 0).toLocaleString()}₫ / ${d.totalItemsSold || 0} mục"></div><div style="font-size:8px;transform:rotate(-45deg);margin-top:6px;white-space:nowrap">${(d.period || '').slice(5)}</div></div>`;
                }).join('')}</div>`;
            } else { document.getElementById('dailyChart').innerHTML = '<div class="text-center text-muted py-5">Không có dữ liệu</div>'; }

            // Aging Pie (simple list)
            const buckets = {};
            lotAging.forEach(l => { buckets[l.ageBucket] = (buckets[l.ageBucket] || 0) + (l.qtyAvailable || 0); });
            const bColors = { '0-30': '#22c55e', '31-60': '#f59e0b', '61-90': '#f97316', '90+': '#ef4444' };
            const bEntries = Object.entries(buckets);
            document.getElementById('agingPie').innerHTML = bEntries.length ? `<div class="mt-3">${bEntries.map(([k, v]) => `<div class="d-flex align-items-center mb-3"><div class="rounded-circle me-3" style="width:16px;height:16px;background:${bColors[k] || '#6b7280'}"></div><span class="fw-semibold me-2">${k} ngày</span><div class="progress flex-grow-1 me-2" style="height:8px"><div class="progress-bar" style="width:${Math.min(v * 2, 100)}%;background:${bColors[k] || '#6b7280'}"></div></div><span>${v} bản sao</span></div>`).join('')}</div>` : '<div class="text-center text-muted py-5">Không có dữ liệu</div>';

            // Monthly chart
            const mr = [...monthly].reverse();
            if (mr.length) {
                const maxMR = Math.max(...mr.map(m => m.totalRevenue || 0), 1);
                document.getElementById('monthlyChart').innerHTML = `<div class="d-flex align-items-end gap-2" style="height:260px;overflow-x:auto">${mr.map(m => {
                    const h = Math.round(((m.totalRevenue || 0) / maxMR) * 240);
                    return `<div class="d-flex flex-column align-items-center" style="flex:1;min-width:40px"><div class="rounded-top" style="width:24px;height:${h}px;background:#3b82f6" title="${m.period}: ${(m.totalRevenue || 0).toLocaleString()}₫"></div><div class="mt-1" style="font-size:10px">${m.period || ''}</div></div>`;
                }).join('')}</div>`;
            } else { document.getElementById('monthlyChart').innerHTML = '<div class="text-center text-muted py-5">Không có dữ liệu</div>'; }

            // Top Selling
            document.getElementById('topSellingTable').innerHTML = `<div class="table-responsive"><table class="table table-hover table-sm align-middle mb-0"><thead><tr><th>Tiêu đề</th><th>SKU</th><th>Tổng đã bán</th><th class="text-end">Doanh thu</th></tr></thead><tbody>${topSelling.map(t => `<tr><td>${t.title || '—'}</td><td><span class="badge bg-light text-dark border">${t.sku || '—'}</span></td><td class="fw-bold">${t.totalSold || 0}</td><td class="text-end">${(t.totalRevenue || 0).toLocaleString()}₫</td></tr>`).join('') || '<tr><td colspan="4" class="text-center text-muted py-4">Không có dữ liệu</td></tr>'}</tbody></table></div>`;

            // Slow Movers
            document.getElementById('slowTable').innerHTML = `<div class="table-responsive"><table class="table table-hover table-sm align-middle mb-0"><thead><tr><th>SKU</th><th>Tiêu đề</th><th>Có sẵn</th><th>Đã bán (30 ngày)</th><th>Số ngày từ lần bán cuối</th></tr></thead><tbody>${slowMovers.map(s => `<tr><td><span class="badge bg-light text-dark border">${s.sku || '—'}</span></td><td>${s.title || '—'}</td><td>${s.qtyAvailable || 0}</td><td class="${(s.qtySoldLast30Days || 0) === 0 ? 'fw-bold text-danger' : ''}">${s.qtySoldLast30Days || 0}</td><td>${(s.daysSinceLastSale || 0) > 90 ? `<span class="badge bg-danger">${s.daysSinceLastSale}d</span>` : `${s.daysSinceLastSale || 0} ngày`}</td></tr>`).join('') || '<tr><td colspan="5" class="text-center text-muted py-4">Không có dữ liệu</td></tr>'}</tbody></table></div>`;

            // Lot Aging
            const bucketColor = b => b === '90+' ? 'danger' : b === '61-90' ? 'warning' : b === '31-60' ? 'info' : 'success';
            document.getElementById('agingTable').innerHTML = `<div class="table-responsive"><table class="table table-hover table-sm align-middle mb-0"><thead><tr><th>Mã lô</th><th>SKU</th><th>Tiêu đề</th><th>Nhà cung cấp</th><th>Có sẵn</th><th>Tuổi thọ</th><th>Nhóm</th><th class="text-end">Giá trị vốn</th></tr></thead><tbody>${lotAging.map(l => `<tr><td>${l.lotCode || '—'}</td><td><span class="badge bg-light text-dark border">${l.variantSku || '—'}</span></td><td class="text-truncate" style="max-width:200px">${l.title || '—'}</td><td>${l.supplierName || '—'}</td><td>${l.qtyAvailable || 0}</td><td class="${(l.ageDays || 0) > 90 ? 'fw-bold text-danger' : ''}">${l.ageDays || 0} ngày</td><td><span class="badge bg-${bucketColor(l.ageBucket)}">${l.ageBucket || '—'}</span></td><td class="text-end">${(l.totalCostValue || 0).toLocaleString()}₫</td></tr>`).join('') || '<tr><td colspan="8" class="text-center text-muted py-4">Không có dữ liệu</td></tr>'}</tbody></table></div>`;

            // Inventory Value
            document.getElementById('valueTable').innerHTML = `<div class="table-responsive"><table class="table table-hover table-sm align-middle mb-0"><thead><tr><th>SKU</th><th>Tiêu đề</th><th>SL có sẵn</th><th class="text-end">Chi phí TB</th><th class="text-end">Tổng chi phí</th><th class="text-end">Giá trị bán lẻ</th></tr></thead><tbody>${invValue.map(v => `<tr><td><span class="badge bg-light text-dark border">${v.sku || '—'}</span></td><td class="text-truncate" style="max-width:200px">${v.title || '—'}</td><td>${v.totalQtyAvailable || 0}</td><td class="text-end">${(v.avgUnitCost || 0).toLocaleString()}₫</td><td class="text-end fw-semibold">${(v.totalCostValue || 0).toLocaleString()}₫</td><td class="text-end">${(v.totalRetailValue || 0).toLocaleString()}₫</td></tr>`).join('') || '<tr><td colspan="6" class="text-center text-muted py-4">Không có dữ liệu</td></tr>'}</tbody></table></div>`;

            // Shrinkage
            const shrinkColor = r => r === 'DAMAGED' ? 'danger' : r === 'LOST' ? 'warning' : 'primary';
            const reasonMap = { 'DAMAGED': 'Hư hỏng', 'LOST': 'Thất lạc' };
            document.getElementById('shrinkageKpis').innerHTML = shrinkage.map(s => `<div class="col-md-4"><div class="stats-card"><div class="stats-icon" style="background:#fef2f2;color:#ef4444"><i class="bi bi-exclamation-triangle"></i></div><div class="stats-label">${reasonMap[s.reason] || s.reason}</div><div class="stats-value" style="color:${s.reason === 'DAMAGED' ? '#ef4444' : s.reason === 'LOST' ? '#f97316' : '#3b82f6'}">${s.totalQty} <span style="font-size:12px;color:#9ca3af">(${s.incidentCount} sự cố)</span></div></div></div>`).join('');
            document.getElementById('shrinkageTable').innerHTML = `<div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead><tr><th>Lý do</th><th>Tổng SL</th><th>Số sự cố</th></tr></thead><tbody>${shrinkage.map(s => `<tr><td><span class="badge bg-${shrinkColor(s.reason)}">${reasonMap[s.reason] || s.reason}</span></td><td class="fw-bold">${s.totalQty || 0}</td><td>${s.incidentCount || 0}</td></tr>`).join('') || '<tr><td colspan="3" class="text-center text-muted py-4">Không có dữ liệu</td></tr>'}</tbody></table></div>`;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
