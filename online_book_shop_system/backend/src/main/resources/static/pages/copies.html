<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sổ đăng ký Bản sao — Quản trị BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
    <div id="app-layout">
        <div id="sidebar-slot"></div>
        <div class="main-area">
            <div id="header-slot"></div>
            <main class="content-area p-4">
                <div class="d-flex justify-content-between align-items-start mb-4">
                    <div>
                        <h2 class="fw-bold mb-1"><i class="bi bi-qr-code-scan"></i>Sổ đăng ký Bản sao</h2>
                        <p class="text-muted mb-0">Theo dõi từng bản sao, quản lý tình trạng, vị trí và vòng đời
                        </p>
                    </div>
                </div>

                <!-- Status KPI Cards -->
                <div class="row g-3 mb-4" id="kpiCards"></div>

                <!-- Filters + Table -->
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex gap-3 mb-3 flex-wrap">
                            <input type="text" class="form-control" style="max-width:420px"
                                placeholder="Tìm theo mã bản sao, mã lô, SKU, hoặc tên sách…" id="searchInput"
                                oninput="render()">
                            <select class="form-select" style="max-width:160px" id="statusFilter" onchange="render()">
                                <option value="">Tất cả trạng thái</option>
                                <option value="AVAILABLE"> Có sẵn</option>
                                <option value="RESERVED"><i class="bi bi-lock me-1"></i> Đã đặt</option>
                                <option value="SOLD"><i class="bi bi-cash-coin me-1"></i> Đã bán</option>
                                <option value="DAMAGED">🔴 Hư hỏng</option>
                                <option value="LOST"> Thất lạc</option>
                                <option value="RETURNED"> Đã trả</option>
                            </select>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Bản sao</th>
                                        <th>Sách / Biến thể</th>
                                        <th style="width:90px">Vị trí</th>
                                        <th style="width:100px">Tình trạng</th>
                                        <th style="width:110px">Trạng thái</th>
                                        <th style="width:180px"></th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <tr>
                                        <td colspan="6" class="text-center py-5 text-muted">Đang tải…</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Change Condition Modal -->
    <div class="modal fade" id="condModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="condTitle"><i class="bi bi-arrow-repeat me-1"></i> Đổi tình
                        trạng</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="p-3 bg-light rounded mb-3"><span class="text-muted">Hiện tại: </span><span
                            class="badge bg-info" id="condCurrent"></span></div>
                    <form id="condForm">
                        <div class="mb-3"><label class="form-label">Tình trạng mới <span
                                    class="text-danger">*</span></label>
                            <select class="form-select" id="cf_conditionGrade" required>
                                <option value="NEW"> Mới (New)</option>
                                <option value="LIKE_NEW"> Như mới (Like New)</option>
                                <option value="GOOD"> Tốt (Good)</option>
                                <option value="FAIR"> Khá (Fair)</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">Hủy</button><button type="button" class="btn btn-primary"
                        onclick="saveCond()">Cập nhật</button></div>
            </div>
        </div>
    </div>

    <!-- Move Location Modal -->
    <div class="modal fade" id="moveModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="moveTitle"><i class="bi bi-geo-alt me-1"></i> Đổi vị trí</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="p-3 bg-light rounded mb-3"><span class="text-muted">Hiện tại: </span><span
                            class="font-monospace fw-semibold" id="moveCurrent"></span></div>
                    <form id="moveForm">
                        <div class="mb-3"><label class="form-label">Vị trí mới <span
                                    class="text-danger">*</span></label><input type="text" class="form-control"
                                id="mf_newLocation" required placeholder="VD: Kệ A1-02"></div>
                        <div class="mb-3"><label class="form-label">Ghi chú di chuyển</label><textarea
                                class="form-control" id="mf_note" rows="2" placeholder="Lý do di chuyển…"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">Hủy</button><button type="button" class="btn btn-primary"
                        onclick="saveMove()">Di chuyển</button></div>
            </div>
        </div>
    </div>

    <!-- Mark Status Modal -->
    <div class="modal fade" id="statusModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="statusTitle"> Đánh dấu trạng thái</h5><button type="button"
                        class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="p-3 bg-light rounded mb-3"><span class="text-muted">Hiện tại: </span><span class="badge"
                            id="statusCurrent"></span></div>
                    <form id="statusForm">
                        <div class="mb-3"><label class="form-label">Trạng thái mới <span
                                    class="text-danger">*</span></label>
                            <select class="form-select" id="sf_status" required>
                                <option value="DAMAGED">🔴 Hư hỏng</option>
                                <option value="LOST"> Thất lạc</option>
                                <option value="AVAILABLE"> Đã tìm thấy (Có sẵn)</option>
                            </select>
                        </div>
                        <div class="mb-3"><label class="form-label">Lý do <span
                                    class="text-danger">*</span></label><input type="text" class="form-control"
                                id="sf_reason" required placeholder="VD: Bị hỏng do nước, Tìm thấy sau kiểm kê"></div>
                    </form>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">Hủy</button><button type="button" class="btn btn-primary"
                        onclick="saveStatus()">Cập nhật</button></div>
            </div>
        </div>
    </div>

    <!-- Lifecycle Drawer -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="detailDrawer" style="width:700px">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title fw-bold" id="detailTitle"></h5><button type="button" class="btn-close"
                data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body" id="detailBody"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        let copies = [];
        let activeCopy = null;
        const condColor = { NEW: 'success', LIKE_NEW: 'info', GOOD: 'primary', FAIR: 'warning' };
        const condLabel = { NEW: ' Mới', LIKE_NEW: ' Như mới', GOOD: ' Tốt', FAIR: ' Khá' };
        const stColor = { AVAILABLE: 'success', RESERVED: 'warning', SOLD: 'primary', DAMAGED: 'danger', LOST: 'dark', RETURNED: 'secondary' };
        const stLabel = { AVAILABLE: 'Có sẵn', RESERVED: 'Đã đặt', SOLD: 'Đã bán', DAMAGED: 'Hư hỏng', LOST: 'Thất lạc', RETURNED: 'Đã trả' };

        async function init() {
            try { copies = await api.get('/inventory/copies'); } catch { copies = []; }
            renderKPI(); render();
        }

        function renderKPI() {
            const counts = {};
            copies.forEach(c => { counts[c.status] = (counts[c.status] || 0) + 1; });
            document.getElementById('kpiCards').innerHTML = Object.entries(counts).map(([s, c]) =>
                `<div class="col-md-2 col-sm-4"><div class="stats-card cursor-pointer ${document.getElementById('statusFilter')?.value === s ? 'border border-primary shadow' : ''}">
            <div class="stats-label small">${stLabel[s] || s}</div><div class="stats-value">${c}</div>
        </div></div>`
            ).join('');
        }

        function render() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const sf = document.getElementById('statusFilter').value;
            const filtered = copies.filter(c => {
                const ms = !q || (c.copyCode || '').toLowerCase().includes(q) || (c.lotCode || '').toLowerCase().includes(q) || (c.variantSku || '').toLowerCase().includes(q) || (c.bookTitle || '').toLowerCase().includes(q);
                const mst = !sf || c.status === sf;
                return ms && mst;
            });
            const tbody = document.getElementById('tableBody');
            if (!filtered.length) { tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">Không tìm thấy bản sao nào</td></tr>'; return; }
            tbody.innerHTML = filtered.map(r => `<tr>
        <td><a href="javascript:void(0)" onclick="showLifecycle(${r.id})" class="font-monospace fw-semibold text-primary">${r.copyCode}</a><div class="text-muted" style="font-size:10px">Lô hàng: ${r.lotCode || '—'}</div></td>
        <td><div class="fw-medium text-truncate" style="max-width:200px">${r.bookTitle || '—'}</div><span class="badge bg-light text-dark border" style="font-size:10px">${r.variantSku || '—'}</span></td>
        <td class="font-monospace small">${r.location || '—'}</td>
        <td><span class="badge bg-${condColor[r.conditionGrade] || 'secondary'}">${condLabel[r.conditionGrade] || r.conditionGrade}</span></td>
        <td><span class="badge bg-${stColor[r.status] || 'secondary'}">${stLabel[r.status] || r.status}</span></td>
        <td>
            <button class="btn btn-sm btn-light" title="Xem vòng đời" onclick="showLifecycle(${r.id})"><i class="bi bi-clock-history"></i></button>
            <button class="btn btn-sm btn-light" title="Đổi tình trạng" onclick="openCond(${r.id})"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-light" title="Đổi vị trí" onclick="openMove(${r.id})"><i class="bi bi-geo-alt"></i></button>
            <button class="btn btn-sm btn-light" title="Đánh dấu trạng thái" onclick="openStatus(${r.id})"><i class="bi bi-exclamation-triangle"></i></button>
        </td>
    </tr>`).join('');
        }

        function findCopy(id) { return copies.find(c => c.id === id); }

        function openCond(id) {
            activeCopy = findCopy(id); if (!activeCopy) return;
            document.getElementById('condTitle').innerHTML = `<i class="bi bi-arrow-repeat me-1"></i> Đổi tình trạng — <span class="text-primary font-monospace small">${activeCopy.copyCode}</span>`;
            document.getElementById('condCurrent').textContent = condLabel[activeCopy.conditionGrade] || activeCopy.conditionGrade;
            document.getElementById('cf_conditionGrade').value = activeCopy.conditionGrade;
            new bootstrap.Modal(document.getElementById('condModal')).show();
        }

        async function saveCond() {
            if (!activeCopy) return;
            try {
                await api.patch(`/inventory/copies/${activeCopy.id}/condition`, { conditionGrade: document.getElementById('cf_conditionGrade').value });
                showToast('Đã cập nhật tình trạng', 'success');
                bootstrap.Modal.getInstance(document.getElementById('condModal')).hide();
                copies = await api.get('/inventory/copies'); renderKPI(); render();
            } catch (e) { showToast('Thất bại', 'danger'); }
        }

        function openMove(id) {
            activeCopy = findCopy(id); if (!activeCopy) return;
            document.getElementById('moveTitle').innerHTML = `<i class="bi bi-geo-alt me-1"></i> Đổi vị trí — <span class="text-primary font-monospace small">${activeCopy.copyCode}</span>`;
            document.getElementById('moveCurrent').textContent = activeCopy.location || '—';
            document.getElementById('mf_newLocation').value = activeCopy.location || '';
            document.getElementById('mf_note').value = '';
            new bootstrap.Modal(document.getElementById('moveModal')).show();
        }

        async function saveMove() {
            if (!activeCopy) return;
            const loc = document.getElementById('mf_newLocation').value.trim();
            if (!loc) { showToast('Yêu cầu nhập vị trí', 'warning'); return; }
            try {
                await api.patch(`/inventory/copies/${activeCopy.id}/location`, { newLocation: loc, note: document.getElementById('mf_note').value.trim() || null });
                showToast('Đã cập nhật vị trí', 'success');
                bootstrap.Modal.getInstance(document.getElementById('moveModal')).hide();
                copies = await api.get('/inventory/copies'); render();
            } catch (e) { showToast('Thất bại', 'danger'); }
        }

        function openStatus(id) {
            activeCopy = findCopy(id); if (!activeCopy) return;
            document.getElementById('statusTitle').innerHTML = ` Đánh dấu trạng thái — <span class="text-primary font-monospace small">${activeCopy.copyCode}</span>`;
            document.getElementById('statusCurrent').textContent = stLabel[activeCopy.status] || activeCopy.status;
            document.getElementById('statusCurrent').className = `badge bg-${stColor[activeCopy.status] || 'secondary'}`;
            document.getElementById('sf_reason').value = '';
            new bootstrap.Modal(document.getElementById('statusModal')).show();
        }

        async function saveStatus() {
            if (!activeCopy) return;
            const status = document.getElementById('sf_status').value;
            const reason = document.getElementById('sf_reason').value.trim();
            if (!reason) { showToast('Yêu cầu nhập lý do', 'warning'); return; }
            try {
                await api.patch(`/inventory/copies/${activeCopy.id}/status`, { status, reason });
                showToast('Đã cập nhật trạng thái', 'success');
                bootstrap.Modal.getInstance(document.getElementById('statusModal')).hide();
                copies = await api.get('/inventory/copies'); renderKPI(); render();
            } catch (e) { showToast('Thất bại', 'danger'); }
        }

        async function showLifecycle(id) {
            try {
                const lc = await api.get(`/inventory/copies/${id}/lifecycle`);
                document.getElementById('detailTitle').innerHTML = `<i class="bi bi-clipboard me-1"></i> Bản sao: ${lc.copyCode}`;
                const txHtml = (lc.transactions || []).map(t => {
                    const color = t.movementType === 'IN' ? 'success' : t.movementType === 'OUT' ? 'danger' : 'primary';
                    const moveMap = { IN: 'NHẬP', OUT: 'XUẤT' };
                    return `<div class="d-flex gap-3 mb-3">
                <div><span class="badge bg-${color}" style="width:40px">${moveMap[t.movementType] || t.movementType}</span></div>
                <div><div class="fw-medium">${t.reason || '—'}</div>${t.note ? `<div class="text-muted small">${t.note}</div>` : ''}
                    <div class="text-muted" style="font-size:11px">${t.createdAt ? new Date(t.createdAt).toLocaleString('vi-VN') : '—'}</div>
                </div>
            </div>`;
                }).join('');

                document.getElementById('detailBody').innerHTML = `
            <div class="d-flex gap-3 mb-4 align-items-start">
                <div style="width:48px;height:48px;border-radius:10px;background:#dbeafe;display:flex;align-items:center;justify-content:center"><i class="bi bi-qr-code"></i></div>
                <div>
                    <h5 class="fw-bold mb-1">${lc.bookTitle || '—'}</h5>
                    <span class="badge bg-light text-dark border me-1">${lc.variantSku || '—'}</span>
                    <span class="badge bg-${stColor[lc.status] || 'secondary'}">${stLabel[lc.status] || lc.status}</span>
                    <span class="badge bg-${condColor[lc.conditionGrade] || 'secondary'}">${condLabel[lc.conditionGrade] || lc.conditionGrade}</span>
                </div>
            </div>
            <table class="table table-bordered table-sm mb-4">
                <tr><th>Mã bản sao</th><td class="font-monospace">${lc.copyCode}</td><th>Lô hàng</th><td>${lc.lotCode || '—'}</td></tr>
                <tr><th>Vị trí</th><td class="font-monospace">${lc.location || '—'}</td><th>Nhà CC</th><td>${lc.supplierName || '—'}</td></tr>
                <tr><th>Đơn giá nhập</th><td>${(lc.unitCost || 0).toLocaleString()}₫</td><th>Ngày nhận</th><td>${lc.receivedAt ? new Date(lc.receivedAt).toLocaleDateString('vi-VN') : '—'}</td></tr>
            </table>
            <h6 class="fw-bold mb-3"><i class="bi bi-clock-history"></i> Lịch sử giao dịch</h6>
            ${txHtml || '<p class="text-muted">Không có giao dịch nào được ghi lại</p>'}`;
                new bootstrap.Offcanvas(document.getElementById('detailDrawer')).show();
            } catch (e) { showToast('Lỗi tải vòng đời', 'danger'); }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
