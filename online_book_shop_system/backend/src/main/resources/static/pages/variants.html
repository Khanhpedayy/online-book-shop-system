<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Biến thể & Giá — Quản trị BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
    <div id="app-layout">
        <div id="sidebar-slot"></div>
        <div class="main-area">
            <div id="header-slot"></div>
            <main class="content-area p-4">
                <div class="d-flex justify-content-between align-items-start mb-4">
                    <div>
                        <h2 class="fw-bold mb-1"><i class="bi bi-tags"></i>Biến thể & Giá</h2>
                        <p class="text-muted mb-0">Quản lý các biến thể sách và thiết lập giá.</p>
                    </div>
                    <button class="btn btn-primary d-flex align-items-center gap-2" onclick="openCreate()">
                        <i class="bi bi-plus-lg"></i> Tạo biến thể
                    </button>
                </div>

                <!-- KPI -->
                <div class="row g-3 mb-4" id="kpiCards"></div>

                <!-- Filters -->
                <div class="card mb-4">
                    <div class="card-body py-3 d-flex gap-3">
                        <input type="text" class="form-control" style="max-width:350px"
                            placeholder="Tìm theo SKU, tiêu đề hoặc phiên bản…" id="searchInput" oninput="render()">
                        <select class="form-select" style="max-width:160px" id="formatFilter" onchange="render()">
                            <option value="">Tất cả định dạng</option>
                            <option value="HARDCOVER">Bìa cứng</option>
                            <option value="PAPERBACK">Bìa mềm</option>
                            <option value="BOXSET">Boxset</option>
                        </select>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th style="width:130px">SKU</th>
                                        <th>Sách</th>
                                        <th style="width:120px">Định dạng</th>
                                        <th style="width:130px">Phiên bản</th>
                                        <th style="width:130px" class="text-end">Giá niêm yết</th>
                                        <th style="width:130px" class="text-end">Giá bán</th>
                                        <th style="width:100px">Tồn kho</th>
                                        <th style="width:90px">Trạng thái</th>
                                        <th style="width:90px" class="text-center">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <tr>
                                        <td colspan="9" class="text-center py-5 text-muted">Đang tải…</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div class="modal fade" id="formModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="formTitle">Tạo biến thể</h5><button type="button"
                        class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="variantForm" novalidate>
                        <div id="bookIdField" class="position-relative">
                            <div class="mb-3"><label class="form-label">Tên Sách hoặc ISBN <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="f_bookSearch" required placeholder="Gõ từ khóa, ISBN..." autocomplete="off">
                                <input type="hidden" id="f_bookId">
                                <div class="invalid-feedback">Vui lòng tìm và chọn một cuốn Sách từ danh sách</div>
                                <ul class="dropdown-menu w-100 shadow-sm" id="bookSearchDropdown" style="max-height:250px; overflow-y:auto; display:none; position:absolute;"></ul>
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6"><label class="form-label">SKU <span
                                        class="text-danger">*</span></label><input type="text" class="form-control"
                                    id="f_sku" required placeholder="VD: BK-001-HC-EN">
                                <div class="invalid-feedback">SKU là bắt buộc</div>
                            </div>
                            <div class="col-md-6"><label class="form-label">Định dạng</label><select class="form-select"
                                    id="f_format">
                                    <option value="">Chọn định dạng</option>
                                    <option value="HARDCOVER">Bìa cứng</option>
                                    <option value="PAPERBACK">Bìa mềm</option>
                                    <option value="BOXSET">Boxset</option>
                                </select></div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6"><label class="form-label">Phiên bản</label><input type="text"
                                    class="form-control" id="f_edition" placeholder="VD: Bản in lần 1"></div>
                            <div class="col-md-6"><label class="form-label">Ngôn ngữ</label><input type="text"
                                    class="form-control" id="f_language" placeholder="VD: vi"></div>
                        </div>
                        <hr>
                        <h6 class="fw-bold small text-muted mb-3">Giá cả</h6>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6"><label class="form-label">Giá niêm yết (₫)</label><input type="number"
                                    class="form-control" id="f_listPrice" min="0" step="1000"></div>
                            <div class="col-md-6"><label class="form-label">Giá bán (₫)</label><input type="number"
                                    class="form-control" id="f_salePrice" min="0" step="1000"></div>
                        </div>
                        <hr>
                        <h6 class="fw-bold small text-muted mb-3">Kích thước & Trọng lượng</h6>
                        <div class="row g-3 mb-3">
                            <div class="col-md-4"><label class="form-label">Số trang</label><input type="number"
                                    class="form-control" id="f_pageCount" min="0"></div>
                            <div class="col-md-4"><label class="form-label">Trọng lượng (g)</label><input type="number"
                                    class="form-control" id="f_weightGrams" min="0"></div>
                            <div class="col-md-4"><label class="form-label">Độ dày (mm)</label><input type="number"
                                    class="form-control" id="f_thicknessMm" min="0"></div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6"><label class="form-label">Chiều rộng (mm)</label><input type="number"
                                    class="form-control" id="f_widthMm" min="0"></div>
                            <div class="col-md-6"><label class="form-label">Chiều cao (mm)</label><input type="number"
                                    class="form-control" id="f_heightMm" min="0"></div>
                        </div>
                        <div id="isActiveField" style="display:none" class="mb-3">
                            <div class="form-check form-switch"><input class="form-check-input" type="checkbox"
                                    id="f_isActive" checked><label class="form-check-label" for="f_isActive">Hoạt
                                    động</label></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="save()" id="btnSave">Tạo</button>
                </div>
            </div>
        </div>
    </div>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        let variants = [];
        let editingId = null;
        const FC = { HARDCOVER: 'primary', PAPERBACK: 'success', BOXSET: 'secondary' };
        const FmtName = { HARDCOVER: 'Bìa cứng', PAPERBACK: 'Bìa mềm', BOXSET: 'Boxset' };
        const fmt = v => v != null ? new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(v) : '—';

        async function init() {
            const bp = new URLSearchParams(window.location.search).get('bookId');
            try { variants = await api.get('/management/variants' + (bp ? '?bookId=' + bp : '')); } catch { variants = []; }
            renderKPI(); render();
        }

        function renderKPI() {
            const total = variants.length, active = variants.filter(v => v.isActive).length;
            const ts = variants.reduce((s, v) => s + (v.totalCopies || 0), 0), av = variants.reduce((s, v) => s + (v.availableCopies || 0), 0);
            document.getElementById('kpiCards').innerHTML = `
        <div class="col-md-3"><div class="stats-card"><div class="stats-icon" style="background:#eef2ff;color:#4f46e5"><i class="bi bi-grid"></i></div><div class="stats-label">Tổng số biến thể</div><div class="stats-value">${total}</div></div></div>
        <div class="col-md-3"><div class="stats-card"><div class="stats-icon" style="background:#ecfdf5;color:#059669"><i class="bi bi-check-circle"></i></div><div class="stats-label">Đang HĐ</div><div class="stats-value">${active}</div></div></div>
        <div class="col-md-3"><div class="stats-card"><div class="stats-icon" style="background:#faf5ff;color:#7c3aed"><i class="bi bi-boxes"></i></div><div class="stats-label">Tổng SL nhập</div><div class="stats-value">${ts}</div></div></div>
        <div class="col-md-3"><div class="stats-card"><div class="stats-icon" style="background:#eff6ff;color:#3b82f6"><i class="bi bi-shop"></i></div><div class="stats-label">Tổng tồn kho </div><div class="stats-value">${av}</div></div></div>`;
        }

        function render() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const ff = document.getElementById('formatFilter').value;
            const filtered = variants.filter(v => {
                const ms = !q || v.sku.toLowerCase().includes(q) || (v.bookTitle || '').toLowerCase().includes(q) || (v.edition || '').toLowerCase().includes(q);
                const mf = !ff || v.format === ff;
                return ms && mf;
            });
            const tbody = document.getElementById('tableBody');
            if (!filtered.length) { tbody.innerHTML = '<tr><td colspan="9" class="text-center py-5 text-muted">Không tìm thấy biến thể nào</td></tr>'; return; }
            tbody.innerHTML = filtered.map(v => {
                const fc = FC[v.format] || 'secondary';
                const fn = FmtName[v.format] || v.format;
                const sdiff = v.salePrice < v.listPrice;
                return `<tr>
            <td class="font-monospace fw-semibold small">${v.sku}</td>
            <td class="text-truncate" style="max-width:200px">${v.bookTitle || '—'}</td>
            <td>${v.format ? `<span class="badge bg-${fc}">${fn}</span>` : '—'}</td>
            <td>${v.edition || '—'}</td>
            <td class="text-end">${fmt(v.listPrice)}</td>
            <td class="text-end ${sdiff ? 'text-danger fw-semibold' : ''}">${fmt(v.salePrice)}</td>
            <td><span class="${v.availableCopies === 0 ? 'text-danger fw-semibold' : 'text-success'}">${v.availableCopies || 0} / ${v.totalCopies || 0}</span></td>
            <td>${v.isActive ? '<span class="badge bg-success">Đang HĐ</span>' : '<span class="badge bg-secondary">Ngừng HĐ</span>'}</td>
            <td>
                <div class="d-flex justify-content-center gap-1 flex-nowrap">
                    <button class="btn btn-sm btn-outline-primary" title="Sửa biến thể" onclick="openEdit(${v.id})"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-sm btn-outline-danger" title="Xóa" onclick="deleteVariant(${v.id})"><i class="bi bi-trash"></i></button>
                </div>
            </td>
        </tr>`;
            }).join('');
        }

        function openCreate() {
            editingId = null;
            document.getElementById('formTitle').textContent = 'Thêm biến thể / SKU mới';
            document.getElementById('btnSave').textContent = 'Tạo';
            document.getElementById('bookIdField').style.display = 'block';
            document.getElementById('f_bookSearch').required = true;
            document.getElementById('isActiveField').style.display = 'none';
            document.getElementById('variantForm').reset();
            document.getElementById('f_bookId').value = '';
            document.getElementById('f_bookSearch').value = '';
            document.getElementById('bookSearchDropdown').style.display = 'none';
            document.getElementById('variantForm').classList.remove('was-validated');
            const bp = new URLSearchParams(window.location.search).get('bookId');
            if (bp) {
                document.getElementById('f_bookId').value = bp;
                document.getElementById('f_bookSearch').value = "ID sách đã chọn: " + bp;
            }
            new bootstrap.Modal(document.getElementById('formModal')).show();
        }

        function openEdit(id) {
            const v = variants.find(x => x.id === id); if (!v) return;
            editingId = id;
            document.getElementById('formTitle').textContent = 'Sửa biến thể';
            document.getElementById('btnSave').textContent = 'Cập nhật';
            document.getElementById('bookIdField').style.display = 'none';
            document.getElementById('f_bookSearch').required = false;
            document.getElementById('isActiveField').style.display = 'block';
            document.getElementById('f_sku').value = v.sku || '';
            document.getElementById('f_format').value = v.format || '';
            document.getElementById('f_edition').value = v.edition || '';
            document.getElementById('f_language').value = v.language || '';
            document.getElementById('f_listPrice').value = v.listPrice || '';
            document.getElementById('f_salePrice').value = v.salePrice || '';
            document.getElementById('f_pageCount').value = v.pageCount || '';
            document.getElementById('f_weightGrams').value = v.weightGrams || '';
            document.getElementById('f_thicknessMm').value = v.thicknessMm || '';
            document.getElementById('f_widthMm').value = v.widthMm || '';
            document.getElementById('f_heightMm').value = v.heightMm || '';
            document.getElementById('f_isActive').checked = v.isActive !== false;
            document.getElementById('variantForm').classList.remove('was-validated');
            new bootstrap.Modal(document.getElementById('formModal')).show();
        }

        async function save() {
            const form = document.getElementById('variantForm');
            if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
            
            const payload = {};
            ['sku', 'format', 'edition', 'language'].forEach(f => { const v = document.getElementById('f_' + f).value.trim(); if (v) payload[f] = v; });
            
            const listPrice = document.getElementById('f_listPrice').value;
            const salePrice = document.getElementById('f_salePrice').value;
            if (!listPrice || listPrice === '') { showToast('Vui lòng nhập Giá niêm yết', 'warning'); return; }
            if (!salePrice || salePrice === '') { showToast('Vui lòng nhập Giá bán', 'warning'); return; }
            
            payload.listPrice = Number(listPrice);
            payload.salePrice = Number(salePrice);
            
            ['pageCount', 'weightGrams', 'thicknessMm', 'widthMm', 'heightMm'].forEach(f => { const v = document.getElementById('f_' + f).value; if (v !== '') payload[f] = Number(v); });
            
            if (!editingId) {
                const bId = Number(document.getElementById('f_bookId').value);
                if (!bId || bId <= 0) {
                    showToast('Vui lòng tìm và SỬ DỤNG CHUỘT BẤM CHỌN một cuốn Sách từ danh sách gợi ý!', 'danger');
                    return;
                }
                payload.bookId = bId;
            } else {
                payload.isActive = document.getElementById('f_isActive').checked;
            }
            try {
                if (editingId) { await api.put(`/management/variants/${editingId}`, payload); showToast('Đã cập nhật biến thể', 'success'); }
                else { await api.post('/management/variants', payload); showToast('Đã tạo biến thể', 'success'); }
                bootstrap.Modal.getInstance(document.getElementById('formModal')).hide();
                variants = await api.get('/management/variants'); renderKPI(); render();
            } catch (e) {
                const msg = e.message || '';
                if (msg.includes('UX_bv_sku') || msg.includes('sku')) {
                    const field = document.getElementById('f_sku');
                    field.classList.add('is-invalid');
                    field.focus();
                    showToast('SKU "' + (document.getElementById('f_sku').value) + '" đã tồn tại. Vui lòng dùng SKU khác.', 'danger');
                } else {
                    showToast('Lỗi: ' + (msg || 'Thất bại'), 'danger');
                }
            }
        }

        async function deleteVariant(id) {
            const v = variants.find(x => x.id === id);
            if (!confirm(`Bạn có chắc chắn muốn xóa biến thể ${v?.sku}?`)) return;
            try { await api.delete(`/management/variants/${id}`); showToast('Đã xóa', 'success'); variants = await api.get('/management/variants'); renderKPI(); render(); }
            catch (e) { showToast('Thất bại', 'danger'); }
        }

        let searchTimer = null;
        document.getElementById('f_bookSearch').addEventListener('input', function(e) {
            const val = e.target.value.trim();
            const dd = document.getElementById('bookSearchDropdown');
            document.getElementById('f_bookId').value = ''; 
            if (val.length < 2) { dd.style.display = 'none'; return; }
            clearTimeout(searchTimer);
            searchTimer = setTimeout(async () => {
                try {
                    const res = await api.get('/management/books/search?q=' + encodeURIComponent(val));
                    if (res && res.length) {
                        dd.innerHTML = res.map(b => `<li><a class="dropdown-item py-2 border-bottom" href="javascript:void(0)" onclick="selectBook(${b.id}, '${(b.title || '').replace(/'/g, "\\'")}', '${b.isbn13 || b.isbn10 || ''}')"><div class="fw-bold text-truncate" style="max-width:300px">${b.title}</div><div class="small text-muted"><i class="bi bi-upc-scan"></i> ISBN: ${b.isbn13 || b.isbn10 || 'N/A'}</div></a></li>`).join('');
                        dd.style.display = 'block';
                    } else {
                        dd.innerHTML = '<li class="dropdown-item text-muted text-center py-3">Không tìm thấy sách</li>';
                        dd.style.display = 'block';
                    }
                } catch(e) { console.error(e); }
            }, 300);
        });
        
        function selectBook(id, title, isbn) {
            document.getElementById('f_bookId').value = id;
            document.getElementById('f_bookSearch').value = title + (isbn ? ` (${isbn})` : '');
            document.getElementById('bookSearchDropdown').style.display = 'none';
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('#bookIdField')) {
                document.getElementById('bookSearchDropdown').style.display = 'none';
            }
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
