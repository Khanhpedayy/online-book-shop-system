<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Returns Intake — BookStore Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
    <div id="app-layout">
        <div id="sidebar-slot"></div>
        <div class="main-area">
            <div id="header-slot"></div>
            <main class="content-area p-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold mb-0 d-flex align-items-center gap-2"><i class="bi bi-arrow-return-left"></i>Returns Intake</h5>
                        <button class="btn btn-primary d-flex align-items-center gap-1" onclick="openNew()"><i class="bi bi-plus-lg"></i> New Return</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th style="width:140px">Return Code</th>
                                        <th style="width:130px">Order</th>
                                        <th>Reason</th>
                                        <th style="width:110px" class="text-end">Refund</th>
                                        <th style="width:120px">Status</th>
                                        <th style="width:140px">Date</th>
                                        <th style="width:100px"></th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <tr>
                                        <td colspan="7" class="text-center py-5 text-muted">Loading…</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="newModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Create Return Intake</h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3"><label class="form-label">Order ID <span
                                class="text-danger">*</span></label><input type="number" class="form-control"
                            id="f_orderId" required></div>
                    <div class="mb-3"><label class="form-label">Reason <span class="text-danger">*</span></label><input
                            type="text" class="form-control" id="f_reason" required
                            placeholder="e.g. Defective product"></div>
                    <div class="mb-3"><label class="form-label">Note</label><textarea class="form-control" id="f_note"
                            rows="2"></textarea></div>
                    <div class="mb-3"><label class="form-label">Refund Amount</label><input type="number"
                            class="form-control" id="f_refundAmount" min="0"></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-primary"
                        onclick="createReturn()">Create</button></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        const statusColor = { INTAKE: 'primary', PENDING_DECISION: 'warning', APPROVED: 'success', REJECTED: 'danger', COMPLETED: 'secondary' };
        let returns = [];

        async function init() {
            try { returns = await api.get('/staff/returns/intake'); } catch { returns = []; }
            render();
        }

        function render() {
            const tbody = document.getElementById('tableBody');
            if (!returns.length) { tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">No returns</td></tr>'; return; }
            tbody.innerHTML = returns.map(r => `<tr>
        <td class="font-monospace small fw-bold">${r.returnCode || '—'}</td>
        <td class="font-monospace small">${r.orderCode || '—'}</td>
        <td class="text-truncate" style="max-width:200px">${r.reason || '—'}</td>
        <td class="text-end">${(r.refundAmount || 0).toLocaleString()}</td>
        <td><span class="badge bg-${statusColor[r.status] || 'secondary'}">${r.status}</span></td>
        <td class="small text-muted">${r.createdAt ? new Date(r.createdAt).toLocaleString('vi-VN') : '—'}</td>
        <td>${r.status === 'INTAKE' ? `<button class="btn btn-sm btn-outline-danger" onclick="escalate(${r.id})">Escalate</button>` : ''}</td>
    </tr>`).join('');
        }

        function openNew() {
            ['f_orderId', 'f_reason', 'f_note', 'f_refundAmount'].forEach(id => document.getElementById(id).value = '');
            new bootstrap.Modal(document.getElementById('newModal')).show();
        }

        async function createReturn() {
            const data = {
                orderId: +document.getElementById('f_orderId').value,
                reason: document.getElementById('f_reason').value.trim(),
                note: document.getElementById('f_note').value.trim() || null,
                refundAmount: +document.getElementById('f_refundAmount').value || 0,
                requestedBy: 1,
            };
            if (!data.orderId || !data.reason) { showToast('Order ID and reason are required', 'warning'); return; }
            try {
                await api.post('/staff/returns/intake', data);
                showToast('Return created', 'success');
                bootstrap.Modal.getInstance(document.getElementById('newModal')).hide();
                returns = await api.get('/staff/returns/intake'); render();
            } catch (e) { showToast('Failed', 'danger'); }
        }

        async function escalate(id) {
            try { await api.put(`/staff/returns/intake/${id}/escalate`); showToast('Escalated', 'info'); returns = await api.get('/staff/returns/intake'); render(); }
            catch (e) { showToast('Failed', 'danger'); }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
