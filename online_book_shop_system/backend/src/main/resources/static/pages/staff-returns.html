<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Returns Intake — BookStore Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
    <div id="app-layout">
        <div id="sidebar-slot"></div>
        <div class="main-area">
            <div id="header-slot"></div>
            <main class="content-area p-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold mb-0 d-flex align-items-center gap-2"><i class="bi bi-arrow-return-left"></i>Tiếp nhận Trả hàng</h5>
                        <button class="btn btn-primary d-flex align-items-center gap-1" onclick="openNew()"><i class="bi bi-plus-lg"></i> Thêm Yêu cầu</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th style="width:140px">Mã Trả hàng</th>
                                        <th style="width:130px">Đơn hàng</th>
                                        <th>Lý do</th>
                                        <th style="width:110px" class="text-end">Hoàn tiền</th>
                                        <th style="width:120px">Trạng thái</th>
                                        <th style="width:140px">Ngày tạo</th>
                                        <th style="width:100px"></th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <tr>
                                        <td colspan="7" class="text-center py-5 text-muted">Đang tải…</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="newModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Create Return Intake</h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="newForm" class="needs-validation" novalidate onsubmit="event.preventDefault()">
                        <div class="mb-3">
                            <label class="form-label">Mã Đơn Hàng (Order Code) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="f_orderCode" required placeholder="VD: ORD-12345" oninput="resetOrderSearch()">
                                <button class="btn btn-outline-secondary" type="button" onclick="searchOrder()"><i class="bi bi-search"></i> Kiểm tra</button>
                            </div>
                            <div class="form-text text-success d-none" id="orderFoundMsg"></div>
                            <div class="invalid-feedback" id="orderErrorMsg">Vui lòng nhập mã đơn hàng hợp lệ.</div>
                            <input type="hidden" id="f_orderId">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Lý do trả hàng <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="f_reason" required placeholder="VD: Sản phẩm bị lỗi kỹ thuật">
                            <div class="invalid-feedback">Nêu rõ lý do trả hàng.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ghi chú thêm (Tùy chọn)</label>
                            <textarea class="form-control" id="f_note" rows="2" placeholder="Ghi chú hoàn cảnh..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số tiền Hoàn lại dự kiến (VND)</label>
                            <input type="number" class="form-control" id="f_refundAmount" min="0" placeholder="0">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="createReturn()">Tạo Yêu cầu</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        const statusColor = { INTAKE: 'primary', PENDING_DECISION: 'warning', APPROVED: 'success', REJECTED: 'danger', COMPLETED: 'secondary' };
        let returns = [];

        async function init() {
            try { returns = await api.get('/staff/returns/intake'); } catch { returns = []; }
            render();
        }

        function render() {
            const tbody = document.getElementById('tableBody');
            if (!returns.length) { tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">Không có yêu cầu trả hàng</td></tr>'; return; }
            tbody.innerHTML = returns.map(r => `<tr>
        <td class="font-monospace small fw-bold">${r.returnCode || '—'}</td>
        <td class="font-monospace small">${r.orderCode || '—'}</td>
        <td class="text-truncate" style="max-width:200px">${r.reason || '—'}</td>
        <td class="text-end">${(r.refundAmount || 0).toLocaleString()}</td>
        <td><span class="badge bg-${statusColor[r.status] || 'secondary'}">${r.status}</span></td>
        <td class="small text-muted">${r.createdAt ? new Date(r.createdAt).toLocaleString('vi-VN') : '—'}</td>
        <td>${r.status === 'PENDING' ? `<button class="btn btn-sm btn-outline-danger" onclick="escalate(${r.id})">Báo cáo MQL</button>` : ''}</td>
    </tr>`).join('');
        }

        function openNew() {
            document.getElementById('newForm').reset();
            document.getElementById('newForm').classList.remove('was-validated');
            document.getElementById('f_orderId').value = '';
            resetOrderSearch();
            new bootstrap.Modal(document.getElementById('newModal')).show();
        }

        function resetOrderSearch() {
            document.getElementById('f_orderCode').classList.remove('is-valid', 'is-invalid');
            document.getElementById('orderFoundMsg').classList.add('d-none');
            document.getElementById('orderErrorMsg').style.display = 'none';
        }

        async function searchOrder() {
            const code = document.getElementById('f_orderCode').value.trim();
            const msg = document.getElementById('orderFoundMsg');
            const err = document.getElementById('orderErrorMsg');
            const hidden = document.getElementById('f_orderId');
            const inp = document.getElementById('f_orderCode');
            if (!code) return;
            try {
                const orders = await api.get('/staff/orders?search=' + encodeURIComponent(code));
                const found = orders.find(o => o.orderCode === code);
                if (found) {
                    hidden.value = found.id;
                    msg.innerHTML = `Đã tìm thấy đơn hàng của: <strong>${found.customerName || 'Khách vãng lai'}</strong> (${found.status})`;
                    msg.classList.remove('d-none');
                    err.style.display = 'none';
                    inp.classList.remove('is-invalid');
                    inp.classList.add('is-valid');
                } else {
                    hidden.value = '';
                    msg.classList.add('d-none');
                    err.textContent = 'Không tìm thấy mã đơn hàng này trên hệ thống.';
                    err.style.display = 'block';
                    inp.classList.remove('is-valid');
                    inp.classList.add('is-invalid');
                }
            } catch {
                hidden.value = '';
                msg.classList.add('d-none');
                err.textContent = 'Lỗi kết nối khi tìm kiếm.';
                err.style.display = 'block';
                inp.classList.remove('is-valid');
                inp.classList.add('is-invalid');
            }
        }

        async function createReturn() {
            const form = document.getElementById('newForm');
            const orderIdVal = document.getElementById('f_orderId').value;
            
            if (!form.checkValidity() || !orderIdVal) {
                form.classList.add('was-validated');
                if (!orderIdVal && document.getElementById('f_orderCode').value) {
                    document.getElementById('orderErrorMsg').textContent = 'Vui lòng bấm nút Kiểm tra để xác thực mã đơn.';
                    document.getElementById('orderErrorMsg').style.display = 'block';
                    document.getElementById('f_orderCode').classList.add('is-invalid');
                }
                return;
            }
            
            const data = {
                orderId: +orderIdVal,
                reason: document.getElementById('f_reason').value.trim(),
                note: document.getElementById('f_note').value.trim() || null,
                refundAmount: +document.getElementById('f_refundAmount').value || 0,
                requestedBy: 1, // Fixed staff user as requested
            };
            try {
                await api.post('/staff/returns/intake', data);
                showToast('Tạo Yêu cầu trả hàng thành công!', 'success');
                bootstrap.Modal.getInstance(document.getElementById('newModal')).hide();
                returns = await api.get('/staff/returns/intake'); 
                render();
            } catch (e) { showToast('Thất bại: ' + e.message, 'danger'); }
        }

        async function escalate(id) {
            try { await api.put(`/staff/returns/intake/${id}/escalate`); showToast('Escalated', 'info'); returns = await api.get('/staff/returns/intake'); render(); }
            catch (e) { showToast('Failed', 'danger'); }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
