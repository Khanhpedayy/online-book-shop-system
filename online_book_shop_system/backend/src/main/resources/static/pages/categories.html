<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quản lý Danh mục — Quản trị BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
    <div id="app-layout">
        <div id="sidebar-slot"></div>
        <div class="main-area">
            <div id="header-slot"></div>
            <main class="content-area p-4">
                <div class="d-flex justify-content-between align-items-start mb-4">
                    <div>
                        <h2 class="fw-bold mb-1"><i class="bi bi-bookmark me-2"></i>Quản lý Danh mục</h2>
                        <p class="text-muted mb-0">Quản lý các danh mục sách trong hệ thống</p>
                    </div>
                    <button class="btn btn-primary d-flex align-items-center gap-2" onclick="openForm()">
                        <i class="bi bi-plus-lg"></i> Thêm Danh mục
                    </button>
                </div>

                <!-- KPI Cards -->
                <div class="row g-3 mb-4" id="kpiCards"></div>

                <!-- Filters + Table -->
                <div class="card">
                    <div class="card-body">
                        <div class="mb-3"><input type="text" class="form-control" style="max-width:350px"
                                placeholder="Tìm kiếm theo tên danh mục…" id="searchInput" oninput="render()"></div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Danh mục</th>
                                        <th>Slug</th>
                                        <th style="width:100px">Số sách</th>
                                        <th style="width:80px">Thứ tự</th>
                                        <th style="width:100px">Trạng thái</th>
                                        <th style="width:150px">Hành động</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <tr>
                                        <td colspan="6" class="text-center py-5 text-muted">Đang tải…</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div class="modal fade" id="formModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="formTitle">➕ Thêm Danh mục mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="categoryForm" novalidate>
                        <div class="mb-3">
                            <label class="form-label">Tên danh mục <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="f_name" required maxlength="100"
                                placeholder="VD: Sách Văn học">
                            <div class="invalid-feedback">Vui lòng nhập tên danh mục</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mô tả</label>
                            <textarea class="form-control" id="f_description" rows="3" maxlength="500"
                                placeholder="Mô tả ngắn về danh mục"></textarea>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Thứ tự hiển thị</label>
                                <input type="number" class="form-control" id="f_sortOrder" min="0" value="0"
                                    placeholder="0">
                            </div>
                            <div class="col-md-6" id="activeToggleGroup" style="display:none">
                                <label class="form-label">Trạng thái hoạt động</label>
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input" type="checkbox" id="f_isActive" checked>
                                    <label class="form-check-label" for="f_isActive">Đang hoạt động</label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="saveCategory()" id="btnSave">Tạo mới
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Offcanvas -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="detailDrawer" style="width:450px">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title fw-bold" id="detailTitle"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body" id="detailBody"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        let categories = [];
        let editingId = null;

        async function init() {
            try { categories = await api.get('/management/categories'); } catch { categories = []; }
            renderKPI();
            render();
        }

        function renderKPI() {
            const total = categories.length;
            const active = categories.filter(c => c.isActive).length;
            const inactive = total - active;
            const totalBooks = categories.reduce((s, c) => s + (c.bookCount || 0), 0);
            document.getElementById('kpiCards').innerHTML = `
                <div class="col-md-3"><div class="stats-card"><div class="stats-icon" style="background:#eef2ff;color:#4f46e5"><i class="bi bi-bookmark"></i></div><div class="stats-label">Tổng danh mục</div><div class="stats-value">${total}</div></div></div>
                <div class="col-md-3"><div class="stats-card"><div class="stats-icon" style="background:#ecfdf5;color:#059669"><i class="bi bi-check-circle"></i></div><div class="stats-label">Đang hoạt động</div><div class="stats-value">${active}</div></div></div>
                <div class="col-md-3"><div class="stats-card"><div class="stats-icon" style="background:#fef2f2;color:#dc2626"><i class="bi bi-x-circle"></i></div><div class="stats-label">Ngừng hoạt động</div><div class="stats-value">${inactive}</div></div></div>
                <div class="col-md-3"><div class="stats-card"><div class="stats-icon" style="background:#eff6ff;color:#3b82f6"><i class="bi bi-book"></i></div><div class="stats-label">Tổng số sách</div><div class="stats-value">${totalBooks}</div></div></div>`;
        }

        function render() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = categories.filter(c => !q || c.name.toLowerCase().includes(q) || (c.slug || '').toLowerCase().includes(q));
            const tbody = document.getElementById('tableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">Không tìm thấy danh mục nào</td></tr>';
                return;
            }
            tbody.innerHTML = filtered.map(c => `<tr>
                <td>
                    <div class="d-flex align-items-center gap-3">
                        <div style="width:36px;height:36px;border-radius:50%;background:${c.isActive ? '#eef2ff' : '#f1f5f9'};display:flex;align-items:center;justify-content:center">
                            <i class="bi bi-bookmark" style="color:${c.isActive ? '#4f46e5' : '#94a3b8'}"></i>
                        </div>
                        <div>
                            <div class="fw-semibold">${c.name}</div>
                            ${c.description ? `<div class="text-muted small text-truncate" style="max-width:250px">${c.description}</div>` : ''}
                        </div>
                    </div>
                </td>
                <td><code class="small">${c.slug || '—'}</code></td>
                <td><span class="badge bg-primary">${c.bookCount || 0} sách</span></td>
                <td>${c.sortOrder || 0}</td>
                <td><span class="badge bg-${c.isActive ? 'success' : 'secondary'}">${c.isActive ? 'Hoạt động' : 'Ngừng'}</span></td>
                <td>
                    <button class="btn btn-sm btn-light" title="Xem" onclick="showDetail(${c.id})"><i class="bi bi-eye"></i></button>
                    <button class="btn btn-sm btn-light" title="Sửa" onclick="openForm(${c.id})"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-sm btn-outline-danger" title="Xóa" onclick="deleteCategory(${c.id})"><i class="bi bi-trash"></i></button>
                </td>
            </tr>`).join('');
        }

        function openForm(id) {
            const form = document.getElementById('categoryForm');
            form.reset();
            form.classList.remove('was-validated');
            if (id) {
                const c = categories.find(x => x.id === id);
                if (!c) return;
                editingId = id;
                document.getElementById('formTitle').textContent = '✏️ Chỉnh sửa Danh mục';
                document.getElementById('btnSave').textContent = 'Cập nhật';
                document.getElementById('f_name').value = c.name || '';
                document.getElementById('f_description').value = c.description || '';
                document.getElementById('f_sortOrder').value = c.sortOrder || 0;
                document.getElementById('f_isActive').checked = c.isActive !== false;
                document.getElementById('activeToggleGroup').style.display = 'block';
            } else {
                editingId = null;
                document.getElementById('formTitle').textContent = '➕ Thêm Danh mục mới';
                document.getElementById('btnSave').textContent = 'Tạo mới';
                document.getElementById('activeToggleGroup').style.display = 'none';
            }
            new bootstrap.Modal(document.getElementById('formModal')).show();
        }

        async function saveCategory() {
            const form = document.getElementById('categoryForm');
            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                showToast('Vui lòng điền đầy đủ thông tin bắt buộc', 'warning');
                return;
            }

            const payload = {
                name: document.getElementById('f_name').value.trim(),
                description: document.getElementById('f_description').value.trim() || null,
                sortOrder: parseInt(document.getElementById('f_sortOrder').value) || 0,
            };
            if (editingId) {
                payload.isActive = document.getElementById('f_isActive').checked;
            }

            try {
                if (editingId) {
                    await api.put(`/management/categories/${editingId}`, payload);
                    showToast('Danh mục đã được cập nhật', 'success');
                } else {
                    await api.post('/management/categories', payload);
                    showToast('Danh mục đã được tạo thành công', 'success');
                }
                bootstrap.Modal.getInstance(document.getElementById('formModal')).hide();
                categories = await api.get('/management/categories');
                renderKPI();
                render();
            } catch (e) {
                showToast(e.message || 'Lỗi khi lưu danh mục', 'danger');
            }
        }

        async function deleteCategory(id) {
            const c = categories.find(x => x.id === id);
            if (!c) return;
            if (!confirm(`Bạn có chắc muốn xóa danh mục "${c.name}"?`)) return;
            try {
                await api.delete(`/management/categories/${id}`);
                showToast('Danh mục đã được xóa', 'success');
                categories = await api.get('/management/categories');
                renderKPI();
                render();
            } catch (e) {
                showToast(e.message || 'Không thể xóa danh mục', 'danger');
            }
        }

        function showDetail(id) {
            const c = categories.find(x => x.id === id);
            if (!c) return;
            document.getElementById('detailTitle').textContent = c.name;
            document.getElementById('detailBody').innerHTML = `
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div style="width:56px;height:56px;border-radius:50%;background:${c.isActive ? '#eef2ff' : '#f1f5f9'};display:flex;align-items:center;justify-content:center">
                        <i class="bi bi-bookmark" style="font-size:24px;color:${c.isActive ? '#4f46e5' : '#94a3b8'}"></i>
                    </div>
                    <div>
                        <h5 class="fw-bold mb-1">${c.name}</h5>
                        <span class="badge bg-${c.isActive ? 'success' : 'secondary'} me-1">${c.isActive ? 'Hoạt động' : 'Ngừng'}</span>
                        <span class="badge bg-primary">${c.bookCount || 0} sách</span>
                    </div>
                </div>
                <table class="table table-bordered table-sm mb-4">
                    <tr><th style="width:120px">Slug</th><td><code>${c.slug || '—'}</code></td></tr>
                    <tr><th>Mô tả</th><td>${c.description || '—'}</td></tr>
                    <tr><th>Thứ tự</th><td>${c.sortOrder || 0}</td></tr>
                    <tr><th>Số sách</th><td>${c.bookCount || 0}</td></tr>
                </table>
                <div class="text-muted small">
                    Tạo lúc: ${c.createdAt ? new Date(c.createdAt).toLocaleString('vi-VN') : '—'}<br>
                    Cập nhật: ${c.updatedAt ? new Date(c.updatedAt).toLocaleString('vi-VN') : '—'}
                </div>
                <div class="mt-3">
                    <button class="btn btn-outline-secondary btn-sm" onclick="bootstrap.Offcanvas.getInstance(document.getElementById('detailDrawer')).hide(); openForm(${c.id})">
                        <i class="bi bi-pencil me-1"></i>Chỉnh sửa
                    </button>
                </div>`;
            new bootstrap.Offcanvas(document.getElementById('detailDrawer')).show();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
