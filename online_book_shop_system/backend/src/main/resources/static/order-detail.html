<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order detail – Online Book Shop</title>
    <link rel="stylesheet" href="css/shop.css">
    <style>
        .shop-page .card { margin-bottom: 16px; }
        .item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid var(--shop-border);
            padding: 12px 0;
        }
        .timeline {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .step { text-align: center; flex: 1; min-width: 80px; }
        .circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #cbd5e1;
            margin: 0 auto 6px;
        }
        .circle.active { background: #15803d; }
        .circle.pending { background: #ea580c; }
        .circle.muted { background: #e2e8f0; }
    </style>
</head>
<body class="shop-page">

<header class="shop-header">
    <div class="logo"><a href="index.html">📚 Online Book Shop</a></div>
    <div class="search-bar">
        <input type="search" id="searchInput" placeholder="Search books..." aria-label="Search books">
        <button type="button" id="searchBtn">Search</button>
    </div>
    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="profile.html" id="profileLink" style="display:none;">Profile</a>
        <a href="order-history.html" id="ordersLink" style="display:none;">Orders</a>
        <a href="reviews.html" id="reviewsLink" style="display:none;">Reviews</a>
        <a href="support.html" id="supportLink" style="display:none;">Support</a>
        <a href="notifications.html" id="notifLink" style="display:none;">🔔 <span id="notifBadge" style="background:#6366f1;color:#fff;border-radius:10px;padding:1px 7px;font-size:0.75rem;font-weight:700;margin-left:2px;"></span></a>
        <a href="login.html" id="loginLink">Login</a>
        <a href="#" id="logoutLink" style="display:none;">Logout</a>
        <a href="cart.html" class="cart shop-cart-link">🛒 <span id="headerCartCount">$0.00 (0)</span></a>
    </nav>
</header>

<main class="shop-main">
    <div class="card" id="orderInfo">Loading…</div>
    <div class="card">
        <h3 style="margin-top:0;">Items</h3>
        <div id="orderItems"></div>
    </div>
    <div class="card">
        <h3 style="margin-top:0;">Progress</h3>
        <p class="shop-muted" style="margin:0 0 12px;font-size:0.9rem;">Payment and shipment are tracked separately. PayOS orders show payment first, then warehouse steps.</p>
        <div class="timeline" id="timeline"></div>
    </div>
</main>

<footer class="shop-footer">© Online Book Shop</footer>

<script src="js/auth-session.js"></script>
<script src="js/shop-header.js"></script>
<script src="js/order-detail.js"></script>
</body>
</html>
