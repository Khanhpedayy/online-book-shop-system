<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout – Online Book Shop</title>
    <link rel="stylesheet" href="css/shop.css">
    <style>
        .checkout-title { font-size: 1.75rem; margin: 0 0 24px; }
        .shop-checkout-grid .card h2 { margin-top: 0; font-size: 1.2rem; }
        #orderForm .shop-btn { width: 100%; margin-top: 8px; }
        .success { color: #15803d; }
        .error { color: #b91c1c; }
    </style>
</head>
<body class="shop-page">

<header class="shop-header">
    <div class="logo"><a href="index.html">📚 Online Book Shop</a></div>
    <div class="search-bar">
        <input type="search" id="searchInput" placeholder="Search books..." aria-label="Search books">
        <button type="button" id="searchBtn">Search</button>
    </div>
    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="profile.html" id="profileLink" style="display:none;">Profile</a>
        <a href="order-history.html" id="ordersLink" style="display:none;">Orders</a>
        <a href="login.html" id="loginLink">Login</a>
        <a href="#" id="logoutLink" style="display:none;">Logout</a>
        <a href="cart.html" class="cart shop-cart-link">🛒 <span id="headerCartCount">$0.00 (0)</span></a>
    </nav>
</header>

<main class="shop-main">
    <h1 class="checkout-title">Checkout</h1>

    <div class="shop-checkout-grid">
        <div class="card shop-card">
            <h2>Shipping</h2>
            <form id="orderForm">
                <input class="shop-input" id="orderEmail" type="email" placeholder="Email" required>
                <input class="shop-input" id="orderRecipient" placeholder="Recipient name" required>
                <input class="shop-input" id="orderPhone" placeholder="Phone" required>
                <input class="shop-input" id="orderAddress" placeholder="Full address" required>
                <select class="shop-select" id="paymentMethod">
                    <option value="COD">Cash on delivery</option>
                    <option value="PAYOS">Pay with PayOS</option>
                </select>
                <button class="shop-btn" id="submitBtn" type="submit">Place order</button>
            </form>
            <div id="orderResult"></div>
        </div>

        <div class="card shop-card">
            <h2>Order summary</h2>
            <div id="checkoutSummary">Loading…</div>
        </div>
    </div>
</main>

<footer class="shop-footer">© Online Book Shop</footer>

<script src="js/auth-session.js"></script>
<script src="js/shop-header.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
