<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cart – Online Book Shop</title>
    <style>
        :root {
            --header-bg: #1a1a2e;
            --header-text: #eee;
            --accent: #c9a227;
            --accent-hover: #b8921f;
            --card-bg: #fff;
            --body-bg: #f8f6f1;
            --text: #333;
            --border: #e0ddd8;
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            margin: 0;
            background: var(--body-bg);
            color: var(--text);
            line-height: 1.5;
        }
        .header-top {
            background: var(--header-bg);
            color: var(--header-text);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .search-bar{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:10px;
        }

        .search-bar input{
            width:1000px;
            padding:8px 14px;
            border-radius:20px;
            border:1px solid #ccc;
        }

        #searchBtn{
            padding:8px 16px;
            border:none;
            background:#c9a227;
            color:white;
            border-radius:20px;
            cursor:pointer;
        }

        #searchBtn:hover{
            background:#a88b1f;
        }
        .logo { font-size: 1.35rem; font-weight: 700; }
        .logo a { color: inherit; text-decoration: none; }
        .nav { display: flex; gap: 24px; align-items: center; }
        .nav a { color: var(--header-text); text-decoration: none; font-size: 0.95rem; }
        .nav a:hover { color: var(--accent); }
        .header-cart { color: var(--header-text); text-decoration: none; font-weight: 500; }
        .header-cart:hover { color: var(--accent); }
        .cart-count { color: var(--accent); }

        main { max-width: 720px; margin: 0 auto; padding: 32px 20px 48px; }
        .section { margin-bottom: 32px; }
        .section h2 { font-size: 1.35rem; margin-bottom: 16px; }
        .cart-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }
        .cart-item:last-child { border-bottom: none; }
        .btn {
            background: var(--accent);
            color: #1a1a2e;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-secondary { background: #444; color: #fff; }
        .btn-secondary:hover { background: #333; }
        .cart-item button { padding: 6px 12px; font-size: 0.85rem; }

        .checkout-form {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .checkout-form label { display: block; margin-top: 12px; font-weight: 500; font-size: 0.9rem; }
        .checkout-form input {
            width: 100%;
            padding: 10px 12px;
            margin-top: 4px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
        }
        #orderResult { margin-top: 12px; font-weight: 600; }
        #orderResult.success { color: #0d9488; }
        #orderResult.error { color: #b91c1c; }

        footer {
            background: var(--header-bg);
            color: var(--header-text);
            padding: 20px 24px;
            text-align: center;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

<header class="header-top">

    <div class="logo">
        <a href="index.html">📚 Online Book Shop</a>
    </div>



    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="cart.html" class="header-cart">
            Cart (<span id="headerCartCount">0</span>)
        </a>
    </nav>

</header>

<main>
    <section class="section">
        <h2>Your Cart</h2>
        <div class="cart-box">
            <div id="cartContainer">Loading…</div>
            <button class="btn" onclick="goToCheckout()">Checkout</button>
        </div>
    </section>
</main>

<footer>© Online Book Shop</footer>

<script src="cart.js"></script>
</body>
</html>
