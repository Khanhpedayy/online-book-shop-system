<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book details – Online Book Shop</title>
    <link rel="stylesheet" href="css/shop.css">
    <style>
        .book-detail-wrap {
            max-width: 1100px;
            margin: 24px auto;
            padding: 0 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            align-items: flex-start;
        }
        .book-detail-wrap img#bookImage {
            width: 100%;
            max-width: 280px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .book-info { flex: 1; min-width: 260px; }
        .book-info h1 { margin-top: 0; font-size: 1.65rem; }
        .price { font-size: 1.5rem; color: var(--shop-price); font-weight: 700; margin: 12px 0; }
        .variant select {
            width: 100%;
            max-width: 360px;
            padding: 10px 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid var(--shop-border);
            font: inherit;
        }
        .qty { margin-top: 16px; }
        .qty input { width: 72px; padding: 8px; border-radius: 8px; border: 1px solid var(--shop-border); }
        .related { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .related h2 { margin-bottom: 16px; font-size: 1.25rem; }
        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }
        .related-grid .card {
            cursor: pointer;
            text-align: center;
            padding: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .related-grid .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        }
        .related-grid .card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            border-radius: 8px;
        }
        /* ── Reviews ── */
        .reviews-section { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .reviews-section h2 { font-size: 1.25rem; margin-bottom: 6px; }
        .rv-summary { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
        .rv-avg-score { font-size: 2.8rem; font-weight: 800; color: #1e293b; line-height: 1; }
        .rv-avg-stars { color: #f59e0b; font-size: 1.4rem; }
        .rv-avg-count { color: #94a3b8; font-size: 0.9rem; }
        .rv-card {
            background: var(--shop-card-bg);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-left: 4px solid #f59e0b;
        }
        .rv-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; justify-content: space-between; }
        .rv-stars { color: #f59e0b; font-size: 1.1rem; letter-spacing: 1px; flex-shrink: 0; }
        .rv-report-btn {
            margin-left: auto; padding: 4px 10px; border-radius: 6px; border: 1px solid #fca5a5;
            background: transparent; color: #dc2626; cursor: pointer; font-size: 0.8rem;
            font-weight: 600; transition: background .2s;
        }
        .rv-report-btn:hover { background: #fee2e2; }
        .rv-stars { color: #f59e0b; font-size: 1.1rem; letter-spacing: 1px; }
        .rv-author { font-weight: 700; font-size: 0.9rem; }
        .rv-date { color: #94a3b8; font-size: 0.82rem; }
        .rv-title { font-weight: 700; margin-bottom: 4px; }
        .rv-content { color: #374151; font-size: 0.93rem; line-height: 1.6; white-space: pre-wrap; }
        .rv-empty { color: #94a3b8; text-align: center; padding: 28px 0; }
    </style>
</head>
<body class="shop-page">

<header class="shop-header">
    <div class="logo"><a href="index.html">Online Book Shop</a></div>
    <div class="search-bar">
        <input type="search" id="searchInput" placeholder="Search books..." aria-label="Search books">
        <button type="button" id="searchBtn">Search</button>
    </div>
    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="profile.html" id="profileLink" style="display:none;">Profile</a>
        <a href="order-history.html" id="ordersLink" style="display:none;">Orders</a>
        <a href="reviews.html" id="reviewsLink" style="display:none;">Reviews</a>
        <a href="support.html" id="supportLink" style="display:none;">Support</a>
        <a href="notifications.html" id="notifLink" style="display:none;">🔔 <span id="notifBadge" style="background:#6366f1;color:#fff;border-radius:10px;padding:1px 7px;font-size:0.75rem;font-weight:700;margin-left:2px;"></span></a>
        <a href="login.html" id="loginLink">Login</a>
        <a href="#" id="logoutLink" style="display:none;">Logout</a>
        <a href="cart.html" class="cart shop-cart-link">🛒 <span id="headerCartCount">$0.00 (0)</span></a>
    </nav>
</header>

<div class="shop-breadcrumb">
    <a href="index.html">Home</a> /
    <span id="breadcrumbCategory">Books</span> /
    <span id="breadcrumbTitle"></span>
</div>

<div class="book-detail-wrap">
    <img id="bookImage" alt="Cover">

    <div class="book-info">
        <h1 id="title"></h1>
        <p class="price" id="price"></p>
        <p><strong>ISBN:</strong> <span id="isbn"></span></p>
        <p><strong>Publisher:</strong> <span id="publisherName"></span></p>
        <p><strong>Year:</strong> <span id="publicationYear"></span></p>
        <p><strong>Availability:</strong> <span id="stockStatus"></span></p>
        <div class="variant">
            <label for="variantSelect">Format</label>
            <select id="variantSelect">
                <option value="">Select version</option>
            </select>
        </div>
        <p id="description"></p>
        <div class="qty">
            <label for="qty">Quantity</label><br>
            <input type="number" id="qty" value="1" min="1">
        </div>
        <button type="button" class="btn" id="addCartBtn" style="margin-top:16px;">Add to cart</button>
    </div>
</div>

<div class="related">
    <h2>Related books</h2>
    <div class="related-grid" id="relatedBooks"></div>
</div>

<div class="reviews-section">
    <h2>⭐ Customer Reviews</h2>
    <div id="reviewSummary" class="rv-summary" style="display:none;">
        <div class="rv-avg-score" id="avgScore">0</div>
        <div>
            <div class="rv-avg-stars" id="avgStars"></div>
            <div class="rv-avg-count" id="avgCount"></div>
        </div>
    </div>
    <div id="reviewsList"><p class="rv-empty">Loading reviews...</p></div>
</div>

<footer class="shop-footer">© Online Book Shop</footer>

<script src="js/auth-session.js"></script>
<script src="js/shop-header.js"></script>
<script src="js/book.js"></script>
</body>
</html>
