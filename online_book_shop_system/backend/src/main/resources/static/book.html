<!DOCTYPE html>
<html>
<head>
    <title>Book Details</title>

    <style>

        body{
            font-family:Segoe UI;
            background:#f8f6f1;
            margin:0;
        }

        .header-top{
            background:#1a1a2e;
            color:white;
            padding:12px 24px;
            display:flex;
            align-items:center;
            justify-content:space-between;
        }

        .logo{
            font-size:20px;
            font-weight:bold;
        }

        .search-bar{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:10px;
        }

        .search-bar input{
            width:1000px;
            padding:8px 14px;
            border-radius:20px;
            border:1px solid #ccc;
        }

        #searchBtn{
            padding:8px 16px;
            border:none;
            background:#c9a227;
            color:white;
            border-radius:20px;
            cursor:pointer;
        }

        #searchBtn:hover{
            background:#a88b1f;
        }

        .nav{
            display:flex;
            gap:20px;
        }

        .nav a{
            color:white;
            text-decoration:none;
            font-weight:500;
        }

        .nav a:hover{
            color:#c9a227;
        }
        header{
            background:white;
            padding:15px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 2px 6px rgba(0,0,0,0.08);
        }

        header a{
            text-decoration:none;
            font-weight:bold;
            color:#333;
        }

        .breadcrumb{
            max-width:1000px;
            margin:20px auto;
            font-size:14px;
        }

        .breadcrumb a{
            text-decoration:none;
            color:#555;
        }

        .breadcrumb a:hover{
            color:#c9a227;
        }

        .variant{
            margin-top:10px;
        }

        .variant select{
            padding:6px;
            margin-top:4px;
        }

        #stockStatus{
            font-weight:bold;
        }

        .container{
            max-width:1000px;
            margin:40px auto;
            display:flex;
            gap:40px;
        }

        img{
            width:280px;
            border-radius:8px;
        }

        .book-info h1{
            margin-top:0;
        }

        .price{
            font-size:24px;
            color:#b45309;
            font-weight:bold;
        }

        .qty{
            margin-top:15px;
        }

        input{
            width:60px;
            padding:6px;
        }

        .btn{
            background:#c9a227;
            border:none;
            padding:12px 18px;
            border-radius:6px;
            cursor:pointer;
            margin-top:20px;
            font-weight:bold;
        }

        .btn:hover{
            background:#b8951f;
        }

        .related{
            max-width:1000px;
            margin:40px auto;
        }

        .related h2{
            margin-bottom:20px;
        }

        .related-grid{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:20px;
        }

        .card{
            background:white;
            padding:10px;
            border-radius:6px;
            text-align:center;
            cursor:pointer;
        }

        .card img{
            width:100%;
            height:200px;
            object-fit:cover;
        }

    </style>
</head>

<body>

<header class="header-top">

    <div class="logo">
        <a href="index.html">📚 Online Book Shop</a>
    </div>

    <div class="search-bar">

        <input type="text" id="searchInput" placeholder="Search books...">

        <button id="searchBtn">Search</button>

    </div>

    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="cart.html" class="header-cart">
            Cart (<span id="headerCartCount">0</span>)
        </a>
    </nav>

</header>

<div class="breadcrumb">
    <a href="index.html">Home</a> /
    <span id="breadcrumbCategory">Books</span> /
    <span id="breadcrumbTitle"></span>
</div>

<div class="container">

    <img id="bookImage">

    <div class="book-info">

        <h1 id="title"></h1>

        <p class="price" id="price"></p>

        <p><b>ISBN:</b> <span id="isbn"></span></p>

        <p><b>Publisher:</b> <span id="publisherName"></span></p>

        <p><b>Year:</b> <span id="publicationYear"></span></p>

        <p><b>Availability:</b> <span id="stockStatus"></span></p>

        <div class="variant">
            <label>Format</label>
            <select id="variantSelect">
                <option value="">Select version</option>
            </select>
        </div>

        <p id="description"></p>

        <div class="qty">
            Quantity
            <input type="number" id="qty" value="1" min="1">
        </div>

        <button class="btn" id="addCartBtn">
            Add to Cart
        </button>

    </div>

</div>

<div class="related">

    <h2>Related Books</h2>

    <div class="related-grid" id="relatedBooks"></div>

</div>

<script src="js/book.js"></script>

</body>
</html>
