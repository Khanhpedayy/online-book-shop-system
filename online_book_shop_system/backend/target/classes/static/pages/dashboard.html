<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bảng tổng quan — Quản trị BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
    <style>
        .kpi-card {
            border: none; border-radius: 12px; padding: 20px 24px;
            background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.06);
            transition: transform .2s, box-shadow .2s;
        }
        .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
        .kpi-icon {
            width: 48px; height: 48px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 22px;
        }
        .kpi-value { font-size: 28px; font-weight: 700; line-height: 1.2; }
        .kpi-label { font-size: 13px; color: #64748b; margin-top: 2px; }
        .kpi-change { font-size: 12px; margin-top: 4px; }
        .dashboard-card { border: none; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        .dashboard-card .card-header {
            background: transparent; border-bottom: 1px solid #f1f5f9;
            font-weight: 600; font-size: 15px; padding: 16px 20px;
        }
        .alert-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f8fafc; }
        .alert-row:last-child { border-bottom: none; }
        .alert-badge-out { background: #fef2f2; color: #dc2626; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .alert-badge-low { background: #fffbeb; color: #d97706; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .cat-bar { height: 8px; border-radius: 4px; background: #e2e8f0; overflow: hidden; }
        .cat-bar-fill { height: 100%; border-radius: 4px; transition: width .5s ease; }
    </style>
</head>

<body>
    <div id="app-layout">
        <div id="sidebar-slot"></div>
        <div class="main-area">
            <div id="header-slot"></div>
            <main class="content-area p-4">
                <!-- Header -->
                <div class="mb-4">
                    <h2 class="fw-bold mb-1"><i class="bi bi-grid-1x2 me-2"></i>Bảng tổng quan</h2>
                    <p class="text-muted mb-0">Tổng quan nhanh về sách, danh mục và tồn kho</p>
                </div>

                <!-- KPI Row -->
                <div class="row g-3 mb-4" id="kpiRow">
                    <div class="col"><div class="kpi-card animate-pulse" style="height:100px"></div></div>
                    <div class="col"><div class="kpi-card animate-pulse" style="height:100px"></div></div>
                    <div class="col"><div class="kpi-card animate-pulse" style="height:100px"></div></div>
                    <div class="col"><div class="kpi-card animate-pulse" style="height:100px"></div></div>
                </div>

                <!-- Second KPI Row -->
                <div class="row g-3 mb-4" id="kpiRow2"></div>

                <!-- Content Row -->
                <div class="row g-4">
                    <!-- Recent Books -->
                    <div class="col-lg-7">
                        <div class="card dashboard-card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span><i class="bi bi-clock me-2"></i>Sách thêm gần đây</span>
                                <a href="books.html" class="text-decoration-none small">Xem tất cả →</a>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover mb-0">
                                        <thead>
                                            <tr>
                                                <th class="ps-3">Tên sách</th>
                                                <th>Danh mục</th>
                                                <th>Trạng thái</th>
                                                <th>Tồn kho</th>
                                                <th>Ngày tạo</th>
                                            </tr>
                                        </thead>
                                        <tbody id="recentBooksBody">
                                            <tr><td colspan="5" class="text-center py-4 text-muted">Đang tải…</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Stock Alerts -->
                    <div class="col-lg-5">
                        <div class="card dashboard-card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span><i class="bi bi-exclamation-triangle me-2"></i>Cảnh báo tồn kho</span>
                                <a href="stock.html" class="text-decoration-none small">Quản lý →</a>
                            </div>
                            <div class="card-body" id="stockAlertsBody">
                                <div class="text-center py-4 text-muted">Đang tải…</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Category Distribution -->
                <div class="row g-4 mt-2">
                    <div class="col-12">
                        <div class="card dashboard-card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span><i class="bi bi-pie-chart me-2"></i>Phân bổ theo danh mục</span>
                                <a href="categories.html" class="text-decoration-none small">Quản lý danh mục →</a>
                            </div>
                            <div class="card-body" id="categoryStatsBody">
                                <div class="text-center py-4 text-muted">Đang tải…</div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        let data = null;

        async function init() {
            try {
                data = await api.get('/management/dashboard');
            } catch (e) {
                console.error('Dashboard load failed:', e);
                data = {
                    totalBooks: 0, activeBooks: 0, draftBooks: 0,
                    totalCategories: 0, activeCategories: 0,
                    totalStockQuantity: 0, outOfStockBooks: 0, lowStockBooks: 0,
                    recentBooks: [], stockAlerts: [], categoryStats: [],
                };
            }
            renderKPI();
            renderRecentBooks();
            renderStockAlerts();
            renderCategoryStats();
        }

        function renderKPI() {
            const d = data;
            document.getElementById('kpiRow').innerHTML = `
                <div class="col-md-3">
                    <div class="kpi-card">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div class="kpi-value">${d.totalBooks}</div>
                                <div class="kpi-label">Tổng số sách</div>
                            </div>
                            <div class="kpi-icon" style="background:#eef2ff;color:#4f46e5"><i class="bi bi-book"></i></div>
                        </div>
                        <div class="kpi-change text-primary"><i class="bi bi-check-circle me-1"></i>${d.activeBooks} đang hoạt động</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="kpi-card">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div class="kpi-value">${d.totalCategories}</div>
                                <div class="kpi-label">Danh mục</div>
                            </div>
                            <div class="kpi-icon" style="background:#f0fdf4;color:#16a34a"><i class="bi bi-tags"></i></div>
                        </div>
                        <div class="kpi-change text-success"><i class="bi bi-check-circle me-1"></i>${d.activeCategories} đang hoạt động</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="kpi-card">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div class="kpi-value">${d.totalStockQuantity.toLocaleString()}</div>
                                <div class="kpi-label">Tổng tồn kho</div>
                            </div>
                            <div class="kpi-icon" style="background:#eff6ff;color:#2563eb"><i class="bi bi-box-seam"></i></div>
                        </div>
                        <div class="kpi-change text-info"><i class="bi bi-box me-1"></i>${d.totalBooks - d.outOfStockBooks} sách có hàng</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="kpi-card">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div class="kpi-value text-${d.outOfStockBooks > 0 ? 'danger' : 'success'}">${d.outOfStockBooks}</div>
                                <div class="kpi-label">Hết hàng</div>
                            </div>
                            <div class="kpi-icon" style="background:${d.outOfStockBooks > 0 ? '#fef2f2' : '#f0fdf4'};color:${d.outOfStockBooks > 0 ? '#dc2626' : '#16a34a'}"><i class="bi bi-exclamation-circle"></i></div>
                        </div>
                        <div class="kpi-change text-${d.lowStockBooks > 0 ? 'warning' : 'muted'}">
                            <i class="bi bi-exclamation-triangle me-1"></i>${d.lowStockBooks} sắp hết hàng
                        </div>
                    </div>
                </div>`;
            document.getElementById('kpiRow2').innerHTML = '';
        }

        function renderRecentBooks() {
            const tbody = document.getElementById('recentBooksBody');
            if (!data.recentBooks || data.recentBooks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Chưa có sách nào</td></tr>';
                return;
            }
            const statusLabels = { ACTIVE: 'Hoạt động', DRAFT: 'Nháp', INACTIVE: 'Ngừng' };
            const statusColors = { ACTIVE: 'success', DRAFT: 'warning', INACTIVE: 'secondary' };
            tbody.innerHTML = data.recentBooks.map(b => `<tr>
                <td class="ps-3 fw-semibold">${b.title}</td>
                <td><span class="badge bg-light text-dark">${b.categoryName || 'Chưa phân loại'}</span></td>
                <td><span class="badge bg-${statusColors[b.status] || 'secondary'}">${statusLabels[b.status] || b.status}</span></td>
                <td>
                    <span class="badge bg-${b.stockQuantity === 0 ? 'danger' : b.stockQuantity <= 5 ? 'warning' : 'success'}">
                        ${b.stockQuantity === 0 ? 'Hết hàng' : b.stockQuantity}
                    </span>
                </td>
                <td class="small text-muted">${b.createdAt ? new Date(b.createdAt).toLocaleDateString('vi-VN') : '—'}</td>
            </tr>`).join('');
        }

        function renderStockAlerts() {
            const container = document.getElementById('stockAlertsBody');
            if (!data.stockAlerts || data.stockAlerts.length === 0) {
                container.innerHTML = '<div class="text-center py-4"><i class="bi bi-check-circle-fill text-success fs-1 d-block mb-2"></i><span class="text-muted">Tất cả sách đều có đủ hàng!</span></div>';
                return;
            }
            container.innerHTML = data.stockAlerts.map(a => `
                <div class="alert-row">
                    <div class="flex-grow-1">
                        <div class="fw-semibold" style="font-size:14px">${a.title}</div>
                        <div class="small text-muted">Tồn kho: ${a.stockQuantity} cuốn</div>
                    </div>
                    <span class="${a.alertType === 'OUT_OF_STOCK' ? 'alert-badge-out' : 'alert-badge-low'}">
                        ${a.alertType === 'OUT_OF_STOCK' ? 'Hết hàng' : 'Sắp hết'}
                    </span>
                </div>
            `).join('');
        }

        function renderCategoryStats() {
            const container = document.getElementById('categoryStatsBody');
            if (!data.categoryStats || data.categoryStats.length === 0) {
                container.innerHTML = '<div class="text-center py-4 text-muted">Chưa có dữ liệu danh mục</div>';
                return;
            }
            const maxBooks = Math.max(...data.categoryStats.map(c => c.bookCount), 1);
            const colors = ['#4f46e5', '#059669', '#d97706', '#dc2626', '#7c3aed', '#0891b2', '#e11d48', '#84cc16'];
            container.innerHTML = `<div class="row">
                ${data.categoryStats.map((c, i) => `
                    <div class="col-md-6 mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="fw-semibold" style="font-size:14px">${c.categoryName}</span>
                            <span class="small text-muted">${c.bookCount} sách · ${c.totalStock} tồn kho</span>
                        </div>
                        <div class="cat-bar">
                            <div class="cat-bar-fill" style="width:${(c.bookCount / maxBooks * 100).toFixed(0)}%;background:${colors[i % colors.length]}"></div>
                        </div>
                    </div>
                `).join('')}
            </div>`;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
