<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Tra cứu Khách hàng — Quản trị BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
    <div id="app-layout">
        <div id="sidebar-slot"></div>
        <div class="main-area">
            <div id="header-slot"></div>
            <main class="content-area p-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="fw-bold mb-0 d-flex align-items-center gap-2"><i
                                class="bi bi-person-lines-fill"></i>Tra cứu Khách hàng</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-4">
                            <input type="text" class="form-control form-control-lg"
                                placeholder="Tìm theo tên, số điện thoại, hoặc email (tối thiểu 2 ký tự)…"
                                id="searchInput" oninput="debounceSearch()">
                        </div>
                        <div id="resultArea">
                            <div class="text-center py-5 text-muted"><i class="bi bi-search"></i>Nhập ít nhất 2 ký tự để
                                tìm kiếm
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        let timer = null;
        function debounceSearch() { clearTimeout(timer); timer = setTimeout(doSearch, 400); }

        async function doSearch() {
            const q = document.getElementById('searchInput').value.trim();
            const area = document.getElementById('resultArea');
            if (q.length < 2) { area.innerHTML = '<div class="text-center py-5 text-muted"><i class="bi bi-search"></i>Nhập ít nhất 2 ký tự để tìm kiếm</div>'; return; }
            area.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
            try {
                const data = await api.get(`/staff/customers?search=${encodeURIComponent(q)}`);
                if (!data || !data.length) { area.innerHTML = '<div class="text-center py-5 text-muted">Không tìm thấy khách hàng nào</div>'; return; }
                area.innerHTML = `<div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Họ tên</th><th>Email</th><th style="width:130px">Số điện thoại</th><th style="width:80px" class="text-center">Đơn hàng</th><th style="width:100px">Trạng thái</th><th style="width:130px">Ngày tham gia</th></tr></thead><tbody>
            ${data.map(c => `<tr>
                <td class="fw-semibold">${c.fullName || '—'}</td>
                <td>${c.email || '—'}</td>
                <td>${c.phone || '—'}</td>
                <td class="text-center"><span class="badge bg-primary">${c.orderCount || 0}</span></td>
                <td><span class="badge bg-${c.status === 'ACTIVE' ? 'success' : 'secondary'}">${c.status === 'ACTIVE' ? 'HOẠT ĐỘNG' : c.status === 'INACTIVE' ? 'BỊ KHÓA' : (c.status || '—')}</span></td>
                <td class="small text-muted">${c.createdAt ? new Date(c.createdAt).toLocaleDateString('vi-VN') : '—'}</td>
            </tr>`).join('')}
        </tbody></table></div>`;
            } catch (e) { area.innerHTML = '<div class="alert alert-danger">Tìm kiếm thất bại</div>'; }
        }
    </script>
</body>

</html>
