<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Incident Reports — BookStore Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
    <div id="app-layout">
        <div id="sidebar-slot"></div>
        <div class="main-area">
            <div id="header-slot"></div>
            <main class="content-area p-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold mb-0 d-flex align-items-center gap-2"><i class="bi bi-exclamation-triangle"></i>Báo cáo Sự cố</h5>
                        <button class="btn btn-danger d-flex align-items-center gap-1" onclick="openReport()"><i class="bi bi-plus-lg"></i> Ghi nhận
                            Sự cố</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th style="width:150px">Loại sự cố</th>
                                        <th style="width:130px">Đơn hàng</th>
                                        <th style="width:120px">Bản sao</th>
                                        <th>Mô tả chi tiết</th>
                                        <th style="width:130px">Người ghi nhận</th>
                                        <th style="width:100px">Trạng thái</th>
                                        <th style="width:140px">Ngày tạo</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <tr>
                                        <td colspan="7" class="text-center py-5 text-muted">Đang tải…</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="reportModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Report Incident</h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="reportForm" class="needs-validation" novalidate onsubmit="event.preventDefault()">
                        <div class="mb-3"><label class="form-label">Loại Sự cố <span class="text-danger">*</span></label>
                            <select class="form-select" id="f_type" required>
                                <option value="MISSING">Thiếu hàng (Missing Item)</option>
                                <option value="DAMAGED">Hư hỏng (Damaged Item)</option>
                                <option value="PICKING_ERROR">Lỗi lấy hàng (Picking Error)</option>
                                <option value="OTHER">Khác (Other)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mã Đơn Hàng (Tùy chọn)</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="f_orderCode" placeholder="VD: ORD-1234" oninput="resetOrderSearch()">
                                <button class="btn btn-outline-secondary" type="button" onclick="searchOrder()"><i class="bi bi-search"></i> Kiểm tra</button>
                            </div>
                            <div class="form-text text-success d-none" id="orderFoundMsg"></div>
                            <div class="invalid-feedback" id="orderErrorMsg">Không tìm thấy mã đơn hàng.</div>
                            <input type="hidden" id="f_orderId">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mã Bản sao / Barcode (Tùy chọn)</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="f_copyCode" placeholder="Quét hoặc nhập mã..." oninput="resetCopySearch()">
                                <button class="btn btn-outline-secondary" type="button" onclick="searchCopy()"><i class="bi bi-search"></i> Kiểm tra</button>
                            </div>
                            <div class="form-text text-success d-none" id="copyFoundMsg"></div>
                            <div class="invalid-feedback" id="copyErrorMsg">Không tìm thấy mã bản sao.</div>
                            <input type="hidden" id="f_copyId">
                        </div>
                        <div class="mb-3"><label class="form-label">Mô tả chi tiết <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="f_description" rows="3" placeholder="Mô tả sự cố..." required></textarea>
                            <div class="invalid-feedback">Nêu rõ mô tả sự cố.</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">Hủy</button><button type="button" class="btn btn-danger"
                        onclick="submitReport()">Ghi nhận</button></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        const typeColor = { MISSING: 'danger', DAMAGED: 'warning', PICKING_ERROR: 'secondary', OTHER: 'light' };
        const typeName = { MISSING: 'Thiếu hàng', DAMAGED: 'Hư hỏng', PICKING_ERROR: 'Lỗi lấy hàng', OTHER: 'Khác' };
        const statusColor = { OPEN: 'danger', RESOLVED: 'success', CLOSED: 'secondary' };
        let incidents = [];

        async function init() {
            try { incidents = await api.get('/staff/incidents'); } catch { incidents = []; }
            render();
        }

        function render() {
            const tbody = document.getElementById('tableBody');
            if (!incidents.length) { tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">Không có báo cáo sự cố nào</td></tr>'; return; }
            tbody.innerHTML = incidents.map(i => `<tr>
        <td><span class="badge bg-${typeColor[i.type] || 'secondary'}">${typeName[i.type] || i.type}</span></td>
        <td>${i.orderCode ? `<span class="font-monospace small">${i.orderCode}</span>` : '—'}</td>
        <td>${i.copyCode ? `<span class="badge bg-light text-dark border">${i.copyCode}</span>` : '—'}</td>
        <td class="text-truncate" style="max-width:250px">${i.description || '—'}</td>
        <td>${i.reportedByName || '—'}</td>
        <td><span class="badge bg-${statusColor[i.status] || 'secondary'}">${i.status}</span></td>
        <td class="small text-muted">${i.createdAt ? new Date(i.createdAt).toLocaleString('vi-VN') : '—'}</td>
    </tr>`).join('');
        }

        function openReport() {
            document.getElementById('reportForm').reset();
            document.getElementById('reportForm').classList.remove('was-validated');
            document.getElementById('f_orderId').value = '';
            document.getElementById('f_copyId').value = '';
            resetOrderSearch();
            resetCopySearch();
            new bootstrap.Modal(document.getElementById('reportModal')).show();
        }

        function resetOrderSearch() {
            document.getElementById('f_orderCode').classList.remove('is-valid', 'is-invalid');
            document.getElementById('orderFoundMsg').classList.add('d-none');
            document.getElementById('orderErrorMsg').style.display = 'none';
        }

        function resetCopySearch() {
            document.getElementById('f_copyCode').classList.remove('is-valid', 'is-invalid');
            document.getElementById('copyFoundMsg').classList.add('d-none');
            document.getElementById('copyErrorMsg').style.display = 'none';
        }

        async function searchOrder() {
            const code = document.getElementById('f_orderCode').value.trim();
            const msg = document.getElementById('orderFoundMsg'), err = document.getElementById('orderErrorMsg');
            const hidden = document.getElementById('f_orderId'), inp = document.getElementById('f_orderCode');
            if (!code) return;
            try {
                const orders = await api.get('/staff/orders?search=' + encodeURIComponent(code));
                const found = orders.find(o => o.orderCode === code);
                if (found) {
                    hidden.value = found.id;
                    msg.innerHTML = `Đã tìm thấy đơn hàng (${found.status})`; msg.classList.remove('d-none');
                    err.style.display = 'none'; inp.classList.remove('is-invalid'); inp.classList.add('is-valid');
                } else { throw new Error('Not found'); }
            } catch {
                hidden.value = ''; msg.classList.add('d-none');
                err.textContent = 'Không tìm thấy hoặc lỗi kết nối.';
                err.style.display = 'block'; inp.classList.remove('is-valid'); inp.classList.add('is-invalid');
            }
        }

        async function searchCopy() {
            const code = document.getElementById('f_copyCode').value.trim();
            const msg = document.getElementById('copyFoundMsg'), err = document.getElementById('copyErrorMsg');
            const hidden = document.getElementById('f_copyId'), inp = document.getElementById('f_copyCode');
            if (!code) return;
            try {
                const copies = await api.get('/inventory/copies/search?q=' + encodeURIComponent(code));
                if (copies && copies.length > 0) {
                    hidden.value = copies[0].id;
                    msg.innerHTML = `Bản sao: <strong>${copies[0].bookTitle}</strong> (${copies[0].status})`; msg.classList.remove('d-none');
                    err.style.display = 'none'; inp.classList.remove('is-invalid'); inp.classList.add('is-valid');
                } else { throw new Error('Not found'); }
            } catch {
                hidden.value = ''; msg.classList.add('d-none');
                err.textContent = 'Không tìm thấy hoặc lỗi kết nối.';
                err.style.display = 'block'; inp.classList.remove('is-valid'); inp.classList.add('is-invalid');
            }
        }

        async function submitReport() {
            const form = document.getElementById('reportForm');
            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }
            
            const orderCodeStr = document.getElementById('f_orderCode').value.trim();
            const copyCodeStr = document.getElementById('f_copyCode').value.trim();
            const orderIdVal = document.getElementById('f_orderId').value;
            const copyIdVal = document.getElementById('f_copyId').value;
            
            if (orderCodeStr && !orderIdVal) {
                document.getElementById('f_orderCode').classList.add('is-invalid');
                document.getElementById('orderErrorMsg').textContent = 'Vui lòng xác thực mã đơn.';
                document.getElementById('orderErrorMsg').style.display = 'block';
                return;
            }
            if (copyCodeStr && !copyIdVal) {
                document.getElementById('f_copyCode').classList.add('is-invalid');
                document.getElementById('copyErrorMsg').textContent = 'Vui lòng xác thực mã bản sao.';
                document.getElementById('copyErrorMsg').style.display = 'block';
                return;
            }

            const data = {
                type: document.getElementById('f_type').value,
                orderId: orderIdVal ? +orderIdVal : undefined,
                copyId: copyIdVal ? +copyIdVal : undefined,
                reportedBy: 1, // Fixed staff user
                description: document.getElementById('f_description').value.trim(),
            };
            try {
                await api.post('/staff/incidents', data);
                showToast('Đã ghi nhận sự cố thành công!', 'success');
                bootstrap.Modal.getInstance(document.getElementById('reportModal')).hide();
                incidents = await api.get('/staff/incidents'); render();
            } catch (e) { showToast('Thất bại: ' + e.message, 'danger'); }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
