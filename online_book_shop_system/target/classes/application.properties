spring.application.name=OnlineBookShop

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=OnlineBookShop;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=OnlineBookShopSecretKeyForJWTAuthenticationMustBe256BitsLong!!
jwt.expiration=86400000
