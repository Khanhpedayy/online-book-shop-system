<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Incident Report | Staff</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-semibold" th:href="@{/staff/dashboard}">Staff Panel</a>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" th:href="@{/staff/orders}">Orders</a>
      <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Logout</a>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h1 class="h4 mb-1">Incident Report</h1>
      <div class="text-muted">Báo lỗi picking/inventory (missing/damaged/wrong pick…)</div>
    </div>
  </div>

  <div class="alert alert-success py-2" th:if="${successMsg}" th:text="${successMsg}">OK</div>
  <div class="alert alert-danger py-2" th:if="${errorMsg}" th:text="${errorMsg}">ERR</div>

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form method="post" th:action="@{/staff/incidents}" class="row g-2">
        <div class="col-12 col-md-4">
          <label class="form-label small text-muted">Entity table</label>
          <select class="form-select form-select-sm" name="entityTable" required>
            <option value="orders">orders</option>
            <option value="order_items">order_items</option>
            <option value="copies">copies</option>
            <option value="lots">lots</option>
            <option value="payments">payments</option>
          </select>
        </div>
        <div class="col-12 col-md-4">
          <label class="form-label small text-muted">Entity ID (optional)</label>
          <input class="form-control form-control-sm" name="entityId" placeholder="VD: 123" />
        </div>
        <div class="col-12">
          <label class="form-label small text-muted">Note</label>
          <textarea class="form-control" rows="4" name="note" required
                    placeholder="Mô tả ngắn gọn: thiếu hàng / sách rách / scan nhầm copy..."></textarea>
        </div>
        <div class="col-12">
          <button class="btn btn-primary" type="submit">Submit</button>
        </div>
      </form>
    </div>
  </div>
</main>
</body>
</html>
