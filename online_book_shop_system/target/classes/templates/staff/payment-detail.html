<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Detail | Staff</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;}</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-semibold" th:href="@{/staff/dashboard}">Staff Panel</a>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" th:href="@{/staff/payments}">Payments</a>
      <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Logout</a>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h1 class="h4 mb-1">Payment Events</h1>
      <div class="text-muted">paymentId: <span class="mono" th:text="${paymentId}">1</span></div>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-primary" th:href="@{/staff/orders/{id}(id=${orderId})}">Open order</a>
      <form th:action="@{/staff/payments/{id}/recheck(id=${paymentId})}" method="post">
        <button class="btn btn-primary" type="submit">Recheck & sync</button>
      </form>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <div class="text-muted small mb-2">events_json</div>
      <pre class="mono bg-light p-3 rounded-3" style="white-space: pre-wrap;"
           th:text="${eventsJson != null ? eventsJson : 'NULL'}">NULL</pre>
    </div>
  </div>
</main>
</body>
</html>
