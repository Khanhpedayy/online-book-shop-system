<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Tạo Return Intake | Staff</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;}</style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-semibold" th:href="@{/staff/dashboard}">Staff Panel</a>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" th:href="@{/staff/orders}">Danh sách đơn</a>
      <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Đăng xuất</a>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h1 class="h4 mb-1">Tạo Return Intake</h1>
      <div class="text-muted">
        Order: <span class="mono" th:text="${v.orderCode}">ORD</span>
        <span class="mx-2">•</span>
        <span th:text="${v.shipName}">Name</span>
        <span class="mx-2">•</span>
        <span class="mono" th:text="${v.shipPhone}">Phone</span>
      </div>
    </div>
    <a class="btn btn-sm btn-outline-secondary" th:href="@{|/staff/orders/${v.orderId}|}">Quay lại order</a>
  </div>

  <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

  <div class="card border-0 shadow-sm mb-3">
    <div class="card-body">
      <form th:action="@{/staff/returns/create}" method="post" class="row g-2">
        <input type="hidden" name="orderId" th:value="${v.orderId}"/>
        <div class="col-12 col-md-6">
          <label class="form-label small text-muted">Reason</label>
          <input class="form-control form-control-sm" name="reason" placeholder="VD: Customer đổi ý / Hàng lỗi / ...">
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label small text-muted">Note</label>
          <input class="form-control form-control-sm" name="note" placeholder="Ghi chú nội bộ">
        </div>
        <div class="col-12">
          <button class="btn btn-sm btn-primary">Tạo return intake</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <div class="fw-semibold mb-2">Items trong order</div>
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead>
          <tr class="text-muted small">
            <th>OrderItemId</th>
            <th>SKU</th>
            <th>Tên</th>
            <th class="text-end">CopyId</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="it : ${v.orderItems}">
            <td class="mono" th:text="${it.id}">0</td>
            <td class="mono" th:text="${it.skuSnapshot}">SKU</td>
            <td th:text="${it.titleSnapshot}">Title</td>
            <td class="text-end mono" th:text="${it.copyId}">-</td>
          </tr>
          </tbody>
        </table>
        <div class="text-muted small">
          Lưu ý: bản demo này ưu tiên case order_item có <span class="mono">copyId</span> (per-copy). Khi scan, copyCode phải đúng copy đã bán.
        </div>
      </div>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
