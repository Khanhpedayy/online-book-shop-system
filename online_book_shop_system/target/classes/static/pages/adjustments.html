<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Điều chỉnh tồn kho — Quản trị BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
    <div id="app-layout">
        <div id="sidebar-slot"></div>
        <div class="main-area">
            <div id="header-slot"></div>
            <main class="content-area p-4">
                <div class="d-flex justify-content-between align-items-start mb-4">
                    <div>
                        <h2 class="fw-bold mb-1"><i class="bi bi-sliders"></i>Điều chỉnh tồn kho</h2>
                        <p class="text-muted mb-0">Theo dõi và quản lý mọi điều chỉnh tồn kho</p>
                    </div>
                    <button class="btn btn-primary d-flex align-items-center gap-1" onclick="openCreate()"><i
                            class="bi bi-plus-lg"></i> Điều chỉnh mới</button>
                </div>
                <div class="row g-3 mb-4" id="kpiCards"></div>
                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Mã điều chỉnh</th>
                                        <th style="width:130px">Loại</th>
                                        <th style="width:80px">SL</th>
                                        <th style="width:100px">Chiều</th>
                                        <th>Lý do</th>
                                        <th style="width:100px">Trạng thái</th>
                                        <th style="width:140px">Ngày tạo</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <tr>
                                        <td colspan="7" class="text-center py-5 text-muted">Đang tải…</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="createModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square me-1"></i> Điều chỉnh mới</h5><button
                        type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="adjForm" novalidate>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6"><label class="form-label">ID Biến thể <span
                                        class="text-danger">*</span></label><input type="number" class="form-control"
                                    id="f_variantId" required></div>
                            <div class="col-md-6"><label class="form-label">ID Lô hàng</label><input type="number"
                                    class="form-control" id="f_lotId"></div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-4"><label class="form-label">Loại <span
                                        class="text-danger">*</span></label><select class="form-select" id="f_type"
                                    required>
                                    <option value="DAMAGE"><i class="bi bi-lightning me-1"></i> Hư hỏng</option>
                                    <option value="CORRECTION"><i class="bi bi-wrench me-1"></i> Điều chỉnh</option>
                                    <option value="TRANSFER"><i class="bi bi-arrow-repeat me-1"></i> Luân chuyển
                                    </option>
                                    <option value="RETURN"> Trả hàng</option>
                                    <option value="WRITE_OFF"><i class="bi bi-pencil-square me-1"></i> Hủy bỏ</option>
                                </select></div>
                            <div class="col-md-4"><label class="form-label">Chiều <span
                                        class="text-danger">*</span></label><select class="form-select" id="f_direction"
                                    required>
                                    <option value="IN">NHẬP (+)</option>
                                    <option value="OUT">XUẤT (−)</option>
                                </select></div>
                            <div class="col-md-4"><label class="form-label">Số lượng <span
                                        class="text-danger">*</span></label><input type="number" class="form-control"
                                    id="f_quantity" min="1" required></div>
                        </div>
                        <div class="mb-3"><label class="form-label">Lý do <span
                                    class="text-danger">*</span></label><input type="text" class="form-control"
                                id="f_reason" required placeholder="VD: Ngập nước — 5 cuốn bị hỏng"></div>
                        <div class="mb-3"><label class="form-label">Ghi chú</label><textarea class="form-control"
                                id="f_note" rows="2"></textarea></div>
                    </form>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">Hủy</button><button type="button" class="btn btn-primary"
                        onclick="createAdj()">Tạo mới</button></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        const typeMap = { DAMAGE: { color: 'danger', icon: '<i class="bi bi-lightning me-1"></i>', label: 'Hư hỏng' }, CORRECTION: { color: 'info', icon: '<i class="bi bi-wrench me-1"></i>', label: 'Điều chỉnh' }, TRANSFER: { color: 'secondary', icon: '<i class="bi bi-arrow-repeat me-1"></i>', label: 'Luân chuyển' }, RETURN: { color: 'primary', icon: '', label: 'Trả hàng' }, WRITE_OFF: { color: 'dark', icon: '<i class="bi bi-pencil-square me-1"></i>', label: 'Hủy bỏ' } };
        const statusMap = { APPROVED: 'Đã duyệt', PENDING: 'Chờ duyệt', REJECTED: 'Từ chối' };
        let adjustments = [];

        async function init() {
            try { adjustments = await api.get('/inventory/adjustments'); } catch { adjustments = []; }
            renderKPI(); render();
        }

        function renderKPI() {
            const total = adjustments.length;
            const inQty = adjustments.filter(a => a.direction === 'IN').reduce((s, a) => s + a.quantity, 0);
            const outQty = adjustments.filter(a => a.direction === 'OUT').reduce((s, a) => s + a.quantity, 0);
            document.getElementById('kpiCards').innerHTML = `
        <div class="col-md-4"><div class="stats-card"><div class="stats-icon" style="background:#eff6ff;color:#3b82f6"><i class="bi bi-sliders"></i></div><div class="stats-label">Tổng Số Điều Chỉnh</div><div class="stats-value">${total}</div></div></div>
        <div class="col-md-4"><div class="stats-card"><div class="stats-icon" style="background:#ecfdf5;color:#059669"><i class="bi bi-plus-circle"></i></div><div class="stats-label">Tổng Nhập</div><div class="stats-value" style="color:#059669">+${inQty}</div></div></div>
        <div class="col-md-4"><div class="stats-card"><div class="stats-icon" style="background:#fef2f2;color:#ef4444"><i class="bi bi-dash-circle"></i></div><div class="stats-label">Tổng Xuất</div><div class="stats-value" style="color:#ef4444">−${outQty}</div></div></div>`;
        }

        function render() {
            const tbody = document.getElementById('tableBody');
            if (!adjustments.length) { tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">Không có điều chỉnh nào</td></tr>'; return; }
            tbody.innerHTML = adjustments.map(a => {
                const t = typeMap[a.type] || { color: 'secondary', icon: '', label: a.type };
                const st = statusMap[a.status] || a.status;
                return `<tr>
            <td><span class="font-monospace small fw-bold">${a.adjustmentCode || a.id}</span>${a.variantSku ? `<div class="text-muted" style="font-size:10px">${a.variantSku}</div>` : ''}</td>
            <td><span class="badge bg-${t.color}">${t.icon} ${t.label}</span></td>
            <td class="fw-bold">${a.quantity}</td>
            <td>${a.direction === 'IN' ? '<span class="text-success fw-bold">▲ NHẬP</span>' : '<span class="text-danger fw-bold">▼ XUẤT</span>'}</td>
            <td class="text-truncate" style="max-width:200px">${a.reason || '—'}</td>
            <td><span class="badge bg-${a.status === 'APPROVED' ? 'success' : a.status === 'PENDING' ? 'warning' : 'secondary'}">${st || '—'}</span></td>
            <td class="small text-muted">${a.createdAt ? new Date(a.createdAt).toLocaleString('vi-VN') : '—'}</td>
        </tr>`;
            }).join('');
        }

        function openCreate() {
            document.getElementById('adjForm').reset();
            document.getElementById('adjForm').classList.remove('was-validated');
            new bootstrap.Modal(document.getElementById('createModal')).show();
        }

        async function createAdj() {
            const form = document.getElementById('adjForm');
            if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
            const data = {
                variantId: +document.getElementById('f_variantId').value,
                lotId: document.getElementById('f_lotId').value ? +document.getElementById('f_lotId').value : undefined,
                type: document.getElementById('f_type').value,
                direction: document.getElementById('f_direction').value,
                quantity: +document.getElementById('f_quantity').value,
                reason: document.getElementById('f_reason').value.trim(),
                note: document.getElementById('f_note').value.trim() || undefined,
                createdBy: 1,
            };
            try {
                await api.post('/inventory/adjustments', data);
                showToast('Đã tạo điều chỉnh', 'success');
                bootstrap.Modal.getInstance(document.getElementById('createModal')).hide();
                adjustments = await api.get('/inventory/adjustments'); renderKPI(); render();
            } catch (e) { showToast('Thất bại', 'danger'); }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
