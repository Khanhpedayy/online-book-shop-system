spring.application.name=OnlineBookShop

# Same SQL Server as main, using the real database for integration tests
spring.datasource.url=jdbc:sqlserver://localhost:58907;databaseName=OnlineBookShop;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Logging for debug
logging.level.org.springframework.jdbc=DEBUG
